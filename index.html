function atualizarPrecoProjeto() {
  const li = _projetoPrecoAberto;
  document.getElementById('rcPreview').innerHTML = blocoCustoEPrecoHtml(
    calcularCustoReceita(lerFormularioCusto()),
    {
      precoAtual: li && li.unit_price ? li.unit_price : null,
      pedirPrecoFinal: true,
      rotuloBotao: '✅ Cliente aprovou, virar pedido',
      acaoBotao: 'aprovarProjeto(\'' + (li ? li.id : '') + '\', true)',
      botaoSecundarioRotulo: 'Só guardar o preço, ainda não aprovei com o cliente',
      botaoSecundarioAcao: 'salvarCotacaoProjeto(\'' + (li ? li.id : '') + '\')',
    });
}

// Calcular o preço não é a mesma coisa que o cliente ter dito sim — às
// vezes você só quer ver quanto custaria. Essa função monta o que seria
// gravado (preço, custo, gramas/horas por peça) sem decidir SE isso
// aprova o pedido ou só guarda a cotação; quem chama decide.
function montarCotacaoProjeto() {
  const form = lerFormularioCusto();
  const custo = calcularCustoReceita(form);
  const precoSugerido = precoAPartirDoCusto(custo.total, custoMultiplicador);
  if (!precoSugerido) { toast('Falta dizer quantos gramas a peça gasta e quantas horas ela demora.'); return null; }
  // O campo "vendeu por quanto" começa com a sugestão mas é editável —
  // é o que realmente vai pro pedido, pra dar conta de venda antiga,
  // negociação ou promoção que não bateu com a conta padrão.
  const precoFinalEl = document.getElementById('rcPrecoFinal');
  const preco = precoFinalEl ? parseFloat(precoFinalEl.value) : precoSugerido;
  if (!preco || preco <= 0) { toast('Escreve por quanto vendeu (ou vai vender) esse pedido.'); return null; }
  return {
    unit_price: preco,
    // Guarda o custo junto: é ele que a aba Margem vai usar pra saber se
    // esse projeto deu lucro de verdade lá na frente. Continua sendo o
    // custo calculado, não o preço editado — lucro real precisa disso.
    unit_cost_estimate: custo.total,
    // Gramas e horas são POR PEÇA (mesma convenção do product_recipes) —
    // guarda pra "Terminei de imprimir" puxar sozinho depois, já que
    // projeto não tem product_id pra ligar numa receita (patch-39).
    estimated_grams: form.estimated_grams || null,
    estimated_print_hours: form.estimated_print_hours || null,
  };
}

// Guarda o preço calculado SEM aprovar — o projeto continua esperando o
// cliente dizer sim, não entra na fila de impressão. Existe porque
// "ver quanto custaria" e "o cliente topou" viraram a mesma ação sem
// querer: terminar a conta de preço empurrava o projeto pra "virou
// pedido" mesmo quando era só uma simulação.
async function salvarCotacaoProjeto(lineItemId) {
  const cotacao = montarCotacaoProjeto();
  if (!cotacao) return;
  const { error } = await SUPA.from('order_line_items')
    .update(Object.assign({ updated_at: new Date().toISOString() }, cotacao)).eq('id', lineItemId);
  if (error) { toast('Erro: ' + error.message); return; }
  toast('Preço guardado: ' + fmtMoney(cotacao.unit_price) + '. Quando o cliente disser sim, é só abrir o projeto de novo e clicar em "Cliente aprovou".');
  await abrirGerenciarProjeto(lineItemId);
}

async function aprovarProjeto(lineItemId, comCalculadora) {
  const payload = { line_status: 'orcamento_aprovado', updated_at: new Date().toISOString() };

  if (comCalculadora) {
    const cotacao = montarCotacaoProjeto();
    if (!cotacao) return;
    Object.assign(payload, cotacao);
  } else {
    const preco = parseFloat(document.getElementById('projPreco').value);
    if (!preco || preco <= 0) { toast('Escreve quanto vai cobrar por esse projeto.'); return; }
    payload.unit_price = preco;
  }

  const { error } = await SUPA.from('order_line_items').update(payload).eq('id', lineItemId);
  if (error) { toast('Erro: ' + error.message); return; }

  // Sem isto o total do pedido continuava zerado depois de aprovar por
  // esta tela — o preço entrava na linha, mas não subia pro pedido.
  const li = _projetoPrecoAberto;
  if (li && li.order_id) await recalcularTotalPedido(li.order_id);

  closeModal();
  toast('Projeto aprovado por ' + fmtMoney(payload.unit_price) + '! Já entrou na fila de impressão.');
  await renderProjetos();
}

// Preço já foi calculado e guardado antes (salvarCotacaoProjeto) — só
// falta confirmar que o cliente disse sim. Não mexe no preço, só avança
// o status pra "aprovado" e o projeto entra na fila de impressão.
async function confirmarAprovarProjeto(lineItemId) {
  const li = await q(SUPA.from('order_line_items').select('order_id, unit_price').eq('id', lineItemId).maybeSingle());
  if (!li || !li.unit_price) { toast('Calcula o preço primeiro.'); return; }

    .update({ line_status: 'orcamento_aprovado', updated_at: new Date().toISOString() }).eq('id', lineItemId);
  if (error) { toast('Erro: ' + error.message); return; }
  if (li.order_id) await recalcularTotalPedido(li.order_id);
  toast('Aprovado por ' + fmtMoney(li.unit_price) + '! Já entrou na fila de impressão.');
  await abrirGerenciarProjeto(lineItemId);

async function excluirProjeto(lineItemId, orderId) {
  // Projeto que já baixou filamento do estoque (já imprimiu de verdade)
  // ou já tem pagamento registrado não pode ser apagado — excluir o
  // pedido some com esse histórico junto (pagamento é apagado em
  // cascata; filamento baixado vira um buraco sem explicação no
  // estoque). Achado com o Porta Anel: o botão dava erro sem dizer por
  // quê. Se o projeto já terminou, o caminho certo é deixar como
  // "Entregue"/"Cancelado" — ele já some sozinho da lista principal.
  const movimentos = await q(SUPA.from('filament_stock_movements').select('id').eq('order_line_item_id', lineItemId).limit(1));
  const pagamentos = orderId ? await q(SUPA.from('payments').select('id').eq('order_id', orderId).limit(1)) : [];
  if ((movimentos && movimentos.length > 0) || (pagamentos && pagamentos.length > 0)) {
    alert('Esse projeto já tem histórico de verdade — filamento baixado do estoque e/ou pagamento registrado. Apagar ele apagaria isso tudo junto, então não dá.\n\nSe já terminou, é só deixar o status como "Entregue" (ou "Cancelado") — ele já some sozinho da lista principal, com o botão "Ver os já finalizados" pra achar de novo se precisar.');
    return;
  }
  if (!confirm('Excluir esse projeto de vez? Não tem como desfazer.')) return;
  const { data: liData } = await SUPA.from('order_line_items').select('custom_reference_image_path, model_file_path').eq('id', lineItemId).maybeSingle();
  if (liData) {
    if (liData.custom_reference_image_path) await SUPA.storage.from('projetos-fotos').remove([liData.custom_reference_image_path]);
    if (liData.model_file_path) await SUPA.storage.from('modelos-3d').remove([liData.model_file_path]);
  }
  const { error } = orderId
    ? await SUPA.from('orders').delete().eq('id', orderId)
    : await SUPA.from('order_line_items').delete().eq('id', lineItemId);
  if (error) { toast('Erro: ' + error.message); return; }
  closeModal();
  toast('Projeto excluído.');
  await renderProjetos();
}

let pedidoDetalheId = null;

// orders.status nunca foi atualizado por nenhuma tela (fica sempre em
// "Vendo o preço", desde a criação) — quem diz de verdade se ainda tem
// trabalho num pedido é o status de cada peça dele, o mesmo que a Fila
// e o "Terminei de imprimir" já mantêm certinho. Pedido "fechado" é o
// que já tem pelo menos uma peça e todas elas terminaram (entregue) ou
// foram canceladas — não sobrou nada pra fazer.
function pedidoEstaFechado(itensDoPedido) {
  return itensDoPedido.length > 0 && itensDoPedido.every((it) => LINE_STATUS_ENCERRADO.indexOf(it.line_status) !== -1);
}

// Só esconde da lista principal — nada é apagado, e dá pra ver os
// finalizados de novo a qualquer hora clicando no botão.
let mostrarPedidosFinalizados = false;
function alternarPedidosFinalizados() {
  mostrarPedidosFinalizados = !mostrarPedidosFinalizados;
  renderPedidos();
}

// orders.status é campo morto (nunca sai de "Vendo o preço" — ver nota
// em LINE_STATUS_ENCERRADO). O status de verdade do pedido é o da peça
// que está mais atrasada: se tem uma peça ainda "Recebido" e outra já
// "Entregue", o pedido como um todo ainda não terminou, então mostra a
// mais pra trás — é ela que precisa de atenção.
function statusResumoPedido(itensDoPedido) {
  if (!itensDoPedido.length) return null;
  const ordem = Object.keys(LINE_STATUS_LABELS);
  let pior = itensDoPedido[0];
  itensDoPedido.forEach((it) => {
    if (ordem.indexOf(it.line_status) < ordem.indexOf(pior.line_status)) pior = it;
  });
  return pior.line_status;
}

// O nome da primeira peça, com "+N" se o pedido tiver mais — não cabe
// (nem ajuda) listar tudo numa lista de pedidos.
function resumoItensPedido(itensDoPedido) {
  if (!itensDoPedido.length) return '<span style="color:var(--muted); font-size:11px;">sem item</span>';
  const primeiro = itensDoPedido[0];
  const nome = primeiro.line_type === 'catalog' ? (primeiro.products ? primeiro.products.name : '—') : (primeiro.custom_description || 'Personalizado');
  const resto = itensDoPedido.length - 1;
  return escapeHtml(nome) + (resto > 0 ? ' <span style="color:var(--muted); font-size:11px;">+' + resto + '</span>' : '');
}

// Semáforo do pedido: dá pra imprimir ou falta coisa?
//
// A lista de pedidos não dizia nada sobre preparo — pra saber se uma
// venda estava pronta era preciso abrir o pedido, abrir cada item e
// contar os passos. Agora a cor responde de longe, e o texto diz o que
// falta em palavra, não em código.
/* A coluna diz O QUE FAZER, não o que falta.

   "1 pra mandar pra fila" e "1 sem arquivo" descrevem um estado interno
   do sistema, e quem lê tem que traduzir sozinho pra uma ação. Pior:
   listava três coisas ao mesmo tempo ("1 sem preço, 1 sem arquivo e 1
   sem colinha"), quando só a primeira dá pra fazer agora.

   Agora é UMA frase, no infinitivo, do próximo passo real. E cobre o
   pedido inteiro, não só o preparo: "entregar pro cliente" é tão
   próximo passo quanto "pedir a colinha". Foi o que faltou pro pedido
   do Batista, que estava embalado e aparecia como "1 pra mandar pra
   fila" — embalado já passou da impressão, e ninguém entendia o que o
   sistema estava pedindo. */

const ACOES_DA_PECA = {
  preco:      { ordem: 1,  texto: 'dizer o preço',           tom: 'atencao' },
  refazer:    { ordem: 2,  texto: 'deu errado — refazer',    tom: 'atencao' },
  arquivo:    { ordem: 3,  texto: 'pegar o arquivo da peça', tom: 'atencao' },
  colinha:    { ordem: 4,  texto: 'pedir a colinha',         tom: 'atencao' },
  fatiador:   { ordem: 5,  texto: 'abrir no fatiador',       tom: 'atencao' },
  mandar:     { ordem: 6,  texto: 'mandar pra imprimir',     tom: 'pode' },
  na_fila:    { ordem: 7,  texto: 'pôr na impressora',       tom: 'pode' },
  imprimindo: { ordem: 8,  texto: 'imprimindo agora',        tom: 'andando' },
  acabamento: { ordem: 9,  texto: 'dar o acabamento',        tom: 'pode' },
  entregar:   { ordem: 10, texto: 'entregar pro cliente',    tom: 'pode' },
  a_caminho:  { ordem: 11, texto: 'a caminho do cliente',    tom: 'andando' },
};

// A próxima coisa a fazer com UMA peça. Null quando não há mais nada.
function proximaAcaoDaPeca(it) {
  const st = it.line_status;
  if (st === 'entregue' || st === 'cancelado') return null;
  if (st === 'orcamento_pendente') return 'preco';
  if (st === 'falhou_reimprimir') return 'refazer';
  if (st === 'enviado') return 'a_caminho';
  if (st === 'embalado') return 'entregar';
  if (st === 'pos_processamento') return 'acabamento';

  // Arquivo e colinha são conferidos ANTES do status de produção de
  // propósito: existe peça na fila sem arquivo nenhum (entrou antes
  // deste fluxo existir), e ela precisa aparecer como problema, não
  // como "imprimindo agora".
  const p = passosDoPreparo(it);
  if (!p[0].pronto) return 'arquivo';
  if (!p[1].pronto) return 'colinha';
  if (st === 'imprimindo') return 'imprimindo';
  if (st === 'fila_impressao') return 'na_fila';
  if (!p[2].pronto) return 'fatiador';
  return 'mandar';
}

function preparoDoPedido(itensDoPedido) {
  // Só peça entregue ou cancelada sai da conta. Estar na fila NÃO
  // significa estar preparada: antes deste fluxo qualquer peça entrava
  // na Fila só por mudar de status, e é por isso que hoje existem peças
  // imprimindo sem arquivo e sem colinha. Se eu ignorasse quem já está
  // na fila, os pedidos do Marco e do Bernardo apareceriam VERDES com o
  // Pikachu e o Cine-Companion sem arquivo nenhum — um semáforo que
  // mente é pior que semáforo nenhum.
  // A ação do pedido é a MAIS ATRASADA das peças dele: não adianta
  // mostrar "entregar" se ainda tem peça sem arquivo.
  const acoes = itensDoPedido.map(proximaAcaoDaPeca).filter(Boolean);
  // ordem 99 põe os acabados no fim ao organizar por esta coluna — quem
  // não tem mais nada a fazer não disputa atenção com quem tem.
  if (!acoes.length) return { tom: 'feito', texto: 'acabou', quantas: 0, ordem: 99 };

  let escolhida = acoes[0];
  acoes.forEach((a) => { if (ACOES_DA_PECA[a].ordem < ACOES_DA_PECA[escolhida].ordem) escolhida = a; });
  const quantas = acoes.filter((a) => a === escolhida).length;
  const def = ACOES_DA_PECA[escolhida];
  // A contagem só aparece quando é mais de uma. Com uma peça, "1 dizer
  // o preço" só põe um número no caminho da frase.
  return { tom: def.tom, texto: def.texto, quantas: quantas > 1 ? quantas : 0, ordem: def.ordem };
}

const TOM_DA_ACAO = {
  atencao: { bg: '#fff6e5', fg: '#8a5b00', b: '#ffd894', icone: '⚠️' },
  pode:    { bg: '#e8f1ff', fg: '#1f4f9c', b: '#c3d9f7', icone: '👉' },
  andando: { bg: '#f2f2f5', fg: '#5b5b66', b: '#e0e0e6', icone: '⏳' },
  feito:   { bg: '#e9f7ef', fg: '#1f6b3b', b: '#b7e4c7', icone: '✅' },
};

function seloDoPreparo(p) {
  const c = TOM_DA_ACAO[p.tom] || TOM_DA_ACAO.andando;
  return '<span style="display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:600;'
    + ' background:' + c.bg + '; color:' + c.fg + '; border:1px solid ' + c.b + ';">'
    + c.icone + ' ' + escapeHtml(p.texto) + '</span>'
    + (p.quantas ? '<div style="color:var(--muted); font-size:10.5px; margin-top:3px;">em ' + p.quantas + ' peças</div>' : '');
}

/* Cabeçalho que ordena, como no Excel: clica no título e a lista se
   organiza por ele; clica de novo e inverte. A seta mostra por qual
   coluna está ordenado e pra que lado — sem isso, quem clicou não tem
   como saber se a lista mudou porque ele mandou ou sozinha.

   O padrão de cada coluna é o que a pessoa espera ao clicar: texto
   começa de A pra Z, dinheiro e data começam do maior/mais novo. */

function thOrdenavel(campo, rotulo, estado, funcao) {
  const ativo = estado.campo === campo;
  const seta = ativo ? (estado.desc ? ' ▼' : ' ▲') : ' <span style="opacity:.25;">↕</span>';
  return '<th style="cursor:pointer; user-select:none; white-space:nowrap;" onclick="' + funcao + '(\'' + campo + '\')"'
    + ' title="Clique pra organizar por aqui">' + escapeHtml(rotulo) + seta + '</th>';
}

// Por qual coluna cada tela está ordenada agora, e o padrão de cada
// uma — o que a pessoa espera ver ao abrir a tela sem clicar em nada.
const ORDENS = {
  pedidos:    { campo: 'criado', desc: true },
  produtos:   { campo: 'nome',   desc: false },
  clientes:   { campo: 'nome',   desc: false },
  filamentos: { campo: 'nome',   desc: false },
  financeiro: { campo: 'falta',  desc: true },
};

// Colunas que começam do MAIOR no primeiro clique. Dinheiro, data e
// quantidade: ninguém clica em "Total" querendo ver o mais barato.
const COMECAM_GRANDE = ['criado', 'total', 'preco', 'margem', 'estoque', 'custo', 'pago', 'falta'];

function ordenarTabela(tabela, campo, redesenhar) {
  const o = ORDENS[tabela];
  if (o.campo === campo) o.desc = !o.desc;
  else { o.campo = campo; o.desc = COMECAM_GRANDE.indexOf(campo) !== -1; }
  redesenhar();
}

// Ordena uma lista pela coluna escolhida. `chave` devolve o valor de
// comparação daquela linha; `desempate` decide quem vem primeiro quando
// duas linhas empatam — sem ele, ordenar por uma coluna repetida
// (categoria, material) embaralharia a lista a cada redesenho.
function aplicarOrdem(lista, tabela, chave, desempate) {
  const o = ORDENS[tabela];
  return lista.slice().sort((a, b) => {
    const ka = chave(a, o.campo), kb = chave(b, o.campo);
    let r;
    if (typeof ka === 'string' || typeof kb === 'string') {
      // localeCompare pt-BR: sem isso "Ângela" vai pro fim da lista.
      r = String(ka).localeCompare(String(kb), 'pt-BR');
    } else {
      r = (ka || 0) - (kb || 0);
    }
    if (r === 0) return desempate ? desempate(a, b) : 0;
    return o.desc ? -r : r;
  });
}

function ordenarPedidos(campo) { ordenarTabela('pedidos', campo, renderPedidos); }
function ordenarProdutos(campo) { ordenarTabela('produtos', campo, desenharProdutos); }
function ordenarClientes(campo) { ordenarTabela('clientes', campo, renderClientes); }
function ordenarFilamentos(campo) { ordenarTabela('filamentos', campo, renderFilamentos); }
function ordenarFinanceiro(campo) { ordenarTabela('financeiro', campo, renderFinanceiro); }

// Ordem do fluxo de trabalho, não alfabética: ordenar status por letra
// colocaria "Cancelado" antes de "Imprimindo", que não quer dizer nada.
const ORDEM_DOS_STATUS = Object.keys(LINE_STATUS_LABELS);
const ORDEM_DO_PAGAMENTO = ['aguardando_sinal', 'sinal_pago', 'pago_total'];

function chaveDeOrdemDoPedido(o, itensDoPedido, statusPagamento, campo) {
  if (campo === 'cliente') return ((o.customers ? o.customers.name : o.customer_name) || '').toLowerCase();
  if (campo === 'criado') return new Date(o.created_at).getTime();
  if (campo === 'item') {
    const p = itensDoPedido[0];
    if (!p) return '';
    return ((p.line_type === 'catalog' ? (p.products ? p.products.name : '') : p.custom_description) || '').toLowerCase();
  }
  if (campo === 'acao') return preparoDoPedido(itensDoPedido).ordem;
  if (campo === 'status') {
    const st = statusResumoPedido(itensDoPedido);
    const i = ORDEM_DOS_STATUS.indexOf(st);
    return i === -1 ? 999 : i;
  }
  if (campo === 'total') return Number(o.total_amount) || 0;
  if (campo === 'pagamento') {
    const i = ORDEM_DO_PAGAMENTO.indexOf(statusPagamento);
    return i === -1 ? 999 : i;
  }
  return 0;
}

async function renderPedidos() {
  if (pedidoDetalheId) return renderPedidoDetalhe(pedidoDetalheId);

  const el = document.getElementById('tab-pedidos');
  el.innerHTML = '<div class="empty">Carregando...</div>';
  const orders = await q(SUPA.from('orders').select('*, customers(name)').order('created_at', { ascending: false }));
  const statuses = await q(SUPA.from('orders_payment_status').select('*'));
  const statusById = {};
  statuses.forEach((s) => { statusById[s.order_id] = s; });
  // A coluna "o que fazer agora" olha o passo das medidas, que lê a
  // receita do produto — sem isto ela cobraria "anotar o fatiador" de
  // peça que já tem tempo guardado.
  await getReceitas();
  // Traz também os campos de preparo (do produto e da própria linha),
  // pra lista poder dizer o que falta em cada pedido sem abrir um por
  // um — que era a reclamação: "e quais são essas peças?".
  const itens = await q(SUPA.from('order_line_items')
    .select('id, order_id, line_status, line_type, custom_description, model_file_path, ai_slicing_tips, open_slicer_status, products(name, model_file_path, ai_slicing_tips, open_slicer_status)').order('created_at'));
  const itensPorPedido = {};
  itens.forEach((it) => {
    if (!itensPorPedido[it.order_id]) itensPorPedido[it.order_id] = [];
    itensPorPedido[it.order_id].push(it);
  });

  const fechados = orders.filter((o) => pedidoEstaFechado(itensPorPedido[o.id] || []));
  const abertos = orders.filter((o) => !pedidoEstaFechado(itensPorPedido[o.id] || []));
  const listaExibida = (mostrarPedidosFinalizados ? orders : abertos).slice();

  // Ordena pela coluna que a pessoa clicou. A chave é calculada uma vez
  // por pedido e guardada: "o que fazer agora" percorre os itens do
  // pedido inteiro, e recalcular isso a cada comparação deixaria a
  // lista lenta à toa.
  const chaves = {};
  listaExibida.forEach((o) => {
    const ps = statusById[o.id];
    chaves[o.id] = chaveDeOrdemDoPedido(o, itensPorPedido[o.id] || [],
      ps ? ps.payment_status : null, ORDENS.pedidos.campo);
  });
  const ordenados = aplicarOrdem(listaExibida, 'pedidos',
    (o) => chaves[o.id],
    (a, b) => new Date(b.created_at) - new Date(a.created_at));
  listaExibida.length = 0;
  ordenados.forEach((o) => listaExibida.push(o));

  let html = '<div class="card">';
  html += '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:8px;">';
  html += '<strong>' + listaExibida.length + ' pedido' + (listaExibida.length === 1 ? '' : 's') + '</strong>';
  html += '<div style="display:flex; gap:8px; flex-wrap:wrap;">';
  if (fechados.length > 0) {
    html += '<button class="btn ghost" onclick="alternarPedidosFinalizados()">' +
      (mostrarPedidosFinalizados ? 'Esconder os já finalizados' : 'Ver os ' + fechados.length + ' já finalizados') + '</button>';
  }
  html += '<button class="btn" onclick="openPedidoForm()">+ Novo pedido</button>';
  html += '</div></div>';
  if (listaExibida.length === 0) {
    html += '<div class="empty">' + (orders.length === 0 ? 'Nenhum pedido ainda.' : 'Nenhum pedido em andamento — todos já foram entregues.') + '</div>';
  } else {
    // "Tipo" (catálogo/projeto) saiu: já dá pra ver isso lendo o item, e
    // o lugar valia mais pra "Falta", que responde a pergunta que se faz
    // olhando a lista — esta venda dá pra imprimir ou não?
    html += '<table><tr>'
      + thOrdenavel('cliente', 'Cliente', ORDENS.pedidos, 'ordenarPedidos')
      + thOrdenavel('criado', 'Pedido', ORDENS.pedidos, 'ordenarPedidos')
      + thOrdenavel('item', 'Item', ORDENS.pedidos, 'ordenarPedidos')
      + thOrdenavel('acao', 'O que fazer agora', ORDENS.pedidos, 'ordenarPedidos')
      + thOrdenavel('status', 'Status', ORDENS.pedidos, 'ordenarPedidos')
      + thOrdenavel('total', 'Total', ORDENS.pedidos, 'ordenarPedidos')
      + thOrdenavel('pagamento', 'Pagamento', ORDENS.pedidos, 'ordenarPedidos')
      + '<th></th></tr>';
    listaExibida.forEach((o) => {
      const ps = statusById[o.id];
      const itensDoPedido = itensPorPedido[o.id] || [];
      const statusPedido = statusResumoPedido(itensDoPedido);
      html += '<tr>';
      html += '<td>' + escapeHtml(o.customers ? o.customers.name : (o.customer_name || '—')) + '</td>';
      html += '<td>' + escapeHtml(o.order_number || o.id.slice(0, 8)) + '<br><span style="color:var(--muted);font-size:11px;">' + fmtDate(o.created_at) + '</span></td>';
      html += '<td>' + resumoItensPedido(itensDoPedido) + '</td>';
      html += '<td>' + seloDoPreparo(preparoDoPedido(itensDoPedido)) + '</td>';
      html += '<td>' + (statusPedido ? selo(statusPedido, LINE_STATUS_LABELS[statusPedido]) : '<span style="color:var(--muted); font-size:11px;">sem peça</span>') + '</td>';
      html += '<td>' + fmtMoney(o.total_amount) + '</td>';
      html += '<td>' + (ps ? selo(ps.payment_status, PAYMENT_STATUS_LABELS[ps.payment_status]) : '—') + '</td>';
      html += '<td class="row-actions"><button class="btn ghost" onclick="abrirPedido(\'' + o.id + '\')">Abrir</button>' +
        '<button class="btn ghost" onclick="excluirPedido(\'' + o.id + '\')">🗑️</button></td>';
      html += '</tr>';
    });
    html += '</table>';
  }
  html += '</div>';
  el.innerHTML = html;
}

  if (error) { toast('Erro: ' + error.message); return; }
  toast('Pedido excluído.');

// Projeto (order_line_items com line_type='custom') nasce com o nome de
// quem pediu solto em requester_name/requester_contact, sem NUNCA virar

// não tinham jeito de trocar. Deixa escolher um cliente já cadastrado ou
// criar um novo (já sugerindo o nome/telefone que o projeto já tem).
async function abrirEditarClienteDoPedido(orderId, preSelecionarId) {
  const clientes = await getClientes();
  const order = await q(SUPA.from('orders').select('customer_id').eq('id', orderId).maybeSingle());

async function prepararNovoClienteDoPedido(orderId) {
  const itens = await q(SUPA.from('order_line_items').select('requester_name, requester_contact').eq('order_id', orderId).limit(1));
  const primeiro = itens && itens[0];
  const sugestao = primeiro && primeiro.requester_name ? { name: primeiro.requester_name, phone: primeiro.requester_contact } : null;
  openClienteFormInline((novoId) => abrirEditarClienteDoPedido(orderId, novoId), sugestao);

async function salvarClienteDoPedido(orderId) {
  const customerId = document.getElementById('pedCliente').value || null;
  const { error } = await SUPA.from('orders').update({ customer_id: customerId, updated_at: new Date().toISOString() }).eq('id', orderId);
  if (error) { toast('Erro: ' + error.message); return; }

let _pedidoPollTimer = null;

// Fila parada quase nunca é problema da fila: é o agente local
// desligado. O sintoma é o pior possível — botão girando pra sempre,
// sem erro nenhum na tela — e já custou mais de uma hora de confusão.
// Esta faixa transforma isso numa frase.
const SEGUNDOS_PRA_CONSIDERAR_PARADO = 90;

async function avisoAgenteParado() {
  // Consulta crua de propósito, sem passar pelo q(): ele mostra o erro
  // numa tarja pra quem está usando, e uma falha ao CONFERIR o agente
  // não é assunto do Rafa — se não deu pra saber, é melhor não dizer
  // nada do que assustar com um erro que ele não pode resolver.
  const { data: agentes, error } = await SUPA.from('slicer_agents').select('name, last_seen_at, code_date');
  if (error || !agentes) return '';
  const agora = Date.now();
  const estaVivo = (a) => (agora - new Date(a.last_seen_at)) / 1000 < SEGUNDOS_PRA_CONSIDERAR_PARADO;

  // patch-42: computador ligado, porém com código velho. Vem DEPOIS de
  // "está desligado" em toda saída daqui de baixo, de propósito —
  // desligado impede de trabalhar, código velho só arrisca. Duas tarjas
  // laranjas ao mesmo tempo não seriam lidas por ninguém.
  //
  // Só avisa quando a máquina atrasada está LIGADA: uma desligada não
  // vai pegar tarefa nenhuma, e cobrar atualização de um computador que
  // ninguém está usando é barulho.
  //
  // A folga é a mesma da lista de escolher computador — ver o porquê
  // das duas horas lá em listarComputadores().
  const FOLGA_MS = 2 * 60 * 60 * 1000;
  const datas = agentes.map((a) => (a.code_date ? new Date(a.code_date).getTime() : null));
  const maisNovo = datas.reduce((m, d) => (d > m ? d : m), 0);
  const avisoDeCodigoVelho = () => {
    const atrasados = agentes.filter((a, i) =>
      estaVivo(a) && datas[i] && maisNovo - datas[i] > FOLGA_MS);
    if (!atrasados.length) return '';
    const nomes = atrasados.map((a) => escapeHtml(a.name)).join(', ');
    return '<div class="card" style="background:#fff6e5; border:1px solid #ffd894;">'
      + '<div style="font-family:\'Space Grotesk\',sans-serif; font-weight:700; color:#8a5b00;">⚠️ O computador <em>' + nomes + '</em> está com o programa antigo</div>'
      + '<div style="font-size:13px; color:#8a5b00; line-height:1.6; margin-top:6px;">'
      + 'Ele trabalha normal, mas pode errar coisas que já foram consertadas — e como qualquer computador ligado pode pegar a tarefa, o erro volta sem avisar.'
      + '<br>Pra atualizar, naquela máquina: <strong>powershell -ExecutionPolicy Bypass -File slicer-agent\\atualizar-agente.ps1</strong></div>'
      + '</div>';
  };

  // Quando um computador já foi escolhido, é ELE que importa — não
  // adianta ter outro ligado, porque a peça foi endereçada pra este.
  // Foi assim que o Rafa ficou esperando: escolheu o computador do pai
  // (o único da lista) e a peça foi pra uma máquina desligada.
  const escolhido = computadorEscolhido();
  if (escolhido) {
    const alvo = agentes.find((a) => a.name === escolhido);
    if (alvo && estaVivo(alvo)) return avisoDeCodigoVelho();
    return '<div class="card" style="background:#fff6e5; border:1px solid #ffd894;">'
      + '<div style="font-family:\'Space Grotesk\',sans-serif; font-weight:700; color:#8a5b00;">⏸️ O computador <em>' + escapeHtml(escolhido) + '</em> está desligado</div>'
      + '<div style="font-size:13px; color:#8a5b00; line-height:1.6; margin-top:6px;">'
      + 'A peça foi mandada pra ele, e vai ficar esperando até ele ligar — os botões de <strong>colinha</strong> e de <strong>fatiador</strong> não fazem nada enquanto isso.'
      + '<br>Pra ligar nele: dois cliques em <strong>slicer-agent\\start-hidden.vbs</strong>.'
      + '<br>Se você está em <em>outro</em> computador, <button class="btn ghost" style="padding:3px 10px; font-size:12px;" onclick="trocarComputador()">escolher outro</button></div>'
      + '</div>';
  }

  if (agentes.some(estaVivo)) return avisoDeCodigoVelho();
  const ultimo = agentes.map((a) => new Date(a.last_seen_at)).sort((a, b) => b - a)[0];
  const quando = ultimo ? ' (visto pela última vez ' + fmtDate(ultimo) + ')' : '';
  return '<div class="card" style="background:#fff6e5; border:1px solid #ffd894;">'
    + '<div style="font-family:\'Space Grotesk\',sans-serif; font-weight:700; color:#8a5b00;">⏸️ O ajudante do computador está parado' + quando + '</div>'
    + '<div style="font-size:13px; color:#8a5b00; line-height:1.6; margin-top:6px;">'
    + 'Enquanto ele estiver desligado, os botões de <strong>colinha</strong> e de <strong>fatiador</strong> ficam esperando pra sempre e nada acontece.'
    + '<br>Pra ligar: dois cliques em <strong>slicer-agent\\start-hidden.vbs</strong>, na pasta do sistema.</div>'
    + '</div>';
}

// O que dá pra fazer com a peça de um item, direto da tela do pedido.
// Item personalizado não entra: o caminho dele é a aba Projetos, que já
// tem a cadeia inteira (gerar, dividir, colinha, fatiador).
/* ============================================================
   PREPARAR PRA IMPRIMIR — os passos, em ordem, num lugar só

   O catálogo foi montado com fotos: de 166 produtos ativos, 11 têm
   arquivo 3D e 10 têm colinha. Então quase toda venda chega sem nada
   pronto, e o pedido virava uma fileira de cinco botões — anexar, pedir
   colinha, abrir no fatiador, personalizar, editar — todos do mesmo
   tamanho, sem dizer qual vem primeiro nem o que já foi feito.

   Aqui os passos são numerados, mostram o que já está pronto, e o
   último é o que faltava no sistema inteiro: MANDAR PRA FILA como um
   ato explícito. Antes a peça caía na Fila só por ter um status, sem
   ninguém garantir que dava pra imprimir — e a Fila enchia de peça sem
   arquivo, sem tempo, sem nada.

   Item de catálogo e item personalizado guardam os mesmos campos
   (model_file_path, ai_slicing_tips, open_slicer_status) — só que um no
   produto e outro na própria linha. Por isso um passo a passo só serve
   pros dois: muda a fonte e a função chamada, não o desenho.
   ============================================================ */

// De onde ler o estado do preparo: do produto (catálogo, o arquivo é o
// mesmo pra todo mundo) ou da própria linha (personalizado).
// "a, b e c" — juntar tudo com " e " dava "falta o arquivo e a colinha
// e o fatiador", que ninguém fala.
function listaEmFrase(itens) {
  if (itens.length <= 1) return itens[0] || '';
  return itens.slice(0, -1).join(', ') + ' e ' + itens[itens.length - 1];
}

function fonteDoPreparo(it) {
  return it.line_type === 'catalog' ? (it.products || {}) : it;
}

// Tempo e gramas que a peça gasta. Item de catálogo guarda na receita
// do produto (vale pra toda venda futura); personalizado guarda na
// própria linha, porque não se repete.
function medidasDaPeca(it) {
  if (it.line_type === 'catalog') {
    const r = (receitasCache || []).find((x) => x.product_id === it.product_id);
    return { horas: r ? r.estimated_print_hours : null, gramas: r ? r.estimated_grams : null };
  }
  return { horas: it.estimated_print_hours, gramas: it.estimated_grams };
}

function passosDoPreparo(it) {
  const f = fonteDoPreparo(it);
  const m = medidasDaPeca(it);
  return [
    { chave: 'arquivo', titulo: 'Ter o arquivo da peça',
      ajuda: 'É o desenho 3D que a impressora entende.',
      pronto: !!f.model_file_path,
      fazendo: false, erro: null },
    { chave: 'colinha', titulo: 'Pedir a colinha',
      ajuda: 'A IA olha a peça e diz a temperatura, a camada e se precisa de suporte.',
      pronto: !!f.ai_slicing_tips,
      fazendo: f.ai_analysis_status === 'queued' || f.ai_analysis_status === 'processing',
      erro: f.ai_analysis_status === 'error' ? f.ai_analysis_error : null },
    { chave: 'fatiador', titulo: 'Abrir no fatiador',
      ajuda: 'Abre a peça no Bambu Studio, já com a colinha aplicada.',
      pronto: f.open_slicer_status === 'done',
      fazendo: f.open_slicer_status === 'queued' || f.open_slicer_status === 'processing',
      erro: f.open_slicer_status === 'error' ? f.open_slicer_error : null },
    // O passo que faltava, e vem logo depois de abrir no fatiador de
    // propósito: é EXATAMENTE nesse momento que o Bambu mostra o tempo
    // e as gramas na tela. Perguntar depois é perguntar de memória, e
    // foi tentar responder isso de memória — ou pelo relógio de
    // parede — que estragava o custo da peça.
    { chave: 'medidas', titulo: 'Anotar o que o fatiador disse',
      ajuda: 'O tempo e os gramas aparecem no Bambu quando ele termina de fatiar. É este número que vale pra sempre.',
      pronto: !!(m.horas && m.gramas), fazendo: false, erro: null },
  ];
}

let _prepararItemId = null;
let _prepararOrderId = null;
let _prepararTimer = null;

async function abrirPreparar(itemId, orderId) {
  _prepararItemId = itemId;
  _prepararOrderId = orderId;
  await desenharPreparar();
}

function fecharPreparar() {
  clearTimeout(_prepararTimer);
  _prepararItemId = null;
  closeModal();
  if (_prepararOrderId) abrirPedido(_prepararOrderId);
}

async function desenharPreparar() {
  if (!_prepararItemId) return;
  const it = await q(SUPA.from('order_line_items')
    .select('*, products(*)').eq('id', _prepararItemId).maybeSingle());
  if (!it) { closeModal(); return; }
  // O passo das medidas lê a receita do produto — sem isto ele diria
  // "falta anotar" numa peça que já tem o tempo guardado.
  await getReceitas();

  const nome = it.line_type === 'catalog' ? (it.products ? it.products.name : '—') : it.custom_description;
  const passos = passosDoPreparo(it);
  const faltando = passos.filter((p) => !p.pronto);
  const naFila = FILA_PRONTAS.includes(it.line_status);

  let html = '<h3 style="margin:0 0 2px;">Preparar pra imprimir</h3>';
  html += '<div style="color:var(--muted); font-size:13px; margin-bottom:14px;">' + escapeHtml(nome) + '</div>';

  if (naFila) {
    html += '<div style="background:#e9f7ef; border:1px solid #b7e4c7; border-radius:10px; padding:12px 14px; font-size:13px; color:#1f6b3b; line-height:1.6;">'
      + '<strong>✅ Esta peça já está na fila de impressão.</strong><br>'
      + 'Daqui pra frente ela aparece na aba <strong>Fila</strong>, e é lá que você diz quando começou e quando terminou.</div>';
  }

  passos.forEach((p, i) => {
    const marca = p.pronto ? '✅' : (p.fazendo ? '⏳' : (i + 1) + '.');
    const cor = p.pronto ? '#1f8a3b' : 'var(--fg)';
    html += '<div style="display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-top:1px solid var(--border);">';
    html += '<div style="font-size:16px; min-width:24px; color:' + cor + ';">' + marca + '</div>';
    html += '<div style="flex:1;">';
    html += '<div style="font-family:\'Space Grotesk\',sans-serif; font-weight:700; font-size:14px; color:' + cor + ';">' + p.titulo + '</div>';
    html += '<div style="color:var(--muted); font-size:12px; margin-top:2px;">' + p.ajuda + '</div>';
    if (p.erro) html += '<div style="color:#c0392b; font-size:12px; margin-top:4px;">Deu erro: ' + escapeHtml(p.erro) + '</div>';
    html += '</div>';
    html += '<div>' + botaoDoPasso(it, p) + '</div>';
    html += '</div>';
  });

  // O passo que faltava no sistema. Só libera com tudo pronto — é o que
  // faz a Fila poder ser confiada. A saída pro dono existe porque
  // travar de vez transformaria um aviso num beco sem saída.
  if (!naFila) {
    html += '<div style="border-top:1px solid var(--border); margin-top:6px; padding-top:14px;">';
    if (!faltando.length) {
      html += '<button class="btn full" onclick="mandarPraFila(\'' + it.id + '\')">🖨️ Mandar pra fila de impressão</button>';
    } else {
      html += '<button class="btn full" disabled style="opacity:.5;">🖨️ Mandar pra fila de impressão</button>';
      html += '<div style="color:var(--muted); font-size:12px; margin-top:6px; line-height:1.5;">'
        + 'Falta ' + listaEmFrase(faltando.map((p) => '<strong>' + p.titulo.toLowerCase() + '</strong>')) + '.';
      if (currentProfile && currentProfile.role === 'owner') {
        html += ' <a href="#" onclick="mandarPraFila(\'' + it.id + '\'); return false;" style="font-size:11.5px;">mandar assim mesmo</a>';
      }
      html += '</div>';
    }
    html += '</div>';
  }

  html += '<div class="modal-actions"><button class="btn ghost" onclick="fecharPreparar()">Fechar</button></div>';
  openModal(html);

  // Enquanto uma fila está rodando, a janela se atualiza sozinha. Antes
  // era preciso fechar, esperar, reabrir — e como nada dizia isso, dava
  // a impressão de que o botão não tinha funcionado.
  clearTimeout(_prepararTimer);
  if (passos.some((p) => p.fazendo)) {
    _prepararTimer = setTimeout(() => { if (_prepararItemId) desenharPreparar(); }, 4000);
  }
}

function botaoDoPasso(it, p) {
  const cat = it.line_type === 'catalog';
  const alvo = cat ? (it.products ? it.products.id : '') : it.id;
  if (p.fazendo) return '<button class="btn ghost" disabled>Fazendo...</button>';

  if (p.chave === 'arquivo') {
    if (p.pronto) return '<button class="btn ghost" onclick="' + (cat
      ? 'openModelo3DForm(\'' + alvo + '\', \'preparar\')'
      : 'abrirGerenciarProjeto(\'' + alvo + '\')') + '">Trocar</button>';
    return '<button class="btn" onclick="' + (cat
      ? 'openModelo3DForm(\'' + alvo + '\', \'preparar\')'
      : 'abrirGerenciarProjeto(\'' + alvo + '\')') + '">Anexar</button>';
  }
  if (p.chave === 'colinha') {
    if (p.pronto) return '<button class="btn ghost" onclick="' + (cat
      ? 'verAnaliseIA(\'' + alvo + '\')'
      : 'abrirGerenciarProjeto(\'' + alvo + '\')') + '">Ver</button>';
    // Sem arquivo não há o que analisar — o botão fica apagado em vez de
    // sumir, senão o passo pareceria opcional.
    const p1 = passosDoPreparo(it)[0];
    if (!p1.pronto) return '<button class="btn ghost" disabled style="opacity:.5;">Pedir</button>';
    return '<button class="btn" onclick="' + (cat
      ? 'solicitarAnaliseIA(\'' + alvo + '\', \'preparar\')'
      : 'solicitarAnaliseIAProjeto(\'' + alvo + '\')') + '">Pedir</button>';
  }
  if (p.chave === 'medidas') {
    const m = medidasDaPeca(it);
    return '<button class="btn' + (p.pronto ? ' ghost' : '') + '" onclick="abrirMedidasDoFatiador(\'' + it.id + '\')">'
      + (p.pronto ? fmtHoras(m.horas) + ' · ' + Math.round(m.gramas) + 'g' : 'Anotar') + '</button>';
  }
  // fatiador
  const p1 = passosDoPreparo(it)[0];
  if (!p1.pronto) return '<button class="btn ghost" disabled style="opacity:.5;">Abrir</button>';
  return '<button class="btn' + (p.pronto ? ' ghost' : '') + '" onclick="' + (cat
    ? 'solicitarAbrirFatiador(\'' + alvo + '\', \'preparar\')'
    : 'solicitarAbrirFatiadorProjeto(\'' + alvo + '\')') + '">' + (p.pronto ? 'Abrir de novo' : 'Abrir') + '</button>';
}

// Pergunta o tempo e as gramas com o Bambu ainda aberto do lado. Hora e
// minuto em campos separados de propósito, do jeito que o fatiador
// mostra ("17h 31min") — pedir 17,52 obrigaria a converter de cabeça, e
// é aí que entra número errado.
async function abrirMedidasDoFatiador(itemId) {
  const it = await q(SUPA.from('order_line_items')
    .select('*, products(id, name)').eq('id', itemId).maybeSingle());
  if (!it) return;
  await getReceitas();
  const m = medidasDaPeca(it);
  const nome = it.line_type === 'catalog' ? (it.products ? it.products.name : '—') : it.custom_description;

  openModal(
    '<h3 style="margin:0 0 2px;">O que o fatiador disse?</h3>'
    + '<div style="color:var(--muted); font-size:12.5px; margin-bottom:14px;">' + escapeHtml(nome || '')
    + ' — copie os dois números da tela do Bambu Studio, de UMA peça.</div>'
    + '<label class="pergunta">Quanto tempo ele leva pra imprimir?</label>'
    + dicaCampo('O Bambu mostra assim: 17h 31min. Põe do mesmo jeito, sem converter nada.')
    + '<div style="display:flex; gap:8px;">'
    + '<div style="flex:1;"><input id="mfH" type="number" step="1" min="0" placeholder="horas" value="' + horasParteInteira(m.horas) + '"></div>'
    + '<div style="flex:1;"><input id="mfM" type="number" step="1" min="0" max="59" placeholder="minutos" value="' + horasParteMinutos(m.horas) + '"></div>'
    + '</div>'
    + '<label class="pergunta">Quantos gramas de filamento ela gasta?</label>'
    + dicaCampo('Também sai do fatiador, junto com o tempo.')
    + '<input id="mfG" type="number" step="0.1" value="' + (m.gramas || '') + '">'
    + '<div class="modal-actions">'
    + '<button class="btn ghost" onclick="fecharPreparar()">Cancelar</button>'
    + '<button class="btn" onclick="salvarMedidasDoFatiador(\'' + itemId + '\')">Salvar</button>'
    + '</div>'
  );
}

async function salvarMedidasDoFatiador(itemId) {
  const horas = (parseFloat(document.getElementById('mfH').value) || 0)
    + (parseFloat(document.getElementById('mfM').value) || 0) / 60;
  const gramas = parseFloat(document.getElementById('mfG').value);
  if (!horas) { toast('Diz quanto tempo ele leva.'); return; }
  if (!gramas || gramas <= 0) { toast('Diz quantos gramas ela gasta.'); return; }

  const it = await q(SUPA.from('order_line_items').select('id, line_type, product_id').eq('id', itemId).maybeSingle());
  if (!it) return;

  let error = null;
  if (it.line_type === 'catalog' && it.product_id) {
    // Vai pra RECEITA do produto: o número serve pra toda venda futura
    // dessa peça, não só pra esta. É isso que faz os produtos do
    // catálogo irem ganhando tempo sozinhos, conforme vão sendo
    // vendidos — sem ninguém preencher 155 fichas de uma vez.
    await getReceitas(true);
    const r = (receitasCache || []).find((x) => x.product_id === it.product_id);
    const payload = { estimated_print_hours: horas, estimated_grams: gramas };
    const res = r
      ? await SUPA.from('product_recipes').update(payload).eq('id', r.id)
      : await SUPA.from('product_recipes').insert([Object.assign({ product_id: it.product_id }, payload)]);
    error = res.error;
    await getReceitas(true);
  } else {
    const res = await SUPA.from('order_line_items').update({
      estimated_print_hours: horas, estimated_grams: gramas, updated_at: new Date().toISOString(),
    }).eq('id', itemId);
    error = res.error;
  }
  if (error) { toast('Erro: ' + error.message); return; }
  toast('Anotado! Agora a Fila sabe quanto essa peça demora.');
  await desenharPreparar();
}

// As ações raras do item. Ficam atrás de um clique porque cada uma
// delas era um botão do mesmo tamanho do "preparar", e a linha virava
// uma parede de opções onde a frequente se perdia no meio.

    + '<div><div style="font-size:14px;">' + titulo + '</div>'
    + '<div style="color:var(--muted); font-size:11.5px; margin-top:2px;">' + ajuda + '</div></div>'
    + '<div>' + botao + '</div></div>';

  html += linha('Mudar a quantidade, a cor ou o preço', 'Mexe só neste pedido.',
    '<button class="btn ghost" onclick="fecharModalDOM(); abrirEditarItem(\'' + it.id + '\', \'' + orderId + '\')">✏️ Editar</button>');

  if (it.line_type === 'catalog') {
    html += linha('Fazer uma versão só pra este cliente',

      '<button class="btn ghost" onclick="personalizarItemDoPedido(\'' + it.id + '\', \'' + orderId + '\')">🎨 Personalizar</button>');
  } else {
    html += linha('Abrir o gerenciador completo do projeto',

      '<button class="btn ghost" onclick="fecharModalDOM(); abrirGerenciarProjeto(\'' + it.id + '\')">🪄 Gerenciar</button>');
  }

async function mandarPraFila(itemId) {
  const { error } = await SUPA.from('order_line_items')
    .update({ line_status: 'fila_impressao', updated_at: new Date().toISOString() })
    .eq('id', itemId);
  if (error) { toast('Erro: ' + error.message); return; }
  toast('Pronto! A peça entrou na fila de impressão.');
  // Chamado de dois lugares: de dentro da janela de preparar (que se
  // redesenha no lugar) e direto do cartão da Fila (onde não há janela
  // nenhuma — aí é a Fila que precisa se redesenhar, senão a peça
  // continuaria listada como fora da fila depois de entrar nela).
  if (_prepararItemId) await desenharPreparar();
  else await renderFila();
}


// order_line_items já tem as MESMAS colunas de arquivo/colinha/fatiador
// que um projeto usa (model_file_path, ai_slicing_tips, open_slicer_
// status...) — só que num item de catálogo elas ficam sempre vazias,
// porque as ações leem do PRODUTO, não da linha. Virar 'custom' faz
// essas ações passarem a ler/gravar na linha (via "🪄 Gerenciar" —
// abrirGerenciarProjeto), isolando o arquivo novo só nesse pedido, sem
// precisar criar um projeto do zero nem tocar no produto do catálogo.
async function personalizarItemDoPedido(itemId, orderId) {
  const it = await q(SUPA.from('order_line_items').select('product_id, products(name)').eq('id', itemId).maybeSingle());
  const nomeProduto = it.products ? it.products.name : 'esse item';
  if (!confirm('Isso vira um item personalizado só desse pedido — arquivo, colinha e fatiador próprios, sem mexer no produto "' + nomeProduto + '" do catálogo pra mais ninguém. Continuar?')) return;
  const { error } = await SUPA.from('order_line_items').update({
    line_type: 'custom', custom_description: nomeProduto + ' (personalizado)', updated_at: new Date().toISOString(),
  }).eq('id', itemId);
  if (error) { toast('Erro: ' + error.message); return; }
  toast('Virou personalizado — agora tem arquivo, colinha e fatiador só desse pedido.');
  await renderPedidoDetalhe(orderId);
}

// Leva pra aba Produtos já com a ficha daquele produto aberta, pra não
// ter que procurar pelo código numa lista de 161.
// Nada aqui leva mais pra aba Produtos: anexar arquivo e ver a colinha
// abrem numa janela por cima do pedido, e quem estava resolvendo um
// pedido continua nele. Trocar de aba no meio custava a volta inteira
// pra achar o pedido de novo.

async function renderPedidoDetalhe(id) {
  const el = document.getElementById('tab-pedidos');
  el.innerHTML = '<div class="empty">Carregando...</div>';
  await getReceitas();
  const order = await q(SUPA.from('orders').select('*, customers(name, phone)').eq('id', id).maybeSingle());
  // Traz junto o que o produto tem de arquivo 3D e o estado das filas.
  // Sem isso a tela do pedido só sabia o nome da peça, e quem quisesse
  // imprimir precisava sair daqui, achar o produto no catálogo pelo
  // código e mandar de lá — que é o caminho que ninguém fazia.
  const items = await q(SUPA.from('order_line_items')
    .select('*, products(id, name, catalog_code, model_file_path, open_slicer_status, open_slicer_error, ai_analysis_status, ai_analysis_error, ai_slicing_tips), filament_colors(name)')
    .eq('order_id', id).order('created_at'));
  const payments = await q(SUPA.from('payments').select('*').eq('order_id', id).order('created_at'));
  const ps = await q(SUPA.from('orders_payment_status').select('*').eq('order_id', id).maybeSingle());

  const nomeCliente = order.customers ? order.customers.name : (order.customer_name || '—');
  const contatoCliente = order.customers ? order.customers.phone : order.customer_contact;

  let html = '<button class="btn ghost" onclick="voltarPedidos()">&larr; Voltar</button>';
  html += '<div class="card" style="margin-top:12px;">';
  html += '<div style="display:flex; justify-content:space-between;">';
  html += '<div><strong>' + escapeHtml(order.order_number || order.id.slice(0, 8)) + '</strong><br>';
  html += '<span style="color:var(--muted);">' + escapeHtml(nomeCliente) + (contatoCliente ? ' · ' + escapeHtml(contatoCliente) : '') + '</span> ' +
    '<button class="btn ghost" style="padding:2px 8px; font-size:10.5px;" onclick="abrirEditarClienteDoPedido(\'' + id + '\')">✏️ trocar</button></div>';
  html += '<div style="text-align:right;"><div>' + fmtMoney(order.total_amount) + '</div>';
  html += (ps ? selo(ps.payment_status, PAYMENT_STATUS_LABELS[ps.payment_status]) : '—') + '</div>';
  html += '</div>';
  html += '<div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;">';
  if (contatoCliente) {
    // A cartinha fica aqui, e não só no bloco de entrega, porque vale
    // pra todo pedido — inclusive o que o cliente vem buscar, que não
    // tem etiqueta nenhuma.
    html += '<button class="btn ghost" onclick="abrirCartinha(\'' + id + '\')">💌 Imprimir a cartinha</button>';
    html += '<button class="btn ghost" onclick="abrirAgradecimento(\'' + id + '\')">🙏 Mandar agradecimento pelo WhatsApp</button>';
  }
  html += '<button class="btn ghost" onclick="abrirOrcamentoPedido(\'' + id + '\')">📤 Gerar orçamento pra mandar</button>';
  html += '<button class="btn" onclick="abrirPedidoPronto(\'' + id + '\')">✅ Pedido pronto</button>';
  html += '<button class="btn ghost" onclick="excluirPedido(\'' + id + '\')">🗑️ Excluir pedido</button>';
  html += '</div>';
  // Opcional de propósito — nem todo pedido tem data pra entregar. Fica
  // em orders (não por peça) porque quem tem prazo é o cliente todo, e
  // a Fila usa isso junto do tempo de impressão de cada peça pra saber
  // até quando ela precisa ir pra impressora (patch-40).
  html += '<div style="margin-top:10px; padding-top:10px; border-top:1px solid var(--border); font-size:13px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;">';
  html += '<span style="color:var(--muted);">🗓️ Quando o cliente precisa receber?</span>';
  html += '<input type="date" value="' + (order.needed_by || '') + '" onchange="salvarPrazoEntrega(\'' + id + '\', this.value)" style="width:auto;">';
  if (order.needed_by) html += '<button class="btn ghost" style="padding:3px 9px; font-size:11px;" onclick="salvarPrazoEntrega(\'' + id + '\', \'\')">Tirar a data</button>';
  html += '</div>';
  html += '</div>';

  if (order.channel === 'catalogo') {
    html += '<div class="card">';
    html += '<strong>📦 Entrega</strong>';
    if (order.shipping_combinar) {
      html += '<div style="margin-top:8px; font-size:13px;">Combinar entrega direto com o cliente (retirar, Uber, etc).</div>';
    } else {
      html += '<div style="margin-top:8px; font-size:13px; line-height:1.8;">';
      html += escapeHtml(order.shipping_street || '') + ', ' + escapeHtml(order.shipping_number || '') +
        (order.shipping_complement ? ' — ' + escapeHtml(order.shipping_complement) : '') + '<br>';
      html += escapeHtml(order.shipping_district || '') + ' · ' + escapeHtml(order.shipping_city || '') + '/' + escapeHtml(order.shipping_state || '') +
        ' · CEP ' + escapeHtml(order.shipping_cep || '') + '<br>';
      html += escapeHtml(order.shipping_carrier || '') + ' ' + escapeHtml(order.shipping_service || '') + ' — ' + fmtMoney(order.shipping_price) + '</div>';

      if (order.shipping_label_status === 'gerada') {
        html += '<div style="margin-top:10px; padding-top:10px; border-top:1px solid var(--border);">';
        html += '<span class="badge on">Etiqueta gerada</span> ';
        if (order.shipping_tracking_code) html += '<span style="font-size:12px; color:var(--muted);">Rastreio: ' + escapeHtml(order.shipping_tracking_code) + '</span>';
        if (order.shipping_label_url) {
          // Três botões de propósito: o de cima é o do dia a dia (sai
          // tudo o que vai na caixa), e os dois de baixo servem pra
          // quando uma das folhas emperra ou sai borrada e só ela
          // precisa sair de novo.
          const urlEtiqueta = escapeHtml(order.shipping_label_url);
          html += '<div style="margin-top:8px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;">'
            + '<button class="btn" onclick="imprimirPraDespachar(\'' + id + '\', \'' + urlEtiqueta + '\')">🖨️ Imprimir etiqueta e cartinha</button>'
            + '<a href="' + urlEtiqueta + '" target="_blank" rel="noopener" class="btn ghost">🏷️ Só a etiqueta</a>'
            + '<button class="btn ghost" onclick="abrirCartinha(\'' + id + '\')">💌 Só a cartinha</button>'
            + '</div>';
        } else {
          // Sem link, a tela dizia "Etiqueta gerada" e mais nada — um
          // beco, com a etiqueta paga e sem jeito de imprimir. O botão
          // busca o link no Melhor Envio; não compra nada de novo.
          html += '<div style="margin-top:8px; background:#fff6e5; border:1px solid #ffd894; border-radius:9px; padding:9px 11px; font-size:12.5px; color:#8a5b00; line-height:1.5;">'
            + 'A etiqueta foi comprada, mas o link pra imprimir não veio junto. Não precisa comprar de novo — é só buscar.</div>'
            + '<button class="btn" style="margin-top:8px;" onclick="gerarEtiqueta(\'' + id + '\')" id="btnGerarEtiqueta">🔎 Buscar o link da etiqueta</button>';
        }
        html += '</div>';
      } else {
        if (order.shipping_label_status === 'erro') {
          html += '<div style="margin-top:10px; padding-top:10px; border-top:1px solid var(--border); color:#c0392b; font-size:12px;">Deu erro na última tentativa: ' + escapeHtml(order.shipping_label_error || '') + '</div>';
        }
        html += '<button class="btn" style="margin-top:10px;" onclick="gerarEtiqueta(\'' + id + '\')" id="btnGerarEtiqueta">🏷️ ' + (order.shipping_label_status === 'erro' ? 'Tentar de novo' : 'Gerar etiqueta') + '</button>';
      }
    }
    html += '</div>';
  }

  html += '<div class="card">';
  html += '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">';
  html += '<strong>Itens</strong><button class="btn" onclick="openItemForm(\'' + id + '\')">+ Adicionar item</button>';
  html += '</div>';
  if (items.length === 0) {
    html += '<div class="empty">Nenhum item ainda.</div>';
  } else {
    const isOwner = currentProfile && currentProfile.role === 'owner';
    html += '<table><tr><th>Peça</th><th>Quantas</th><th>Preço</th><th>Status</th><th></th></tr>';
    items.forEach((it) => {
      const nome = it.line_type === 'catalog' ? (it.products ? it.products.name : '—') : it.custom_description;
      html += '<tr>';
      html += '<td>' + escapeHtml(nome) + (it.line_type === 'custom' ? ' <span style="color:var(--muted);font-size:11px;">(personalizado)</span>' : '');
      // A cor que o cliente escolheu no catálogo. Fica logo embaixo do
      // nome porque é a primeira coisa que o Rafa precisa saber pra
      // botar a peça na impressora. O nome chega junto na consulta, pra
      // não ter que ir buscar cor por cor.
      // Com o MATERIAL junto, sempre — "Preto" e "Preto" são filamentos
      // diferentes se um é PLA e o outro é TPU, e é o material que
      // decide temperatura, placa e se a peça sai ou derrete.
      const corPedida = it.filament_colors ? rotuloDaCor(it.filament_colors) : null;
      if (corPedida) html += '<br><span style="font-size:11px;">🎨 quer na cor <strong>' + escapeHtml(corPedida) + '</strong></span>';
      if (it.notes) html += '<br><span style="font-size:11px; color:var(--muted);">📝 ' + escapeHtml(it.notes) + '</span>';
      // O código vem junto porque é por ele que a peça é achada no
      // catálogo e na prateleira — o nome sozinho não basta quando há
      // seis vasos parecidos.
      const prod = it.products;
      if (prod && prod.catalog_code) html += '<br><span style="font-size:11px; color:var(--muted);">código ' + escapeHtml(prod.catalog_code) + '</span>';
      if (it.custom_reference_link) html += '<br><a href="' + escapeHtml(it.custom_reference_link) + '" target="_blank" rel="noopener" style="font-size:11px;">🔗 referência do cliente</a>';
      html += '</td>';
      html += '<td>' + it.quantity + '</td>';
      html += '<td>' + fmtMoney(it.unit_price * it.quantity) + '</td>';
      html += '<td><select style="' + estiloDoSelect(it.line_status) + '" onchange="repintarSelect(this); mudarStatusItem(\'' + it.id + '\', this.value, \'' + id + '\')">';
      Object.keys(LINE_STATUS_LABELS).forEach((k) => {
        html += '<option value="' + k + '"' + (k === it.line_status ? ' selected' : '') + '>' + LINE_STATUS_LABELS[k] + '</option>';
      });
      html += '</select></td>';
      html += '<td class="row-actions">';
      if (isOwner && it.line_status === 'orcamento_pendente') {
        html += '<button class="btn" onclick="openAprovarOrcamento(\'' + it.id + '\', \'' + id + '\')">Definir preço e aprovar</button>';
      }
      // UM botão, não cinco. Anexar arquivo, pedir colinha e abrir no
      // fatiador são passos de uma coisa só — e ficavam soltos, do mesmo
      // tamanho, sem dizer qual vinha primeiro. Editar, personalizar e
      // remover são raros e competiam visualmente com o que é frequente:
      // foram pro "⋯ Mais".
      const passos = passosDoPreparo(it);
      const prontos = passos.filter((p) => p.pronto).length;
      if (FILA_PRONTAS.includes(it.line_status)) {
        html += '<button class="btn ghost" onclick="abrirPreparar(\'' + it.id + '\', \'' + id + '\')">✅ Na fila de impressão</button>';
      } else {
        html += '<button class="btn" onclick="abrirPreparar(\'' + it.id + '\', \'' + id + '\')">🔧 Preparar pra imprimir'
          + '<span style="opacity:.75; font-weight:400;"> (' + prontos + ' de ' + passos.length + ')</span></button>';
      }
      html += '<button class="btn ghost" onclick="abrirMaisDoItem(\'' + it.id + '\', \'' + id + '\')">⋯ Mais</button>';
      html += '</td>';
      html += '</tr>';
    });
    html += '</table>';
  }
  html += '</div>';

  html += '<div class="card">';
  html += '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">';
  html += '<strong>Pagamentos</strong><button class="btn" onclick="openPagamentoForm(\'' + id + '\')">+ Anotar pagamento</button>';
  html += '</div>';
  if (payments.length === 0) {
    html += '<div class="empty">Nenhum pagamento registrado.</div>';
  } else {
    html += '<table><tr><th>Tipo</th><th>Valor</th><th>Método</th><th>Status</th><th>Data</th></tr>';
    payments.forEach((p) => {
      html += '<tr><td>' + escapeHtml(p.payment_type) + '</td><td>' + fmtMoney(p.amount) + '</td><td>' + escapeHtml(p.method || '—') + '</td>';
      html += '<td>' + escapeHtml(p.status) + '</td><td>' + fmtDate(p.created_at) + '</td></tr>';
    });
    html += '</table>';
  }
  // Cada pedido guarda o percentual que valia no dia em que foi feito.
  // Desde 24/08/2026 é 100% (paga tudo na hora), mas os pedidos antigos
  // continuam em 50% e a tela tem que contar a verdade de cada um —
  // senão o dono cobra o valor errado de um cliente antigo.
  const pctPedido = Number(order.expected_deposit_pct);
  const aPagar = order.total_amount * pctPedido / 100;
  html += '<div style="margin-top:8px; color:var(--muted); font-size:12px;">'
    + (pctPedido >= 100
        ? 'Esse pedido é pago de uma vez: <strong>' + fmtMoney(order.total_amount) + '</strong>'
        : 'Esse pedido foi feito na regra antiga — paga <strong>' + fmtMoney(aPagar) + '</strong> ('
          + pctPedido + '%) agora e <strong>' + fmtMoney(order.total_amount - aPagar) + '</strong> quando ficar pronto')
    + '</div>';
  html += '</div>';

  clearTimeout(_pedidoPollTimer);
  const emAndamento = items.some((it) => {
    const p = it.products;
    return p && (p.open_slicer_status === 'queued' || p.open_slicer_status === 'processing'
      || p.ai_analysis_status === 'queued' || p.ai_analysis_status === 'processing');
  });

  // Só vai atrás do agente quando tem fila esperando — não faz sentido
  // consultar isso a cada abertura de pedido.
  if (emAndamento) html = (await avisoAgenteParado()) + html;

  // Guarda a rolagem antes de trocar o conteúdo. Sem isto a tela pulava
  // pro topo a cada 4 segundos, e era isso que parecia "piscando".
  const scrollY = window.scrollY;
  el.innerHTML = html;
  window.scrollTo(0, scrollY);

  if (emAndamento && pedidoDetalheId === id && !el.classList.contains('hidden')) {
    _pedidoPollTimer = setTimeout(() => { renderPedidoDetalhe(id); }, 4000);
  }
}

async function abrirAgradecimento(orderId) {
  const order = await q(SUPA.from('orders').select('*, customers(name, phone)').eq('id', orderId).maybeSingle());
  const contato = (order.customers ? order.customers.phone : order.customer_contact) || '';
  const digitos = contato.replace(/\D/g, '');
  if (!digitos) { toast('Esse pedido não tem WhatsApp do cliente cadastrado.'); return; }
  const numeroCompleto = digitos.length <= 11 ? '55' + digitos : digitos;
  const nome = (order.customers ? order.customers.name : order.customer_name) || '';
  const primeiroNome = nome.trim().split(' ')[0];
  const mensagem = 'Olá' + (primeiroNome ? ' ' + primeiroNome : '') + '! Muito obrigado pela compra na Rafa 3D 🙌 ' +
    'Já recebemos seu pedido' + (order.order_number ? ' ' + order.order_number : '') + ' e vamos começar a preparar com carinho. ' +
    'Qualquer dúvida durante o processo é só chamar por aqui!';
  window.open('https://wa.me/' + numeroCompleto + '?text=' + encodeURIComponent(mensagem), '_blank');
}

/* ====== CARTINHA DE AGRADECIMENTO ======
   Vai dentro da caixa, impressa em papel comum. É o único pedaço da
   entrega que fala na voz do Rafa — a etiqueta da transportadora é
   documento padronizado e não dá pra personalizar.

   Sai em A6 deitado (14,8 x 10,5 cm) no meio de uma folha A4, com linha
   pontilhada pra cortar. Fundo branco de propósito: cartinha com fundo
   colorido gasta um cartucho por encomenda. */
// A janela é aberta AQUI, no clique, e só depois preenchida. O
// navegador só permite abrir janela enquanto o clique está "fresco":
// depois de um await ele considera que não houve gesto do usuário e
// bloqueia em silêncio. Era por isso que a cartinha não aparecia.
function abrirCartinha(orderId) {
  const janela = window.open('', '_blank');
  if (!janela) { toast('O navegador bloqueou a janela. Libere os pop-ups pra imprimir a cartinha.'); return; }
  janela.document.write('<p style="font-family:sans-serif;padding:20px;color:#666;">Montando a cartinha…</p>');
  preencherCartinha(orderId, janela);
}

// Ícones simples, traço preenchido, ligados a impressão 3D — espalhados
// como confete de fundo. Formas preenchidas + paleta de festa (não só
// azul discreto) porque a primeira versão "sem graça" foi rejeitada:
// "ele tem 10 anos, falta alegria".
const CARTINHA_ICONES = {

  bico: '<path d="M20 4 H40 V20 L33 32 H27 L20 20 Z" fill="currentColor"/><rect x="24" y="32" width="12" height="20" rx="3" fill="currentColor"/>',
  gota: '<path d="M30 4 C42 22 52 34 52 44 A22 22 0 0 1 8 44 C8 34 18 22 30 4 Z" fill="currentColor"/>',
  estrela: '<path d="M30 3 L37 22 L57 22 L41 34 L47 54 L30 42 L13 54 L19 34 L3 22 L23 22 Z" fill="currentColor"/>',
  bolinha: '<circle cx="30" cy="30" r="26" fill="currentColor"/>',
  triangulo: '<path d="M30 5 L55 52 H5 Z" fill="currentColor"/>',
  coracao: '<path d="M30 52 C10 38 4 26 4 17 A13 13 0 0 1 30 12 A13 13 0 0 1 56 17 C56 26 50 38 30 52 Z" fill="currentColor"/>',
};
const CARTINHA_PALETA = ['#0061f7', '#ffb703', '#ff6b5b', '#22c55e', '#a06bff'];
const CARTINHA_DECOR = [
  { icone: 'cubo', left: 63, top: 6, size: 40, rot: -10, cor: 0, op: 0.9 },
  { icone: 'estrela', left: 88, top: 5, size: 22, rot: 12, cor: 1, op: 1 },
  { icone: 'gota', left: 80, top: 28, size: 26, rot: 6, cor: 2, op: 0.85 },
  { icone: 'bolinha', left: 92, top: 45, size: 14, rot: 0, cor: 3, op: 0.9 },
  { icone: 'carretel', left: 62, top: 74, size: 34, rot: 8, cor: 3, op: 0.85 },
  { icone: 'triangulo', left: 84, top: 70, size: 22, rot: -8, cor: 4, op: 0.85 },
  { icone: 'estrela', left: 4, top: 86, size: 18, rot: -14, cor: 1, op: 1 },
  { icone: 'bolinha', left: 44, top: 84, size: 12, rot: 0, cor: 0, op: 0.8 },
  { icone: 'coracao', left: 55, top: 4, size: 18, rot: -6, cor: 2, op: 0.9 },
  { icone: 'bico', left: 74, top: 58, size: 20, rot: 16, cor: 0, op: 0.85 },
  { icone: 'bolinha', left: 68, top: 20, size: 10, rot: 0, cor: 1, op: 0.85 },
  { icone: 'triangulo', left: 6, top: 6, size: 16, rot: 20, cor: 3, op: 0.75 },
];
function cartinhaCamadaDecorativa() {
  return CARTINHA_DECOR.map(function (d) {
    return '<div style="position:absolute; left:' + d.left + '%; top:' + d.top + '%; width:' + d.size + 'px; height:' + d.size + 'px;' +
      ' color:' + CARTINHA_PALETA[d.cor] + '; opacity:' + d.op + '; transform:rotate(' + d.rot + 'deg); pointer-events:none;' +
      ' filter:drop-shadow(0 1px 1px rgba(0,0,0,.08));">' +
      '<svg viewBox="0 0 60 60">' + CARTINHA_ICONES[d.icone] + '</svg></div>';
  }).join('');
}

// O molde é o MESMO em toda encomenda de propósito — "Para" e a
// assinatura ficam em branco, pro Rafa preencher à mão em cada peça
// depois de imprimir. Isso também é o que permite imprimir um lote
// inteiro numa gráfica de uma vez, em vez de uma cartinha por vez daqui.
// Por isso não busca mais nada no banco — orderId fica só pra manter a
// mesma assinatura de função que os dois lugares que chamam isso já usam.
function preencherCartinha(orderId, janela) {
  const html =
    '<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">' +
    '<title>Cartinha do Rafa</title>' +
    '<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">' +
    '<style>' +
      '@page { size: A4; margin: 0; }' +
      'body { margin:0; font-family:Manrope,sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; background:#fff; }' +
      // Sem isso o navegador some com fundo colorido/gradiente na hora de
      // imprimir, pra "economizar tinta" — e a cartinha voltava a sair
      // branca, depois de todo esse trabalho de dar cor nela.
      '* { box-sizing:border-box; -webkit-print-color-adjust:exact; print-color-adjust:exact; }' +
      // A borda pontilhada é guia de corte e some na impressão? Não —
      // fica de propósito, senão não dá pra cortar reto.
      '.cartao { width:148mm; height:105mm; border:1px dashed #c9cfda; border-radius:6px;' +
        ' background:linear-gradient(150deg, #fef2d4 0%, #fdf9f2 35%, #dfeaff 100%);' +
        ' display:grid; grid-template-columns:41mm 1fr; overflow:hidden; position:relative; }' +
      '.decor-layer { position:absolute; inset:0; z-index:1; }' +
      '.lado { background:linear-gradient(180deg, #adc8fc 0%, #dbe7fc 100%); padding:5mm 3.5mm; display:flex; flex-direction:column;' +
        ' align-items:center; justify-content:space-between; border-right:1px dashed #a9c0ee; position:relative; z-index:2; }' +
      '.retrato { width:100%; aspect-ratio:458/610; border-radius:14%; overflow:hidden;' +
        ' border:1.4mm solid #fff; box-shadow:0 2mm 3mm -1.5mm rgba(11,23,51,.35); }' +
      '.retrato img { width:100%; height:100%; object-fit:cover; display:block; }' +
      '.assinatura-nome { font-family:"Space Grotesk",sans-serif; font-weight:700; font-size:10.5pt;' +
        ' color:#0b1733; text-align:center; margin-top:3mm; line-height:1.3; }' +
      '.assinatura-nome span { display:block; font-weight:600; font-size:8pt; color:#3d4c6b; margin-top:1mm; }' +
      '.qr-bloco { text-align:center; }' +
      '.qr-bloco img { width:22mm; height:22mm; display:block; margin:0 auto; }' +
      '.qr-bloco p { font-size:6.6pt; color:#3d4c6b; margin:1.2mm 0 0; line-height:1.3; font-weight:600; }' +
      '.corpo { padding:6mm 7mm 5mm; display:flex; flex-direction:column; justify-content:space-between; position:relative; z-index:2; }' +
      '.marca-mini { position:absolute; top:5mm; right:6mm; z-index:3; }' +
      '.marca-mini img { height:15mm; width:auto; filter:drop-shadow(0 1px 2px rgba(255,255,255,.9)); }' +
      '.campo-para { display:flex; align-items:baseline; gap:2mm; margin:0 30mm 3mm 0;' +
        ' background:rgba(255,255,255,.72); border-radius:3mm; padding:1.5mm 2mm; }' +
      '.campo-para .rotulo { font-family:"Space Grotesk",sans-serif; font-weight:700; font-size:8pt;' +
        ' color:#0061f7; text-transform:uppercase; letter-spacing:.06em; white-space:nowrap; }' +
      '.campo-para .linha { flex:1; border-bottom:1px dotted #8fa3c9; height:5mm; }' +
      '.oi { font-family:"Space Grotesk",sans-serif; font-weight:700; font-size:20pt; color:#0b1733; margin:0 0 2.4mm; }' +
      '.texto { font-size:10pt; line-height:1.5; color:#2b3652; margin:0; background:rgba(255,255,255,.66); border-radius:3mm; padding:2mm 2.5mm; }' +
      '.texto strong { color:#0b1733; }' +
      '.rodape { display:flex; align-items:flex-end; justify-content:space-between; gap:4mm;' +
        ' margin-top:4mm; padding-top:3mm; border-top:1px dashed #c9b077; position:relative; z-index:2; }' +
      '.assine { flex:1; }' +
      '.assine .linha-assinatura { border-bottom:2px solid #ffb703; height:7mm; margin-bottom:1mm; }' +
      '.assine .rotulo-assine { font-size:6.6pt; color:#5b6b87; letter-spacing:.03em; }' +

function imprimirPraDespachar(orderId, labelUrl) {

   porque muita coisa já nasce direto como pedido (cliente já disse "pode
   fazer", não é mais uma cotação em aberto) e mesmo assim precisa
   mandar o valor pro cliente. Pedido de vários itens vem tudo junto,
   numa lista, com o total no fim — não faz sentido gerar um orçamento
   por peça quando é tudo a mesma encomenda. */
function abrirOrcamentoPedido(orderId) {

}

async function preencherOrcamentoPedidoCard(orderId, janela) {

  const itens = await q(SUPA.from('order_line_items').select('*, products(name, image_path)').eq('order_id', orderId).order('created_at'));

  if (!itens.length) {
    janela.document.open();
    janela.document.write('<p style="font-family:sans-serif;padding:20px;">Esse pedido ainda não tem item nenhum — adiciona um item antes de gerar o orçamento.</p>');
    janela.document.close();
    return;
  }

  const nomeCliente = order.customers ? order.customers.name : order.customer_name;
  const contato = order.customers ? order.customers.phone : order.customer_contact;

    if (it.custom_reference_image_path) {

async function gerarEtiqueta(orderId) {
  const btn = document.getElementById('btnGerarEtiqueta');
  if (btn) { btn.disabled = true; btn.textContent = 'Gerando...'; }
  const { data: sessao } = await SUPA.auth.getSession();
  const token = sessao && sessao.session ? sessao.session.access_token : null;
  if (!token) { toast('Sessão expirada, entra de novo.'); return; }
  try {
    const resp = await fetch(DEFAULT_SB_URL + '/functions/v1/gerar-etiqueta', {
      method: 'POST',
      headers: { apikey: DEFAULT_SB_ANON, Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ order_id: orderId }),
    });
    const dados = await resp.json();
    if (dados.error) {
      // O detalhe vai pro console e fica registrado na tela do pedido:
      // erro de transportadora sem o motivo não dá pra investigar
      // depois, e "tente de novo" não resolve o que não é temporário.
      if (dados.detalhe) console.error('Melhor Envio:', dados.detalhe);
      toast('Erro: ' + dados.error + (dados.detalhe ? ' (' + String(dados.detalhe).slice(0, 120) + ')' : ''));
      if (btn) { btn.disabled = false; btn.textContent = '🔎 Tentar de novo'; }
      await renderPedidoDetalhe(orderId);
      return;
    }
    toast(dados.recuperada ? 'Achei a etiqueta!' : 'Etiqueta gerada!');
    await renderPedidoDetalhe(orderId);
  } catch (e) {
    toast('Não consegui gerar a etiqueta agora.');
    if (btn) { btn.disabled = false; btn.textContent = '🏷️ Gerar etiqueta'; }
  }
}

async function recalcularTotalPedido(orderId) {
  const items = await q(SUPA.from('order_line_items').select('unit_price, quantity, line_type').eq('order_id', orderId));
  const total = items.reduce((s, it) => s + it.unit_price * it.quantity, 0);
  const types = new Set(items.map((it) => it.line_type));
  const order_type = types.size > 1 ? 'misto' : (types.has('custom') ? 'sob_encomenda' : 'catalogo');
  await SUPA.from('orders').update({ total_amount: total, order_type, updated_at: new Date().toISOString() }).eq('id', orderId);
}

function preencherPrecoItem() {
  const sel = document.getElementById('itProduto');
  const opt = sel.options[sel.selectedIndex];
  document.getElementById('itPreco').value = opt.dataset.price || 0;
}

async function salvarItem(orderId) {
  const tipo = document.querySelector('input[name="itTipo"]:checked').value;
  const quantity = parseInt(document.getElementById('itQtd').value, 10) || 1;
  const unit_price = parseFloat(document.getElementById('itPreco').value);
  if (isNaN(unit_price)) { toast('Preenche o preço.'); return; }

  const payload = {
    order_id: orderId, line_type: tipo, quantity, unit_price,
    notes: document.getElementById('itNotas').value.trim() || null,
  };
  if (tipo === 'catalog') {
    const productId = document.getElementById('itProduto').value;
    if (!productId) { toast('Seleciona um produto.'); return; }
    payload.product_id = productId;
    payload.line_status = 'recebido';
    payload.requested_filament_color_id = document.getElementById('itCor').value || null;
  } else {
    const desc = document.getElementById('itDescricao').value.trim();
    if (!desc) { toast('Descreve o item personalizado.'); return; }
    payload.custom_description = desc;
    payload.custom_reference_link = document.getElementById('itLink').value.trim() || null;
    payload.line_status = 'orcamento_pendente';
  }
  const { error } = await SUPA.from('order_line_items').insert([payload]);
  if (error) { toast('Erro: ' + error.message); return; }
  closeModal();
  await recalcularTotalPedido(orderId);
  toast('Item adicionado.');
  await renderPedidoDetalhe(orderId);
}

// "Terminei" (na Fila de Impressão) só marca que terminou de IMPRIMIR —
// por design vira "Dando o acabamento", porque nem toda peça acaba na
// impressora. Mas peça simples fica presa ali sem outro jeito claro de
// dizer "isso aqui está pronto de verdade". Esse botão é esse ponto
// final: só deixa passar se toda peça do pedido já saiu da impressora
// (senão avisa qual falta), avança quem ainda está "dando o acabamento"
// pra "embalado" (nunca volta atrás quem já está mais adiante, tipo
// enviado/entregue) e mostra de cara se falta pagamento, sem travar
// nisso — pagamento pode acontecer na entrega.
const STATUS_AINDA_NAO_IMPRESSO = ['recebido', 'orcamento_pendente', 'orcamento_aprovado', 'fila_impressao', 'imprimindo', 'falhou_reimprimir'];

async function abrirPedidoPronto(orderId) {
  const order = await q(SUPA.from('orders').select('total_amount').eq('id', orderId).maybeSingle());
  const items = await q(SUPA.from('order_line_items').select('id, line_status, products(name), custom_description').eq('order_id', orderId));
  const ps = await q(SUPA.from('orders_payment_status').select('*').eq('order_id', orderId).maybeSingle());

  const naoProntos = items.filter((it) => STATUS_AINDA_NAO_IMPRESSO.indexOf(it.line_status) !== -1);
  if (naoProntos.length > 0) {
    const nomes = naoProntos.map((it) => it.products ? it.products.name : (it.custom_description || 'peça')).join(', ');
    toast('Ainda tem peça não terminada de imprimir: ' + nomes + '.');
    return;
  }

  const aAvancar = items.filter((it) => it.line_status === 'pos_processamento').length;
  const statusPagamento = ps ? ps.payment_status : 'aguardando_sinal';

  openModal(
    '<h3>✅ Marcar esse pedido como pronto</h3>' +
    '<div style="background:var(--bg); border-radius:10px; padding:11px 13px; font-size:13px; line-height:1.9; margin-bottom:10px;">' +
      '<div style="display:flex; justify-content:space-between;"><span>Total do pedido</span><strong>' + fmtMoney(order.total_amount) + '</strong></div>' +
      '<div style="display:flex; justify-content:space-between;"><span>Pagamento</span><strong>' + selo(statusPagamento, PAYMENT_STATUS_LABELS[statusPagamento]) + '</strong></div>' +
    '</div>' +
    (aAvancar > 0
      ? '<p style="font-size:13px; color:var(--muted); margin:0 0 10px;">' + aAvancar + ' peça(s) vão passar de "Dando o acabamento" pra "Embalado". O que já estiver mais adiante (enviado, entregue) fica como está.</p>'
      : '<p style="font-size:13px; color:var(--muted); margin:0 0 10px;">Todas as peças já estão embaladas ou adiante — só confirmando.</p>') +
    (statusPagamento !== 'quitado'
      ? '<div style="background:#fff6e5; border:1px solid #ffd894; border-radius:9px; padding:9px 11px; font-size:12.5px; color:#8a5b00; margin-bottom:10px;">' +
        'Ainda falta pagamento nesse pedido. ' +
        '<button class="btn ghost" style="margin-top:6px;" onclick="closeModal(); openPagamentoForm(\'' + orderId + '\');">Anotar pagamento</button></div>'
      : '') +
    '<div class="modal-actions">' +
      '<button class="btn ghost" onclick="closeModal()">Cancelar</button>' +
      '<button class="btn" onclick="confirmarPedidoPronto(\'' + orderId + '\')">Confirmar, pedido pronto</button>' +
    '</div>'
  );
}

// Guarda a conta do pedido enquanto a janela está aberta, pra trocar o
// valor sozinha quando a pessoa muda o tipo de pagamento.
let _contaDoPagamento = null;

// Quanto cada tipo de pagamento vale, calculado — não digitado. Pedir
// pra digitar um número que o sistema já sabe é a forma mais fácil de
// entrar valor errado, e quem opera tem 10 anos.
function valorSugerido(tipo) {
  const c = _contaDoPagamento;
  if (!c) return '';
  if (tipo === 'reembolso') return c.pago.toFixed(2);
  if (tipo === 'sinal') return Math.min(c.metade, c.falta).toFixed(2);
  return c.falta.toFixed(2); // saldo e pagamento_integral: o que estiver faltando
}

window.pgTipoMudou = function () {
  const tipo = document.getElementById('pgTipo').value;
  document.getElementById('pgValor').value = valorSugerido(tipo);
  const dica = document.getElementById('pgDica');
  if (!dica) return;
  const c = _contaDoPagamento;
  dica.textContent = tipo === 'reembolso'
    ? 'Devolvendo tudo o que ele já tinha pago.'
    : (tipo === 'sinal' ? 'Metade do pedido, pra começar a imprimir.' : 'Tudo o que ainda falta pagar.');
  if (c && c.falta <= 0 && tipo !== 'reembolso') dica.textContent = 'Esse pedido já está pago por inteiro.';
};

        : '') +
      '<div style="display:flex; justify-content:space-between;"><span>Já pagou</span><strong>' + fmtMoney(pago) + '</strong></div>' +
      '<div style="display:flex; justify-content:space-between; border-top:1px solid var(--border); margin-top:5px; padding-top:5px;"><span>Falta</span><strong>' + fmtMoney(Math.max(0, total - pago)) + '</strong></div>' +

    '<label class="pergunta">O cliente pagou o quê?</label>' +

async function salvarPagamento(orderId) {
  const payment_type = document.getElementById('pgTipo').value;
  const amount = parseFloat(document.getElementById('pgValor').value);
  const method = document.getElementById('pgMetodo').value;
  if (isNaN(amount) || amount <= 0) { toast('Preenche o valor do pagamento.'); return; }
  const { error } = await SUPA.from('payments').insert([{
    order_id: orderId, payment_type, amount, method, status: 'confirmado', paid_at: new Date().toISOString(), recorded_by: currentUser.id,
  }]);
  if (error) { toast('Erro: ' + error.message); return; }
  closeModal();
  toast('Pagamento registrado.');
