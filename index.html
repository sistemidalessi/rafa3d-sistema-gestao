<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rafa 3D — Sistema de Gestão</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%96%A8%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #0061f7;
    --blue-dark: #0846d4;
    --navy: #0b1733;
    --navy-deep: #000817;
    --bg: #eceef2;
    --border: #e1e5ec;
    --text: #0e1626;
    --muted: #6b7789;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Manrope', 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    background-image: radial-gradient(rgba(11,23,51,0.045) 1.2px, transparent 1.2px);
    background-size: 24px 24px;
    color: var(--text);
  }
  h1, h2, h3, .brand-font { font-family: 'Space Grotesk', sans-serif; }
  .hidden { display: none !important; }

  /* ---- login / conexão ---- */
  #authScreen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--navy-deep);
    background-image: radial-gradient(circle at 20% 20%, rgba(0,97,247,0.35), transparent 55%), radial-gradient(circle at 85% 80%, rgba(0,97,247,0.25), transparent 50%);
  }
  .auth-card {
    background: #fff; border-radius: 20px; padding: 36px 32px; width: 340px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.45);
  }
  .auth-card .auth-logo { width: 120px; display: block; margin: 0 auto 14px; }
  .auth-card h1 { font-size: 19px; margin: 0 0 2px; text-align: center; }
  .auth-card p.tagline {
    font-family: 'Caveat', cursive; font-weight: 700; font-size: 20px; color: var(--blue);
    text-align: center; margin: 0 0 16px;
  }
  .auth-card p.sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; text-align: center; }
  .auth-card label { display: block; font-size: 11px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; margin: 14px 0 5px; color: var(--muted); }
  .auth-card input {
    width: 100%; padding: 11px 13px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 14px;
    transition: border-color .15s;
  }
  .auth-card input:focus { outline: none; border-color: var(--blue); }
  .auth-card .error { color: #c0392b; font-size: 12px; margin-top: 12px; background: #fdeaea; padding: 8px 10px; border-radius: 8px; }
  .btn {
    background: linear-gradient(135deg, #0a6bff, var(--blue-dark)); color: #fff; border: none; border-radius: 999px;
    padding: 10px 18px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 13px; cursor: pointer;
    box-shadow: 0 4px 12px rgba(0,97,247,0.35); transition: transform .12s, box-shadow .12s;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(0,97,247,0.45); }
  .btn:active { transform: translateY(0); }
  .btn.full { width: 100%; margin-top: 20px; }
  .btn.secondary { background: linear-gradient(135deg, var(--navy), var(--navy-deep)); box-shadow: 0 4px 12px rgba(11,23,51,0.35); }
  .btn.ghost { background: transparent; color: var(--muted); border: 1.5px solid var(--border); box-shadow: none; }
  .btn.ghost:hover { background: #f5f6f9; box-shadow: none; }

  /* ---- app shell ---- */
  #appRoot { display: flex; min-height: 100vh; }
  .sidebar {
    width: 232px; flex: none; background: linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%); color: #cdd9ee;
    display: flex; flex-direction: column; padding: 20px 0;
  }
  .sidebar .brand { padding: 0 20px 20px; display: flex; align-items: center; gap: 10px; }
  .sidebar .brand img { width: 34px; height: auto; }
  .sidebar .brand .brand-txt { font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: #fff; font-size: 15px; line-height: 1.1; }
  .sidebar .brand .brand-txt small { display: block; font-weight: 500; color: #8ea0c0; font-size: 10.5px; margin-top: 2px; letter-spacing: .3px; }
  .nav-item {
    padding: 11px 20px; cursor: pointer; font-size: 13.5px; font-weight: 600; border-left: 3px solid transparent;
    display: flex; align-items: center; gap: 10px; transition: background .12s;
  }
  .nav-item .ic { font-size: 15px; }
  .nav-item:hover { background: rgba(255,255,255,0.06); }
  .nav-item.active {
    background: linear-gradient(90deg, rgba(0,97,247,0.28), rgba(0,97,247,0.05));
    border-left-color: var(--blue); color: #fff;
  }
  /* "Ver a loja" é link, não aba: nunca fica ativo e vai pra fora do
     sistema, então se separa das abas em vez de se misturar com elas. */
  .nav-item.nav-externo {
    color: inherit; text-decoration: none; margin-top: 10px; padding-top: 15px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .sidebar .who { margin-top: auto; padding: 16px 20px; font-size: 11.5px; color: #8ea0c0; border-top: 1px solid rgba(255,255,255,0.08); }
  .sidebar .who .who-name { color: #fff; font-weight: 700; font-family: 'Space Grotesk', sans-serif; font-size: 13px; margin-bottom: 2px; }
  .sidebar .who button { margin-top: 8px; }

  .main { flex: 1; padding: 26px 34px; min-width: 0; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .topbar h2 { margin: 0; font-size: 22px; letter-spacing: -.3px; }

  .card {
    background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 18px;
    margin-bottom: 16px; box-shadow: 0 6px 18px rgba(11,23,51,0.06);
  }
  .empty { color: var(--muted); font-size: 13px; padding: 20px 0; }

  /* Tela de dar preço no produto: os passos de um lado, a conta do
     outro. A conta fica grudada enquanto se rola de propósito — ver o
     número mudando enquanto digita é o que ensina que o preço nasce do
     custo, e não o contrário. */
  .preco-layout { display: grid; grid-template-columns: 1fr 310px; gap: 16px; align-items: start; }
  .preco-conta { position: sticky; top: 16px; }
  .passo { display: flex; align-items: center; gap: 10px; margin: 4px 0 2px; }
  .passo-num {
    width: 30px; height: 30px; border-radius: 50%; background: var(--blue); color: #fff; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px;
  }
  .passo-txt { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 16px; }
  .passo-sub { color: var(--muted); font-size: 12px; margin: 2px 0 6px 40px; }
  .passo-sep { border: none; border-top: 1px solid var(--border); margin: 22px 0 6px; }
  @media (max-width: 900px) {
    .preco-layout { grid-template-columns: 1fr; }
    .preco-conta { position: static; }
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 8px 10px; font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: .4px; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid var(--border); vertical-align: middle; }
  td { text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:hover td { background: #f7f9fc; }
  .row-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .prod-name { font-weight: 700; }
  /* As cinco cores valem o mesmo em todo o sistema:
     verde = deu certo · azul = está acontecendo · amarelo = precisa de
     você · vermelho = deu errado · cinza = parado, esperando.

     "andando" e "parado" existem porque tudo que estava em andamento
     usava .off, que é vermelho — "gerando modelo 3D…" aparecia com a
     mesma cara de "erro". */
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .badge.on { background: #e5f6ea; color: #1f8a3b; }
  .badge.off { background: #fdeaea; color: #c0392b; }
  .badge.andando { background: #e8f1ff; color: #1f4f9c; }
  .badge.atencao { background: #fff6e5; color: #8a5b00; }
  .badge.parado { background: #eef0f4; color: #5b6a85; }
  .thumb { width: 88px; height: 88px; object-fit: cover; object-position: center; background: #f3f4f7; border-radius: 50%; border: 1px solid var(--border); }

  /* ---- modal ---- */
  #modalRoot {
    position: fixed; inset: 0; background: rgba(11,23,51,0.5); display: none;
    align-items: center; justify-content: center; z-index: 500;
  }
  #modalRoot.show { display: flex; }
  .modal-box { background: #fff; border-radius: 18px; padding: 26px; width: 380px; max-width: 92vw; max-height: 82vh; overflow-y: auto; box-shadow: 0 30px 70px rgba(0,0,0,0.35); }
  .modal-box.wide { width: 560px; }
  .modal-box h3 { margin: 0 0 16px; font-size: 17px; }
  .modal-box label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; margin: 12px 0 5px; color: var(--muted); }
  /* Pergunta inteira em vez de rótulo curto: caixa alta de 11px serve pra
     "NOME", não pra "Quantos gramas de filamento ela gasta?" — que é como
     as telas de dinheiro perguntam, pra serem lidas sem esforço. Vale tanto
     dentro de modal quanto nas telas cheias (ex: desenharPrecificar), por
     isso não é escopado a .modal-box. */
  label.pergunta { display: block; font-size: 14px; text-transform: none; letter-spacing: 0; color: var(--text); margin-top: 16px; }
  input, select {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 9px; font-size: 13.5px; font-family: inherit;
  }
  input:focus, select:focus { outline: none; border-color: var(--blue); }
  .modal-box .modal-actions { display: flex; gap: 8px; margin-top: 22px; justify-content: flex-end; }

  /* ---- toast ---- */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: linear-gradient(135deg, var(--navy), var(--navy-deep)); color: #fff; padding: 11px 20px; border-radius: 999px;
    font-size: 13px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 999;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="authScreen"></div>
<div id="toast"></div>
<div id="modalRoot"></div>

<div id="appRoot" class="hidden">
  <div class="sidebar">
    <div class="brand">
      <img src="catalogo/assets/logo_clean.png" alt="Rafa 3D">
      <div class="brand-txt">Rafa 3D<small>Sistema de Gestão</small></div>
    </div>
    <div class="nav-item" data-tab="dashboard"><span class="ic">📊</span> Dashboard</div>
    <div class="nav-item" data-tab="projetos"><span class="ic">🪄</span> Projetos</div>
    <div class="nav-item" data-tab="pedidos"><span class="ic">🧾</span> Pedidos</div>
    <div class="nav-item" data-tab="fila"><span class="ic">🖨️</span> Fila de Impressão</div>
    <div class="nav-item" data-tab="filamentos"><span class="ic">🧵</span> Filamentos</div>
    <div class="nav-item" data-tab="impressoras"><span class="ic">⚙️</span> Impressoras</div>
    <div class="nav-item" data-tab="produtos"><span class="ic">🎁</span> Produtos</div>
    <div class="nav-item" data-tab="clientes"><span class="ic">👥</span> Clientes</div>
    <div class="nav-item" data-tab="financeiro"><span class="ic">💰</span> Financeiro</div>
    <div class="nav-item" data-tab="margem"><span class="ic">📈</span> Quanto sobrou</div>
    <!-- Não é aba: abre a loja numa janela nova, do jeito que o cliente
         vê. Serve pra conferir preço e foto no ar depois de mexer num
         produto, sem ter que procurar o endereço. -->
    <a class="nav-item nav-externo" href="catalogo/index.html" target="_blank" rel="noopener">
      <span class="ic">🛒</span> Ver a loja
      <span style="margin-left:auto; opacity:.6; font-size:11px;">↗</span>
    </a>
    <div class="who">
      <div id="whoLabel"></div>
      <button class="btn ghost" onclick="doLogout()">Sair</button>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <h2 id="pageTitle">Dashboard</h2>
    </div>
    <div id="tab-dashboard" class="tab-panel"></div>
    <div id="tab-projetos" class="tab-panel hidden"></div>
    <div id="tab-pedidos" class="tab-panel hidden"></div>
    <div id="tab-fila" class="tab-panel hidden"></div>
    <div id="tab-filamentos" class="tab-panel hidden"></div>
    <div id="tab-impressoras" class="tab-panel hidden"></div>
    <div id="tab-produtos" class="tab-panel hidden"></div>
    <div id="tab-clientes" class="tab-panel hidden"></div>
    <div id="tab-financeiro" class="tab-panel hidden"></div>
    <div id="tab-margem" class="tab-panel hidden"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   RAFA 3D — SISTEMA DE GESTÃO
   Todas as telas do sistema num arquivo só — ver README.md e CLAUDE.md.
   Sem build, sem framework — mesmo padrão do jjsolene-sistema-gestao.
   ============================================================ */

/* ============================================================
   CONEXÃO E LOGIN
   ============================================================ */
// Project URL e anon key do Supabase. A anon key é segura de ficar aqui —
// a proteção real é a Row Level Security do banco, não o segredo da chave.
const DEFAULT_SB_URL = 'https://zaoyqjzvwuhsqcgigppu.supabase.co';
const DEFAULT_SB_ANON = 'sb_publishable_UPFqlHbmOH84eYiF6ZRfsw_L_31GOqy';

let SUPA = null;
let currentUser = null;
let currentProfile = null;

function initClient(url, key) {
  try {
    SUPA = window.supabase.createClient(url, key);
  } catch (e) {
    renderLoginScreen('Não foi possível conectar: ' + e.message);
    return;
  }
  SUPA.auth.onAuthStateChange((event) => {
    if (event === 'SIGNED_OUT') {
      currentUser = null;
      currentProfile = null;
      renderLoginScreen();
    }
    // Chegou pelo link de "esqueci minha senha": entra direto na tela de
    // criar senha nova, e não no sistema.
    if (event === 'PASSWORD_RECOVERY') renderNovaSenhaScreen();
  });
  checkSession();
}

// Quando o link do e-mail vence ou já foi usado, o Supabase devolve o
// motivo no fim do endereço. Sem ler isso, a pessoa cai numa tela de
// login comum e não entende por que "não funcionou".
function erroNoEndereco() {
  const hash = window.location.hash || '';
  if (hash.indexOf('error') === -1) return null;
  const p = new URLSearchParams(hash.replace(/^#/, ''));
  const codigo = p.get('error_code') || '';
  history.replaceState(null, '', window.location.pathname + window.location.search);
  if (codigo.indexOf('expired') !== -1) {
    return 'Esse link de senha já venceu. Clica em "Esqueci minha senha" que eu mando outro.';
  }
  return 'Esse link de senha não vale mais. Clica em "Esqueci minha senha" que eu mando outro.';
}

async function checkSession() {
  const aviso = erroNoEndereco();
  if (aviso) { renderLoginScreen(aviso); return; }
  const { data } = await SUPA.auth.getSession();
  if (data && data.session) {
    currentUser = data.session.user;
    enterApp();
  } else {
    renderLoginScreen();
  }
}

function renderLoginScreen(errorMsg) {
  document.getElementById('appRoot').classList.add('hidden');
  const el = document.getElementById('authScreen');
  el.classList.remove('hidden');
  el.innerHTML =
    '<div class="auth-card">' +
      '<img class="auth-logo" src="catalogo/assets/logo_clean.png" alt="Rafa 3D">' +
      '<h1>Sistema de Gestão</h1>' +
      '<p class="tagline">Camada por camada!</p>' +
      '<p class="sub">Entre com seu e-mail e senha.</p>' +
      '<label>E-mail</label>' +
      '<input id="loginEmail" type="email" autocomplete="username">' +
      '<label>Senha</label>' +
      '<input id="loginPassword" type="password" autocomplete="current-password">' +
      (errorMsg ? '<div class="error">' + escapeHtml(errorMsg) + '</div>' : '') +
      '<button class="btn full" onclick="submitLogin()">Entrar</button>' +
      '<div style="text-align:center; margin-top:14px;">' +
        '<a href="#" onclick="pedirNovaSenha(); return false;" style="color:var(--muted); font-size:12.5px;">Esqueci minha senha</a>' +
      '</div>' +
    '</div>';
}

// Quem opera isto tem 10 anos e vai esquecer a senha — sem esta tela,
// a única saída seria alguém entrar no painel do Supabase por ele.
async function pedirNovaSenha() {
  const campo = document.getElementById('loginEmail');
  const email = (campo ? campo.value : '').trim();
  if (!email) { renderLoginScreen('Escreve seu e-mail ali em cima primeiro, aí eu mando o link.'); return; }

  // O link do e-mail volta pra esta mesma página. Sem dizer isso, o
  // Supabase manda pro endereço padrão dele (localhost:3000), que não
  // existe em computador nenhum de vocês.
  const voltarPara = window.location.href.split('#')[0];
  const { error } = await SUPA.auth.resetPasswordForEmail(email, { redirectTo: voltarPara });
  if (error) { renderLoginScreen('Não consegui mandar o e-mail: ' + error.message); return; }

  document.getElementById('authScreen').innerHTML =
    '<div class="auth-card">' +
      '<img class="auth-logo" src="catalogo/assets/logo_clean.png" alt="Rafa 3D">' +
      '<h1>Olha seu e-mail</h1>' +
      '<p class="sub">Mandei um link pra <strong>' + escapeHtml(email) + '</strong>.<br>' +
      'Abra o e-mail e clique no link pra criar uma senha nova.</p>' +
      '<p class="sub" style="font-size:12px;">O link vale por pouco tempo. Se demorar, peça outro.</p>' +
      '<button class="btn full secondary" onclick="renderLoginScreen()">Voltar</button>' +
    '</div>';
}

// Depois de clicar no link do e-mail, a pessoa chega aqui já autenticada
// só pra trocar a senha — não é o app aberto ainda.
function renderNovaSenhaScreen(aviso) {
  document.getElementById('appRoot').classList.add('hidden');
  const el = document.getElementById('authScreen');
  el.classList.remove('hidden');
  el.innerHTML =
    '<div class="auth-card">' +
      '<img class="auth-logo" src="catalogo/assets/logo_clean.png" alt="Rafa 3D">' +
      '<h1>Criar uma senha nova</h1>' +
      '<p class="sub">Escolha uma senha que você consiga lembrar.</p>' +
      '<label>Senha nova</label>' +
      '<input id="senhaNova" type="password" autocomplete="new-password">' +
      '<label>Escreve de novo</label>' +
      '<input id="senhaNova2" type="password" autocomplete="new-password">' +
      (aviso ? '<div class="error">' + escapeHtml(aviso) + '</div>' : '') +
      '<button class="btn full" onclick="salvarNovaSenha()">Salvar</button>' +
    '</div>';
}

async function salvarNovaSenha() {
  const a = document.getElementById('senhaNova').value;
  const b = document.getElementById('senhaNova2').value;
  if (a.length < 6) { renderNovaSenhaScreen('A senha precisa ter pelo menos 6 letras ou números.'); return; }
  if (a !== b) { renderNovaSenhaScreen('As duas senhas estão diferentes. Escreve de novo.'); return; }
  const { error } = await SUPA.auth.updateUser({ password: a });
  if (error) { renderNovaSenhaScreen('Não consegui salvar: ' + error.message); return; }
  // Tira o token da barra de endereço pra o link não ser reaproveitado.
  history.replaceState(null, '', window.location.pathname + window.location.search);
  const { data } = await SUPA.auth.getSession();
  if (data && data.session) { currentUser = data.session.user; enterApp(); }
  else renderLoginScreen('Senha trocada! Agora entra com ela.');
}

async function submitLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const { data, error } = await SUPA.auth.signInWithPassword({ email, password });
  if (error) { renderLoginScreen(error.message); return; }
  currentUser = data.user;
  enterApp();
}

async function doLogout() {
  await SUPA.auth.signOut();
}

async function enterApp() {
  const profileR = await SUPA.from('profiles').select('*').eq('id', currentUser.id).maybeSingle();
  if (profileR.error || !profileR.data) {
    console.log('[debug] currentUser.id =', currentUser.id);
    console.log('[debug] profileR =', profileR);
    document.getElementById('authScreen').innerHTML =
      '<div class="auth-card"><img class="auth-logo" src="catalogo/assets/logo_clean.png" alt="Rafa 3D"><h1>Acesso não liberado</h1>' +
      '<p class="sub">Seu login existe, mas ainda não tem perfil cadastrado no sistema. Peça pro Rafael liberar seu acesso.</p>' +
      (profileR.error ? '<p class="error">Detalhe técnico: ' + escapeHtml(profileR.error.message) + ' (código ' + escapeHtml(profileR.error.code || '') + ')</p>' : '<p class="error">Detalhe técnico: consulta não retornou erro, mas também nenhuma linha (data = null). Provável bloqueio de RLS.</p>') +
      '<button class="btn full secondary" onclick="doLogout()">Sair</button></div>';
    return;
  }
  currentProfile = profileR.data;
  const authEl = document.getElementById('authScreen');
  authEl.classList.add('hidden');
  authEl.innerHTML = '';
  document.getElementById('appRoot').classList.remove('hidden');
  const roleLabel = currentProfile.role === 'owner' ? 'dono(a)' : 'ajudante';
  document.getElementById('whoLabel').innerHTML =
    '<div class="who-name">Olá, ' + escapeHtml(currentProfile.full_name || currentUser.email) + '! 👋</div>' + roleLabel;
  applyRolePermissions();
  showTab('dashboard');
}

/* ============================================================
   NAVEGAÇÃO
   ============================================================ */
// Ajudante não vê custo/margem — essas telas (Filamentos, Impressoras com
// custo, relatório de margem) ficam reservadas ao owner. As demais abas
// operacionais (pedidos, fila, clientes) são liberadas pros dois.
const HELPER_ALLOWED_TABS = ['dashboard', 'projetos', 'pedidos', 'fila', 'clientes'];

const TAB_TITLES = {
  dashboard: '📊 Dashboard',
  projetos: '🪄 Projetos',
  pedidos: '🧾 Pedidos',
  fila: '🖨️ Fila de Impressão',
  filamentos: '🧵 Filamentos',
  impressoras: '⚙️ Impressoras',
  produtos: '🎁 Produtos',
  clientes: '👥 Clientes',
  financeiro: '💰 Financeiro',
  margem: '📈 Quanto sobrou',
};

function applyRolePermissions() {
  const isHelper = currentProfile && currentProfile.role === 'helper';
  document.querySelectorAll('.nav-item').forEach((item) => {
    // Item sem aba não é tela do sistema — é o link pra loja, que é
    // pública. Esconder dele não protegeria nada e só atrapalharia.
    if (!item.dataset.tab) return;
    if (HELPER_ALLOWED_TABS.indexOf(item.dataset.tab) === -1) {
      item.classList.toggle('hidden', isHelper);
    }
  });
}

async function showTab(name) {
  if (currentProfile && currentProfile.role === 'helper' && HELPER_ALLOWED_TABS.indexOf(name) === -1) {
    name = 'dashboard';
  }
  document.querySelectorAll('.tab-panel').forEach((p) => p.classList.add('hidden'));
  document.getElementById('tab-' + name).classList.remove('hidden');
  document.querySelectorAll('.nav-item').forEach((n) => n.classList.toggle('active', n.dataset.tab === name));
  document.getElementById('pageTitle').textContent = TAB_TITLES[name];
  await renderTab(name);
}

async function renderTab(name) {
  if (name === 'dashboard') await renderDashboard();
  if (name === 'projetos') await renderProjetos();
  if (name === 'pedidos') await renderPedidos();
  if (name === 'fila') await renderFila();
  if (name === 'filamentos') await renderFilamentos();
  if (name === 'impressoras') await renderImpressoras();
  if (name === 'produtos') await renderProdutos();
  if (name === 'clientes') await renderClientes();
  if (name === 'financeiro') await renderFinanceiro();
  if (name === 'margem') await renderMargem();
}

document.querySelectorAll('.nav-item').forEach((item) => {
  item.addEventListener('click', () => showTab(item.dataset.tab));
});

/* ============================================================
   DADOS COMPARTILHADOS (helpers)
   ============================================================ */
async function q(promise) {
  const { data, error } = await promise;
  if (error) { console.error(error); toast('Erro: ' + error.message); throw error; }
  return data;
}

function fmtMoney(n) {
  n = Number(n) || 0;
  return 'R$ ' + n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// Plural escrito à mão em vez de "1 vez(es)" e "1 item(ns)": texto com
// parêntese de plural parece escrito por máquina, e quem lê tem 10 anos.
function vezes(n) {
  return n + (n === 1 ? ' vez' : ' vezes');
}

function pecas(n) {
  return n + (n === 1 ? ' peça' : ' peças');
}

function todayISO() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function fmtDate(iso) {
  if (!iso) return '—';
  if (/^\d{4}-\d{2}-\d{2}$/.test(iso)) {
    const p = iso.split('-');
    return p[2] + '/' + p[1] + '/' + p[0];
  }
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('pt-BR');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3200);
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function emptyState(el, msg) {
  el.innerHTML = '<div class="card"><div class="empty">' + escapeHtml(msg) + '</div></div>';
}

function openModal(html, opts) {
  const root = document.getElementById('modalRoot');
  const wide = opts && opts.wide ? ' wide' : '';
  root.innerHTML = '<div class="modal-box' + wide + '">' + html + '</div>';
  root.classList.add('show');
  root.onclick = (e) => { if (e.target === root) closeModal(); };
}
function closeModal() {
  const root = document.getElementById('modalRoot');
  root.classList.remove('show');
  root.innerHTML = '';
  _produtoGerenciarAberto = null;
  _projetoGerenciarAberto = null;
}

async function renderDashboard() {
  const el = document.getElementById('tab-dashboard');
  el.innerHTML = '<div class="empty">Carregando...</div>';
  const isOwner = currentProfile && currentProfile.role === 'owner';

  const orcamentosPendentes = await q(SUPA.from('order_line_items')
    .select('*, orders(order_number, customers(name))')
    .eq('line_status', 'orcamento_pendente')
    .order('created_at'));
  const filaCounts = await q(SUPA.from('order_line_items').select('line_status').in('line_status', ['fila_impressao', 'imprimindo', 'pos_processamento']));
  const orders = await q(SUPA.from('orders').select('id, order_number, total_amount, customers(name)').neq('status', 'cancelado'));
  const statuses = await q(SUPA.from('orders_payment_status').select('*'));
  const statusById = {};
  statuses.forEach((s) => { statusById[s.order_id] = s; });
  const pendentesPagamento = orders.filter((o) => statusById[o.id] && statusById[o.id].payment_status !== 'quitado');
  const aReceber = pendentesPagamento.reduce((sum, o) => sum + (o.total_amount - statusById[o.id].total_paid), 0);

  const countFila = filaCounts.filter((i) => i.line_status === 'fila_impressao').length;
  const countImprimindo = filaCounts.filter((i) => i.line_status === 'imprimindo').length;
  const countPos = filaCounts.filter((i) => i.line_status === 'pos_processamento').length;

  let html = '';
  if (isOwner) html += cardAvisoPush();
  html += cardComputador();

  html += '<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:14px; margin-bottom:4px;">';
  html += statCard('🧾', orcamentosPendentes.length, 'Orçamentos pendentes');
  html += statCard('🖨️', countFila + countImprimindo, 'Na fila / imprimindo');
  html += statCard('🎨', countPos, 'Em pós-processamento');
  html += statCard('💰', fmtMoney(aReceber), 'A receber');
  html += '</div>';

  if (orcamentosPendentes.length > 0) {
    html += '<div class="card">';
    html += '<strong>🧾 Orçamentos aguardando aprovação</strong>';
    html += '<table style="margin-top:8px;"><tr><th>Pedido</th><th>Cliente</th><th>Item</th><th></th></tr>';
    orcamentosPendentes.forEach((it) => {
      html += '<tr>';
      html += '<td>' + escapeHtml(it.orders ? it.orders.order_number || '' : '') + '</td>';
      html += '<td>' + escapeHtml(it.orders && it.orders.customers ? it.orders.customers.name : '—') + '</td>';
      html += '<td>' + escapeHtml(it.custom_description || '') + (it.custom_reference_link ? ' <a href="' + escapeHtml(it.custom_reference_link) + '" target="_blank" rel="noopener">🔗</a>' : '') + '</td>';
      html += '<td class="row-actions">';
      if (isOwner) html += '<button class="btn ghost" onclick="abrirPedido(\'' + it.order_id + '\'); showTab(\'pedidos\');">Abrir pedido</button>';
      html += '</td></tr>';
    });
    html += '</table></div>';
  }

  if (isOwner) {
    const cores = await getFilamentos();
    await getSpools();
    const baixos = cores.filter((c) => estoquePorCor(c.id) <= c.low_stock_threshold_g && c.active);
    if (baixos.length > 0) {
      html += '<div class="card">';
      html += '<strong>🧵 Estoque de filamento baixo</strong>';
      html += '<table style="margin-top:8px;"><tr><th>Cor</th><th>Estoque</th><th></th></tr>';
      baixos.forEach((c) => {
        html += '<tr><td>' + escapeHtml(c.name) + '</td><td>' + estoquePorCor(c.id).toFixed(0) + ' g</td>';
        html += '<td class="row-actions"><button class="btn ghost" onclick="showTab(\'filamentos\')">Ver</button></td></tr>';
      });
      html += '</table></div>';
    }
  }

  if (orcamentosPendentes.length === 0 && countFila + countImprimindo + countPos === 0 && pendentesPagamento.length === 0) {
    html += '<div class="card"><div class="empty">Tudo em dia por aqui! 🎉</div></div>';
  }

  el.innerHTML = html;
}

function statCard(icon, valor, label) {
  return '<div class="card" style="text-align:center; margin-bottom:0;">' +
    '<div style="font-size:22px;">' + icon + '</div>' +
    '<div style="font-family:\'Space Grotesk\',sans-serif; font-weight:700; font-size:22px; margin-top:4px;">' + valor + '</div>' +
    '<div style="color:var(--muted); font-size:12px; margin-top:2px;">' + escapeHtml(label) + '</div>' +
  '</div>';
}

/* ============================================================
   QUAL COMPUTADOR ABRE O FATIADOR

   O Anderson e o Rafa trabalham e imprimem dos dois computadores. Como
   quem abre o arquivo de verdade é o agente instalado em cada máquina,
   o pedido precisa dizer pra qual deles vai — senão quem pegasse
   primeiro abriria a janela, e podia ser o computador vazio da outra
   sala.

   O nome não é digitado: cada agente se anuncia na tabela slicer_agents
   quando liga, e a tela só oferece a lista. Nome digitado à mão erraria,
   e quem opera tem 10 anos.

   A escolha fica guardada neste navegador, então a pergunta aparece uma
   vez só por computador.
   ============================================================ */

const CHAVE_COMPUTADOR = 'rafa3d_computador';
// O agente dá sinal de vida a cada volta do laço (5s). 60s de folga
// cobre uma internet ruim sem dar "desligado" por engano.
const SEGUNDOS_PRA_CONSIDERAR_LIGADO = 60;

let _computadoresListados = [];
let _acaoDepoisDeEscolher = null;
// Guardado também aqui na memória porque nem todo navegador deixa
// escrever no disco (janela anônima com bloqueio, política de empresa).
// Sem isso, quem estivesse nessa situação seria perguntado de novo a
// cada clique, pra sempre, sem entender por quê.
let _computadorNaMemoria = null;

function computadorEscolhido() {
  if (_computadorNaMemoria) return _computadorNaMemoria;
  try { return localStorage.getItem(CHAVE_COMPUTADOR) || null; } catch (e) { return null; }
}

function guardarComputador(nome) {
  _computadorNaMemoria = nome;
  try { localStorage.setItem(CHAVE_COMPUTADOR, nome); } catch (e) { /* vale só até fechar a aba */ }
}

async function listarComputadores() {
  const lista = await q(SUPA.from('slicer_agents').select('*').order('name'));
  const agora = Date.now();
  return (lista || []).map((c) => ({
    nome: c.name,
    ligado: (agora - new Date(c.last_seen_at).getTime()) / 1000 < SEGUNDOS_PRA_CONSIDERAR_LIGADO,
  }));
}

// Devolve o computador que deve abrir o arquivo. Se ninguém escolheu
// ainda neste navegador, abre a pergunta e devolve null — quem chamou
// para por aqui, e a ação é refeita sozinha depois da escolha.
async function garantirComputador(acaoDepois) {
  const jaEscolhido = computadorEscolhido();
  if (jaEscolhido) return jaEscolhido;
  _acaoDepoisDeEscolher = acaoDepois || null;
  await perguntarComputador();
  return null;
}

async function perguntarComputador() {
  _computadoresListados = await listarComputadores();
  let html = '<h3>Em qual computador você está?</h3>';
  html += '<p style="color:var(--muted); font-size:13px; margin:0 0 12px;">' +
    'É nele que a janela do fatiador vai abrir. Pergunto uma vez só — depois já fica sabendo.</p>';

  if (_computadoresListados.length === 0) {
    html += '<div class="empty">Nenhum computador está com o programa do fatiador ligado agora. ' +
      'Ligue o programa naquele que você quer usar (o atalho <strong>start-hidden.vbs</strong>) e clique aqui de novo.</div>';
  } else {
    _computadoresListados.forEach((c, i) => {
      html += '<button class="btn full" style="margin-bottom:8px;" onclick="escolherComputador(' + i + ')">' +
        escapeHtml(c.nome) + (c.ligado ? ' ✅ ligado agora' : ' 💤 desligado') + '</button>';
    });
  }
  html += '<div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Agora não</button></div>';
  openModal(html);
}

function escolherComputador(indice) {
  const c = _computadoresListados[indice];
  if (!c) return;
  guardarComputador(c.nome);
  closeModal();
  toast('Pronto! Os arquivos vão abrir no ' + c.nome + '.');
  const acao = _acaoDepoisDeEscolher;
  _acaoDepoisDeEscolher = null;
  if (acao) acao();
}

function trocarComputador() {
  _acaoDepoisDeEscolher = null;
  perguntarComputador();
}

// Card do Dashboard: mostra pra onde este navegador manda os arquivos e
// deixa trocar. Sem isso, quem escolhesse errado ficaria preso na
// escolha pra sempre.
function cardComputador() {
  const escolhido = computadorEscolhido();
  if (!escolhido) return '';
  return '<div class="card" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">' +
    '<span>🖥️ Os arquivos abrem no computador: <strong>' + escapeHtml(escolhido) + '</strong></span>' +
    '<button class="btn ghost" onclick="trocarComputador()">Trocar</button>' +
    '</div>';
}
const VAPID_PUBLIC_KEY = 'BL6grIejbqKL_Q5RAHP8zgkZQ7e8Ipj9d5kAExNyecBLrdYrAx_18iPqkAvKpPDhqHbeB0irxRMRB0kqfG2aAh4';

// Aviso instantâneo de pedido novo sem precisar de WhatsApp comercial:
// notificação nativa do navegador, funciona até com a aba fechada (não
// precisa estar com o sistema aberto), desde que tenha ativado uma vez.
//
// O card mostra três estados diferentes de propósito. Antes ele só
// escondia o botão quando a permissão estava 'granted' — então quem
// tivesse clicado em "Bloquear" uma vez via um botão que era impossível
// funcionar: o navegador responde "negado" na hora, sem abrir janela
// nenhuma, e da tela parecia que o botão estava quebrado.
function cardAvisoPush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return '';
  const permissao = window.Notification ? Notification.permission : 'default';

  if (permissao === 'granted') {
    return '<div class="card" style="display:flex; justify-content:space-between; align-items:center;">' +
      '<span>🔔 Avisos de pedido novo neste aparelho: <span class="badge on">ativado</span></span>' +
      '</div>';
  }

  if (permissao === 'denied') {
    return '<div class="card">' +
      '<div><strong>🔕 Este aparelho está bloqueando os avisos</strong></div>' +
      '<div style="color:var(--muted); font-size:13px; margin-top:6px;">' +
      'Alguém já respondeu "Bloquear" quando o navegador perguntou, e por isso ele nem pergunta mais. ' +
      'Pra liberar: clique no <strong>cadeado</strong> (ou no ícone à esquerda do endereço, lá em cima), ' +
      'procure <strong>Notificações</strong> e mude pra <strong>Permitir</strong>. Depois recarregue a página.' +
      '</div></div>';
  }

  return '<div class="card" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">' +
    '<span>🔔 Quer ser avisado na hora que chegar um pedido novo, mesmo com o sistema fechado?</span>' +
    '<button class="btn" onclick="ativarNotificacoesPush()">Ativar avisos neste aparelho</button>' +
    '</div>';
}

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
}

async function ativarNotificacoesPush() {
  // Service worker só funciona em página segura (https, ou localhost pra
  // testar). Aberta como arquivo solto ou por http comum, o navegador
  // recusa — e o erro que ele devolve não explica isso pra ninguém.
  if (!window.isSecureContext) {
    toast('Esta página precisa estar aberta pelo endereço https do sistema pra ligar os avisos.');
    return;
  }

  try {
    const permissao = await Notification.requestPermission();
    if (permissao === 'denied') {
      toast('O navegador está bloqueando os avisos. Clique no cadeado ao lado do endereço e libere as Notificações.');
      await renderDashboard();
      return;
    }
    if (permissao !== 'granted') { toast('Você fechou a pergunta sem responder. Clique de novo e escolha Permitir.'); return; }

    const registro = await navigator.serviceWorker.register('sw.js');
    const subscription = await registro.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
    });
    const raw = subscription.toJSON();
    const { error } = await SUPA.from('push_subscriptions').upsert({
      endpoint: raw.endpoint, p256dh: raw.keys.p256dh, auth: raw.keys.auth, user_id: currentUser.id,
    }, { onConflict: 'endpoint' });
    if (error) { toast('Consegui falar com o navegador, mas não consegui guardar no sistema: ' + error.message); return; }

    toast('Avisos ativados neste aparelho!');
    await renderDashboard();
  } catch (e) {
    // Mensagem crua de service worker não diz nada pra quem lê ("Failed
    // to register a ServiceWorker: ..."), então vem junto a tradução.
    toast('Não consegui ligar os avisos neste aparelho (' + e.message + '). Tente por outro navegador, ou avise o Anderson.');
  }
}

/* ====== CORES DOS STATUS ======
   Numa lista, "Imprimindo" e "Recebido" tinham exatamente a mesma cara —
   pra achar o que está na impressora agora era preciso ler linha por
   linha. Cor resolve isso antes da leitura, e é o que mais ajuda quem
   tem 10 anos.

   São cinco significados, e a mesma cor quer dizer a mesma coisa em
   qualquer aba do sistema:

     cinza    = chegou, ainda não começou
     amarelo  = precisa de você agora
     azul     = está acontecendo
     verde    = terminou, deu certo
     vermelho = deu errado ou foi cancelado */
const TOM = {
  parado:   { bg: '#eef0f4', fg: '#5b6a85', borda: '#dfe3ea' },
  atencao:  { bg: '#fff6e5', fg: '#8a5b00', borda: '#ffd894' },
  andando:  { bg: '#e8f1ff', fg: '#1f4f9c', borda: '#c3daff' },
  pronto:   { bg: '#e6f6ee', fg: '#0f6b45', borda: '#b6e3cd' },
  problema: { bg: '#fdeaea', fg: '#a62828', borda: '#f5c6c6' },
};

const TOM_DO_STATUS = {
  // peça dentro do pedido
  recebido: 'parado',
  orcamento_pendente: 'atencao',
  orcamento_aprovado: 'parado',
  fila_impressao: 'atencao',
  imprimindo: 'andando',
  pos_processamento: 'andando',
  embalado: 'andando',
  enviado: 'pronto',
  entregue: 'pronto',
  falhou_reimprimir: 'problema',
  cancelado: 'problema',
  // pedido
  orcamento: 'atencao',
  aguardando_aprovacao: 'atencao',
  aprovado: 'parado',
  em_producao: 'andando',
  concluido: 'pronto',
  // pagamento
  aguardando_sinal: 'atencao',
  sinal_pago: 'andando',
  quitado: 'pronto',
};

function tomDoStatus(status) {
  return TOM[TOM_DO_STATUS[status]] || TOM.parado;
}

// Etiqueta colorida, pra status que só se lê (não dá pra mudar ali).
function selo(status, texto) {
  const t = tomDoStatus(status);
  return '<span style="display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:600;'
    + ' background:' + t.bg + '; color:' + t.fg + '; border:1px solid ' + t.borda + ';">'
    + escapeHtml(texto || status || '—') + '</span>';
}

// A lista de escolher status também ganha cor: é onde ela mais faz
// falta, porque é o que aparece repetido linha após linha.
function estiloDoSelect(status) {
  const t = tomDoStatus(status);
  return 'background:' + t.bg + '; color:' + t.fg + '; border:1.5px solid ' + t.borda + '; font-weight:600;';
}

// Repinta o próprio select assim que muda, sem esperar a tela
// redesenhar — a cor tem que responder na hora do clique.
window.repintarSelect = function (el) {
  const t = tomDoStatus(el.value);
  el.style.background = t.bg;
  el.style.color = t.fg;
  el.style.borderColor = t.borda;
};

/* ============================================================
   PROJETOS — pedido personalizado com foto do cliente + IA
   (reaproveita order_line_items com line_type='custom'; não é
   tabela separada, é uma tela dedicada pra esse fluxo específico)
   ============================================================ */
let _projetosPollTimer = null;
let _projetoGerenciarAberto = null;

function projetoStatusBadge(li) {

    return '<span class="badge on">Aprovado — virou pedido</span>';
  }
  if (li.line_status === 'cancelado') return '<span class="badge off">Cancelado</span>';
  if (li.meshy_status === 'queued' || li.meshy_status === 'processing') return '<span class="badge andando">Gerando modelo 3D…</span>';
  if (li.model_file_path) return '<span class="badge on">Modelo pronto — falta aprovar preço</span>';
  return '<span style="color:var(--muted); font-size:11px;">Recebido — aguardando modelo 3D</span>';
}

async function renderProjetos() {
  const el = document.getElementById('tab-projetos');
  const scrollY = window.scrollY;
  const projetos = await q(SUPA.from('order_line_items').select('*, orders(order_number)').eq('line_type', 'custom').order('created_at', { ascending: false }));

  let html = '<div class="card">';
  html += '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">';
  html += '<strong>' + projetos.length + ' projetos</strong>';
  html += '<button class="btn" onclick="abrirNovoProjeto()">+ Novo Projeto</button>';
  html += '</div>';
  if (projetos.length === 0) {
    html += '<div class="empty">Nenhum projeto ainda. Cliente mandou foto pedindo uma peça? Clica em "+ Novo Projeto".</div>';
  } else {
    html += '<div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:14px;">';
    projetos.forEach((li) => {
      html += '<div style="border:1px solid var(--border); border-radius:12px; overflow:hidden; cursor:pointer;" onclick="abrirGerenciarProjeto(\'' + li.id + '\')">';
      if (li.custom_reference_image_path) {
        html += '<div id="projfoto-' + li.id + '" style="width:100%; aspect-ratio:1; background:#f3f4f7; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:12px;">carregando foto…</div>';
      } else {
        html += '<div style="width:100%; aspect-ratio:1; background:#f3f4f7; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:12px;">sem foto</div>';
      }
      html += '<div style="padding:10px 12px;">';
      html += '<div style="font-weight:700; font-size:13.5px; margin-bottom:2px;">' + escapeHtml(li.requester_name || 'Sem nome') + '</div>';
      html += '<div style="font-size:12px; color:var(--muted); margin-bottom:8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">' + escapeHtml(li.custom_description || '') + '</div>';
      html += projetoStatusBadge(li);
      html += '</div></div>';
    });
    html += '</div>';
  }
  html += '</div>';
  el.innerHTML = html;
  window.scrollTo(0, scrollY);
  requestAnimationFrame(() => window.scrollTo(0, scrollY));

  projetos.forEach((li) => {
    if (!li.custom_reference_image_path) return;
    SUPA.storage.from('projetos-fotos').createSignedUrl(li.custom_reference_image_path, 300).then(({ data }) => {
      const div = document.getElementById('projfoto-' + li.id);
      if (div && data) div.outerHTML = '<img src="' + data.signedUrl + '" style="width:100%; aspect-ratio:1; object-fit:cover; display:block;">';
    });
  });

  if (_projetoGerenciarAberto && document.getElementById('modalRoot').classList.contains('show')) {
    abrirGerenciarProjeto(_projetoGerenciarAberto);
  }

  clearTimeout(_projetosPollTimer);
  // As partes têm fila própria, na tabela project_parts. Sem consultar
  // ela aqui, a tela concluía "não tem nada em andamento" quando só as
  // partes estavam trabalhando, parava de se atualizar, e elas ficavam
  // em "gerando…" pra sempre — mesmo já prontas no banco há minutos.
  const partesEmAndamento = await q(SUPA.from('project_parts').select('id').limit(1)
    .or('meshy_status.in.(queued,processing),ai_analysis_status.in.(queued,processing),open_slicer_status.eq.queued'));
  const emAndamento = (partesEmAndamento && partesEmAndamento.length > 0) || projetos.some((li) =>
    li.meshy_status === 'queued' || li.meshy_status === 'processing' ||
    li.hi3d_status === 'queued' || li.hi3d_status === 'processing' ||
    li.ai_analysis_status === 'queued' || li.ai_analysis_status === 'processing' ||
    li.open_slicer_status === 'queued');
  if (emAndamento && !el.classList.contains('hidden')) {
    _projetosPollTimer = setTimeout(() => { renderProjetos(); }, 4000);
  }
}

function abrirNovoProjeto() {
  openModal(
    '<h3>Novo Projeto</h3>' +
    '<label>Nome de quem pediu</label><input id="projNome" type="text" placeholder="Nome do cliente">' +
    '<label>Contato (WhatsApp)</label><input id="projContato" type="text" placeholder="(11) 90000-0000">' +
    '<label>O que o cliente quer</label>' +
    '<textarea id="projDescricao" rows="3" placeholder="Descreva o que o cliente pediu..." style="width:100%; padding:11px 13px; border:1.5px solid var(--border); border-radius:10px; font-size:14px; font-family:inherit;"></textarea>' +
    '<label>Foto de referência (opcional)</label><input id="projFoto" type="file" accept="image/*">' +
    '<div style="font-size:12px; color:var(--muted); margin:-4px 0 4px;">Se a peça foi feita em pedaços separados (base, tampa, encaixe...), deixe essa foto em branco — na próxima tela você adiciona uma foto pra cada pedaço.</div>' +
    '<div class="modal-actions">' +

      '<button class="btn" onclick="criarProjeto()">Criar Projeto</button>' +

async function criarProjeto() {
  const requester_name = document.getElementById('projNome').value.trim();
  const requester_contact = document.getElementById('projContato').value.trim();
  const custom_description = document.getElementById('projDescricao').value.trim();
  const fileInput = document.getElementById('projFoto');
  const file = fileInput.files[0];
  if (!requester_name || !custom_description) { toast('Preenche pelo menos o nome e a descrição.'); return; }

  const order_number = 'PRJ-' + Date.now().toString(36).toUpperCase();
  const { data: order, error: orderErr } = await SUPA.from('orders').insert([{
    order_number, order_type: 'sob_encomenda', status: 'orcamento', channel: 'whatsapp', created_by: currentUser.id,
  }]).select().maybeSingle();
  if (orderErr) { toast('Erro: ' + orderErr.message); return; }

  const { data: li, error: liErr } = await SUPA.from('order_line_items').insert([{
    order_id: order.id, line_type: 'custom', custom_description, requester_name, requester_contact,
    quantity: 1, line_status: 'recebido',
  }]).select().maybeSingle();
  if (liErr) { toast('Erro: ' + liErr.message); return; }

  if (file) {
    const ext = file.name.split('.').pop();
    const path = li.id + '/foto.' + ext;
    const { error: upErr } = await SUPA.storage.from('projetos-fotos').upload(path, file, { upsert: true });
    if (upErr) { toast('Projeto criado, mas a foto falhou: ' + upErr.message); }
    else await SUPA.from('order_line_items').update({ custom_reference_image_path: path }).eq('id', li.id);
  }

  toast('Projeto criado!');
  await renderProjetos();
  await abrirGerenciarProjeto(li.id);
}

  const modeloErro = (li.meshy_status === 'error' && li.meshy_error) || (li.hi3d_status === 'error' && li.hi3d_error);

    html += '<button class="btn" onclick="abrirAprovarProjeto(\'' + li.id + '\')">💰 Aprovar e Definir Preço</button>';
  }
  html += '</div>';

  if (li.model_file_path) {
    html += '<div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-top:1px solid var(--border);">';
    html += '<span>Gostou do resultado? Pode virar item do catálogo, pra vender pra qualquer cliente.</span>';
    html += '<button class="btn ghost" onclick="transformarProjetoEmProduto(\'' + li.id + '\')">🎁 Transformar em Produto</button>';
    html += '</div>';
  }

  html += '</div><div class="modal-actions">' +
    '<button class="btn ghost" style="color:var(--text-danger, #c0392b); border-color:#f0c9c9;" onclick="excluirProjeto(\'' + li.id + '\', \'' + (li.order_id || '') + '\')">🗑️ Excluir Projeto</button>' +

  openModal(html, { wide: true });

const PARTE_STATUS_BADGE = {
  queued: '<span class="badge andando">na fila…</span>',
  processing: '<span class="badge andando">gerando…</span>',
  done: '<span class="badge on">pronto</span>',
  error: '<span class="badge off">erro</span>',
};

async function renderParteHtml(parte) {
  let fotoUrl = null;
  if (parte.reference_image_path) {
    const { data } = await SUPA.storage.from('projetos-fotos').createSignedUrl(parte.reference_image_path, 300);
    fotoUrl = data ? data.signedUrl : null;
  }
  const nome = escapeHtml(parte.nome || ('Parte ' + parte.ordem));
  let html = '<div class="card" style="background:#f7f9fc; margin-top:8px;">';
  html += '<div style="display:flex; gap:10px; align-items:flex-start;">';
  html += fotoUrl
    ? '<img src="' + fotoUrl + '" style="width:56px; height:56px; object-fit:cover; border-radius:8px; border:1px solid var(--border); flex:none;">'
    : '<div style="width:56px; height:56px; border-radius:8px; background:#e7e9ef; flex:none;"></div>';
  html += '<div style="flex:1; min-width:0;">';
  html += '<div style="display:flex; justify-content:space-between; align-items:center;"><strong style="font-size:13px;">' + nome + '</strong>';
  html += '<button class="btn ghost" style="font-size:11px; padding:3px 8px;" onclick="excluirParte(\'' + parte.id + '\')">🗑️</button></div>';

  html += '<div style="font-size:12px; margin-top:6px; display:flex; justify-content:space-between; align-items:center;">';
  html += '<span>Modelo 3D — ' + (parte.model_file_path ? '<span class="badge on">' + (parte.model_source === 'meshy_generated' ? 'gerado por IA' : 'anexado') + '</span>' : (PARTE_STATUS_BADGE[parte.meshy_status] || '<span style="color:var(--muted);">nenhum</span>')) + '</span>';
  if (!parte.model_file_path && parte.meshy_status !== 'queued' && parte.meshy_status !== 'processing' && parte.reference_image_path) {
    html += '<button class="btn ghost" style="font-size:11px; padding:3px 8px;" onclick="solicitarGerarModeloParte(\'' + parte.id + '\')">🧬 Gerar por IA</button>';
  }
  html += '</div>';

  if (parte.model_file_path) {
    html += '<div style="font-size:12px; margin-top:4px; display:flex; justify-content:space-between; align-items:center;">';
    html += '<span>Colinha — ' + (parte.ai_analysis_status === 'done' ? '<span class="badge on">pronta</span>' : (PARTE_STATUS_BADGE[parte.ai_analysis_status] || '<span style="color:var(--muted);">não pedida</span>')) + '</span>';
    html += '<span class="row-actions">';
    if (parte.ai_analysis_status === 'done') {
      html += '<button class="btn ghost" style="font-size:11px; padding:3px 8px;" onclick="verColinhaParte(\'' + parte.id + '\')">Ver</button>';
    }
    if (parte.ai_analysis_status !== 'queued' && parte.ai_analysis_status !== 'processing') {
      html += '<button class="btn ghost" style="font-size:11px; padding:3px 8px;" onclick="solicitarAnaliseIAParte(\'' + parte.id + '\')">🤖 ' + (parte.ai_analysis_status === 'done' ? 'De novo' : 'Analisar') + '</button>';
    }
    html += '</span></div>';
  }
  html += '</div></div></div>';
  return html;
}

function abrirAdicionarParte(lineItemId) {
  openModal(
    '<h3>Adicionar parte</h3>' +
    '<label>Nome dessa parte (opcional)</label><input id="parteNome" placeholder="Ex: Base, Tampa, Encaixe...">' +
    '<label>Foto de referência dessa parte</label><input id="parteFoto" type="file" accept="image/*">' +
    '<div class="modal-actions">' +
      '<button class="btn ghost" onclick="abrirGerenciarProjeto(\'' + lineItemId + '\')">Cancelar</button>' +
      '<button class="btn" onclick="salvarNovaParte(\'' + lineItemId + '\')">Adicionar</button>' +
    '</div>'
  );
}

async function salvarNovaParte(lineItemId) {
  const nome = document.getElementById('parteNome').value.trim() || null;
  const file = document.getElementById('parteFoto').files[0];
  if (!file) { toast('Escolhe uma foto pra essa parte.'); return; }

  const existentes = await q(SUPA.from('project_parts').select('ordem').eq('order_line_item_id', lineItemId).order('ordem', { ascending: false }).limit(1));
  const ordem = existentes.length ? existentes[0].ordem + 1 : 1;

  const { data: parte, error } = await SUPA.from('project_parts').insert({
    order_line_item_id: lineItemId, ordem, nome,
  }).select().single();
  if (error) { toast('Erro: ' + error.message); return; }

  const ext = file.name.split('.').pop();
  const path = lineItemId + '/partes/' + parte.id + '/foto.' + ext;
  const { error: upErr } = await SUPA.storage.from('projetos-fotos').upload(path, file, { upsert: true });
  if (upErr) { toast('Parte criada, mas a foto falhou: ' + upErr.message); }
  else await SUPA.from('project_parts').update({ reference_image_path: path }).eq('id', parte.id);

  toast('Parte adicionada.');
  abrirGerenciarProjeto(lineItemId);
}

async function excluirParte(parteId) {
  if (!confirm('Excluir essa parte? Não tem como desfazer.')) return;
  const { data: parte } = await SUPA.from('project_parts').select('order_line_item_id, reference_image_path, model_file_path').eq('id', parteId).maybeSingle();
  if (parte) {
    if (parte.reference_image_path) await SUPA.storage.from('projetos-fotos').remove([parte.reference_image_path]);
    if (parte.model_file_path) await SUPA.storage.from('modelos-3d').remove([parte.model_file_path]);
  }
  const { error } = await SUPA.from('project_parts').delete().eq('id', parteId);
  if (error) { toast('Erro: ' + error.message); return; }
  toast('Parte excluída.');
  if (parte) abrirGerenciarProjeto(parte.order_line_item_id);
}

async function solicitarGerarModeloParte(parteId) {
  const { error } = await SUPA.from('project_parts').update({
    meshy_status: 'queued', meshy_requested_at: new Date().toISOString(), meshy_error: null,
  }).eq('id', parteId);
  if (error) { toast('Erro: ' + error.message); return; }
  toast('Pedido enviado — o agente local gera o modelo em instantes.');
  const { data: parte } = await SUPA.from('project_parts').select('order_line_item_id').eq('id', parteId).maybeSingle();
  if (parte) abrirGerenciarProjeto(parte.order_line_item_id);
}

async function solicitarAnaliseIAParte(parteId) {
  const placa = garantirPlaca(() => solicitarAnaliseIAParte(parteId));
  if (!placa) return;
  const { error } = await SUPA.from('project_parts').update({
    ai_analysis_status: 'queued', ai_analysis_requested_at: new Date().toISOString(), ai_analysis_error: null,
    bed_plate: placa,
  }).eq('id', parteId);
  if (error) { toast('Erro: ' + error.message); return; }
  toast('Análise pedida — o agente local processa em instantes.');
  const { data: parte } = await SUPA.from('project_parts').select('order_line_item_id').eq('id', parteId).maybeSingle();
  if (parte) abrirGerenciarProjeto(parte.order_line_item_id);

async function aprovarProjeto(lineItemId, comCalculadora) {
  const payload = { line_status: 'orcamento_aprovado', updated_at: new Date().toISOString() };

  if (comCalculadora) {
    const form = lerFormularioCusto();
    const custo = calcularCustoReceita(form);
    const preco = precoAPartirDoCusto(custo.total, custoMultiplicador);
    if (!preco) { toast('Falta dizer quantos gramas a peça gasta e quantas horas ela demora.'); return; }
    payload.unit_price = preco;
    // Guarda o custo junto: é ele que a aba Margem vai usar pra saber se
    // esse projeto deu lucro de verdade lá na frente.
    payload.unit_cost_estimate = custo.total;
  } else {
    const preco = parseFloat(document.getElementById('projPreco').value);
    if (!preco || preco <= 0) { toast('Escreve quanto vai cobrar por esse projeto.'); return; }
    payload.unit_price = preco;
  }

  const { error } = await SUPA.from('order_line_items').update(payload).eq('id', lineItemId);
  if (error) { toast('Erro: ' + error.message); return; }

  // Sem isto o total do pedido continuava zerado depois de aprovar por
  // esta tela — o preço entrava na linha, mas não subia pro pedido.
  const li = _projetoPrecoAberto;
  if (li && li.order_id) await recalcularTotalPedido(li.order_id);

  closeModal();
  toast('Projeto aprovado por ' + fmtMoney(payload.unit_price) + '! Já entrou na fila de impressão.');
  await renderProjetos();
}

// Fila parada quase nunca é problema da fila: é o agente local
// desligado. O sintoma é o pior possível — botão girando pra sempre,
// sem erro nenhum na tela — e já custou mais de uma hora de confusão.
// Esta faixa transforma isso numa frase.
const SEGUNDOS_PRA_CONSIDERAR_PARADO = 90;

async function avisoAgenteParado() {
  // Consulta crua de propósito, sem passar pelo q(): ele mostra o erro
  // numa tarja pra quem está usando, e uma falha ao CONFERIR o agente
  // não é assunto do Rafa — se não deu pra saber, é melhor não dizer
  // nada do que assustar com um erro que ele não pode resolver.
  const { data: agentes, error } = await SUPA.from('slicer_agents').select('name, last_seen_at');
  if (error || !agentes) return '';
  const agora = Date.now();
  const vivo = agentes.some((a) => (agora - new Date(a.last_seen_at)) / 1000 < SEGUNDOS_PRA_CONSIDERAR_PARADO);
  if (vivo) return '';

  const ultimo = agentes
    .map((a) => new Date(a.last_seen_at))
    .sort((a, b) => b - a)[0];
  const quando = ultimo ? ' (visto pela última vez ' + fmtDate(ultimo) + ')' : '';
  return '<div class="card" style="background:#fff6e5; border:1px solid #ffd894;">'
    + '<div style="font-family:\'Space Grotesk\',sans-serif; font-weight:700; color:#8a5b00;">⏸️ O ajudante do computador está parado' + quando + '</div>'
    + '<div style="font-size:13px; color:#8a5b00; line-height:1.6; margin-top:6px;">'
    + 'Enquanto ele estiver desligado, os botões de <strong>colinha</strong> e de <strong>fatiador</strong> ficam esperando pra sempre e nada acontece.'
    + '<br>Pra ligar: dois cliques em <strong>slicer-agent\\start-hidden.vbs</strong>, na pasta do sistema.</div>'
    + '</div>';
}

// O que dá pra fazer com a peça de um item, direto da tela do pedido.
// Item personalizado não entra: o caminho dele é a aba Projetos, que já
// tem a cadeia inteira (gerar, dividir, colinha, fatiador).
function acoesDeImpressaoDoItem(it, orderId) {
  if (it.line_type !== 'catalog') return '';
  const p = it.products;
  if (!p) return '';
  const volta = 'pedido:' + orderId;

  // Sem arquivo 3D não há o que mandar pro fatiador. Em vez de esconder
  // o botão e deixar a pessoa sem entender, diz o que falta e leva
  // direto pro lugar de resolver.
  // Hoje esse é o caso da maioria: o catálogo foi montado com fotos, e
  // o arquivo de impressão nunca subiu pro sistema. Anexar os 161 de uma
  // vez não faz sentido — anexar o da peça que acabou de ser vendida
  // faz. Por isso o botão leva direto pra tela de anexar, e não pra
  // ficha do produto (onde ainda haveria mais um clique).
  if (!p.model_file_path) {
    return '<button class="btn" onclick="irParaAnexarModelo(\'' + p.id + '\')" title="Sem o arquivo não há o que mandar pro fatiador">📎 Anexar o arquivo 3D</button>';
  }

  let html = '';
  const st = p.open_slicer_status;
  if (st === 'queued' || st === 'processing') {
    html += '<button class="btn ghost" disabled>🖨️ Abrindo...</button>';
  } else {
    html += '<button class="btn" onclick="solicitarAbrirFatiador(\'' + p.id + '\', \'' + volta + '\')">🖨️ Abrir no Fatiador</button>';
  }
  if (st === 'error') {
    html += '<div style="font-size:11px; color:#c0392b; max-width:200px;">' + escapeHtml(p.open_slicer_error || 'deu erro') + '</div>';
  }

  // A colinha é o que diz COMO imprimir. Se já existe, o botão vira
  // "ver" em vez de gerar de novo — refazer gasta IA à toa.
  const ia = p.ai_analysis_status;
  if (ia === 'queued' || ia === 'processing') {
    html += '<button class="btn ghost" disabled>🤖 Analisando...</button>';
  } else if (p.ai_slicing_tips) {
    html += '<button class="btn ghost" onclick="irParaProduto(\'' + p.id + '\')">📋 Ver a colinha</button>';
  } else {
    html += '<button class="btn ghost" onclick="solicitarAnaliseIA(\'' + p.id + '\', \'' + volta + '\')">🤖 Pedir a colinha</button>';
  }
  return html;
}
