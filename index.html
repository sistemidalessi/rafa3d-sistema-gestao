<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rafa 3D — Sistema de Gestão</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%96%A8%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #0061f7;
    --blue-dark: #0846d4;
    --navy: #0b1733;
    --navy-deep: #000817;
    --bg: #eceef2;
    --border: #e1e5ec;
    --text: #0e1626;
    --muted: #6b7789;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Manrope', 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    background-image: radial-gradient(rgba(11,23,51,0.045) 1.2px, transparent 1.2px);
    background-size: 24px 24px;
    color: var(--text);
  }
  h1, h2, h3, .brand-font { font-family: 'Space Grotesk', sans-serif; }
  .hidden { display: none !important; }

  /* ---- login / conexão ---- */
  #authScreen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--navy-deep);
    background-image: radial-gradient(circle at 20% 20%, rgba(0,97,247,0.35), transparent 55%), radial-gradient(circle at 85% 80%, rgba(0,97,247,0.25), transparent 50%);
  }
  .auth-card {
    background: #fff; border-radius: 20px; padding: 36px 32px; width: 340px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.45);
  }
  .auth-card .auth-logo { width: 120px; display: block; margin: 0 auto 14px; }
  .auth-card h1 { font-size: 19px; margin: 0 0 2px; text-align: center; }
  .auth-card p.tagline {
    font-family: 'Caveat', cursive; font-weight: 700; font-size: 20px; color: var(--blue);
    text-align: center; margin: 0 0 16px;
  }
  .auth-card p.sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; text-align: center; }
  .auth-card label { display: block; font-size: 11px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; margin: 14px 0 5px; color: var(--muted); }
  .auth-card input {
    width: 100%; padding: 11px 13px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 14px;
    transition: border-color .15s;
  }
  .auth-card input:focus { outline: none; border-color: var(--blue); }
  .auth-card .error { color: #c0392b; font-size: 12px; margin-top: 12px; background: #fdeaea; padding: 8px 10px; border-radius: 8px; }
  .btn {
    background: linear-gradient(135deg, #0a6bff, var(--blue-dark)); color: #fff; border: none; border-radius: 999px;
    padding: 10px 18px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 13px; cursor: pointer;
    box-shadow: 0 4px 12px rgba(0,97,247,0.35); transition: transform .12s, box-shadow .12s;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(0,97,247,0.45); }
  .btn:active { transform: translateY(0); }
  .btn.full { width: 100%; margin-top: 20px; }
  .btn.secondary { background: linear-gradient(135deg, var(--navy), var(--navy-deep)); box-shadow: 0 4px 12px rgba(11,23,51,0.35); }
  .btn.ghost { background: transparent; color: var(--muted); border: 1.5px solid var(--border); box-shadow: none; }
  .btn.ghost:hover { background: #f5f6f9; box-shadow: none; }

  /* ---- app shell ---- */
  #appRoot { display: flex; min-height: 100vh; }
  .sidebar {
    width: 232px; flex: none; background: linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%); color: #cdd9ee;
    display: flex; flex-direction: column; padding: 20px 0;
  }
  .sidebar .brand { padding: 0 20px 20px; display: flex; align-items: center; gap: 10px; }
  .sidebar .brand img { width: 34px; height: auto; }
  .sidebar .brand .brand-txt { font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: #fff; font-size: 15px; line-height: 1.1; }
  .sidebar .brand .brand-txt small { display: block; font-weight: 500; color: #8ea0c0; font-size: 10.5px; margin-top: 2px; letter-spacing: .3px; }
  .nav-item {
    padding: 11px 20px; cursor: pointer; font-size: 13.5px; font-weight: 600; border-left: 3px solid transparent;
    display: flex; align-items: center; gap: 10px; transition: background .12s;
  }
  .nav-item .ic { font-size: 15px; }
  .nav-item:hover { background: rgba(255,255,255,0.06); }
  .nav-item.active {
    background: linear-gradient(90deg, rgba(0,97,247,0.28), rgba(0,97,247,0.05));
    border-left-color: var(--blue); color: #fff;
  }
  .sidebar .who { margin-top: auto; padding: 16px 20px; font-size: 11.5px; color: #8ea0c0; border-top: 1px solid rgba(255,255,255,0.08); }
  .sidebar .who .who-name { color: #fff; font-weight: 700; font-family: 'Space Grotesk', sans-serif; font-size: 13px; margin-bottom: 2px; }
  .sidebar .who button { margin-top: 8px; }

  .main { flex: 1; padding: 26px 34px; min-width: 0; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .topbar h2 { margin: 0; font-size: 22px; letter-spacing: -.3px; }

  .card {
    background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 18px;
    margin-bottom: 16px; box-shadow: 0 6px 18px rgba(11,23,51,0.06);
  }
  .empty { color: var(--muted); font-size: 13px; padding: 20px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 8px 10px; font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: .4px; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid var(--border); }
  td { text-align: left; padding: 10px; border-bottom: 1px solid var(--border); }
  tr:hover td { background: #f7f9fc; }
  .row-actions { display: flex; gap: 6px; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .badge.on { background: #e5f6ea; color: #1f8a3b; }
  .badge.off { background: #fdeaea; color: #c0392b; }
  .thumb { width: 40px; height: 40px; object-fit: contain; background: #f3f4f7; border-radius: 8px; }

  /* ---- modal ---- */
  #modalRoot {
    position: fixed; inset: 0; background: rgba(11,23,51,0.5); display: none;
    align-items: center; justify-content: center; z-index: 500;
  }
  #modalRoot.show { display: flex; }
  .modal-box { background: #fff; border-radius: 18px; padding: 26px; width: 380px; max-width: 92vw; box-shadow: 0 30px 70px rgba(0,0,0,0.35); }
  .modal-box h3 { margin: 0 0 16px; font-size: 17px; }
  .modal-box label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; margin: 12px 0 5px; color: var(--muted); }
  .modal-box input, .modal-box select {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 9px; font-size: 13.5px;
  }
  .modal-box input:focus, .modal-box select:focus { outline: none; border-color: var(--blue); }
  .modal-box .modal-actions { display: flex; gap: 8px; margin-top: 22px; justify-content: flex-end; }

  /* ---- toast ---- */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: linear-gradient(135deg, var(--navy), var(--navy-deep)); color: #fff; padding: 11px 20px; border-radius: 999px;
    font-size: 13px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 999;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="authScreen"></div>
<div id="toast"></div>
<div id="modalRoot"></div>

<div id="appRoot" class="hidden">
  <div class="sidebar">
    <div class="brand">
      <img src="catalogo/assets/logo_clean.png" alt="Rafa 3D">
      <div class="brand-txt">Rafa 3D<small>Sistema de Gestão</small></div>
    </div>
    <div class="nav-item" data-tab="dashboard"><span class="ic">📊</span> Dashboard</div>
    <div class="nav-item" data-tab="pedidos"><span class="ic">🧾</span> Pedidos</div>
    <div class="nav-item" data-tab="fila"><span class="ic">🖨️</span> Fila de Impressão</div>
    <div class="nav-item" data-tab="filamentos"><span class="ic">🧵</span> Filamentos</div>
    <div class="nav-item" data-tab="impressoras"><span class="ic">⚙️</span> Impressoras</div>
    <div class="nav-item" data-tab="produtos"><span class="ic">🎁</span> Produtos</div>
    <div class="nav-item" data-tab="clientes"><span class="ic">👥</span> Clientes</div>
    <div class="nav-item" data-tab="financeiro"><span class="ic">💰</span> Financeiro</div>
    <div class="who">
      <div id="whoLabel"></div>
      <button class="btn ghost" onclick="doLogout()">Sair</button>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <h2 id="pageTitle">Dashboard</h2>
    </div>
    <div id="tab-dashboard" class="tab-panel"></div>
    <div id="tab-pedidos" class="tab-panel hidden"></div>
    <div id="tab-fila" class="tab-panel hidden"></div>
    <div id="tab-filamentos" class="tab-panel hidden"></div>
    <div id="tab-impressoras" class="tab-panel hidden"></div>
    <div id="tab-produtos" class="tab-panel hidden"></div>
    <div id="tab-clientes" class="tab-panel hidden"></div>
    <div id="tab-financeiro" class="tab-panel hidden"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   RAFA 3D — SISTEMA DE GESTÃO
   Rascunho da Fase 1: login + navegação + esqueleto das seções.
   Sem build, sem framework — mesmo padrão do jjsolene-sistema-gestao.
   ============================================================ */

/* ============================================================
   CONEXÃO E LOGIN
   ============================================================ */
// TODO: preencher com o Project URL e a anon key do projeto Supabase
// (Project Settings → API) assim que ele existir. A anon key é segura
// de expor — a proteção real é a Row Level Security do banco.
const DEFAULT_SB_URL = 'https://zaoyqjzvwuhsqcgigppu.supabase.co';
const DEFAULT_SB_ANON = 'sb_publishable_UPFqlHbmOH84eYiF6ZRfsw_L_31GOqy';

let SUPA = null;
let currentUser = null;
let currentProfile = null;

function initClient(url, key) {
  try {
    SUPA = window.supabase.createClient(url, key);
  } catch (e) {
    renderLoginScreen('Não foi possível conectar: ' + e.message);
    return;
  }
  SUPA.auth.onAuthStateChange((event) => {
    if (event === 'SIGNED_OUT') {
      currentUser = null;
      currentProfile = null;
      renderLoginScreen();
    }
  });
  checkSession();
}

async function checkSession() {
  const { data } = await SUPA.auth.getSession();
  if (data && data.session) {
    currentUser = data.session.user;
    enterApp();
  } else {
    renderLoginScreen();
  }
}

function renderLoginScreen(errorMsg) {
  document.getElementById('appRoot').classList.add('hidden');
  const el = document.getElementById('authScreen');
  el.classList.remove('hidden');
  el.innerHTML =
    '<div class="auth-card">' +
      '<img class="auth-logo" src="catalogo/assets/logo_clean.png" alt="Rafa 3D">' +
      '<h1>Sistema de Gestão</h1>' +
      '<p class="tagline">Camada por camada!</p>' +
      '<p class="sub">Entre com seu e-mail e senha.</p>' +
      '<label>E-mail</label>' +
      '<input id="loginEmail" type="email" autocomplete="username">' +
      '<label>Senha</label>' +
      '<input id="loginPassword" type="password" autocomplete="current-password">' +
      (errorMsg ? '<div class="error">' + escapeHtml(errorMsg) + '</div>' : '') +
      '<button class="btn full" onclick="submitLogin()">Entrar</button>' +
    '</div>';
}

async function submitLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const { data, error } = await SUPA.auth.signInWithPassword({ email, password });
  if (error) { renderLoginScreen(error.message); return; }
  currentUser = data.user;
  enterApp();
}

async function doLogout() {
  await SUPA.auth.signOut();
}

async function enterApp() {
  const profileR = await SUPA.from('profiles').select('*').eq('id', currentUser.id).maybeSingle();
  if (profileR.error || !profileR.data) {
    console.log('[debug] currentUser.id =', currentUser.id);
    console.log('[debug] profileR =', profileR);
    document.getElementById('authScreen').innerHTML =
      '<div class="auth-card"><img class="auth-logo" src="catalogo/assets/logo_clean.png" alt="Rafa 3D"><h1>Acesso não liberado</h1>' +
      '<p class="sub">Seu login existe, mas ainda não tem perfil cadastrado no sistema. Peça pro Rafael liberar seu acesso.</p>' +
      (profileR.error ? '<p class="error">Detalhe técnico: ' + escapeHtml(profileR.error.message) + ' (código ' + escapeHtml(profileR.error.code || '') + ')</p>' : '<p class="error">Detalhe técnico: consulta não retornou erro, mas também nenhuma linha (data = null). Provável bloqueio de RLS.</p>') +
      '<button class="btn full secondary" onclick="doLogout()">Sair</button></div>';
    return;
  }
  currentProfile = profileR.data;
  const authEl = document.getElementById('authScreen');
  authEl.classList.add('hidden');
  authEl.innerHTML = '';
  document.getElementById('appRoot').classList.remove('hidden');
  const roleLabel = currentProfile.role === 'owner' ? 'dono(a)' : 'ajudante';
  document.getElementById('whoLabel').innerHTML =
    '<div class="who-name">Olá, ' + escapeHtml(currentProfile.full_name || currentUser.email) + '! 👋</div>' + roleLabel;
  applyRolePermissions();
  showTab('dashboard');
}

/* ============================================================
   NAVEGAÇÃO
   ============================================================ */
// Ajudante não vê custo/margem — essas telas (Filamentos, Impressoras com
// custo, relatório de margem) ficam reservadas ao owner. As demais abas
// operacionais (pedidos, fila, clientes) são liberadas pros dois.
const HELPER_ALLOWED_TABS = ['dashboard', 'pedidos', 'fila', 'clientes'];

const TAB_TITLES = {
  dashboard: '📊 Dashboard',
  pedidos: '🧾 Pedidos',
  fila: '🖨️ Fila de Impressão',
  filamentos: '🧵 Filamentos',
  impressoras: '⚙️ Impressoras',
  produtos: '🎁 Produtos',
  clientes: '👥 Clientes',
  financeiro: '💰 Financeiro',
};

function applyRolePermissions() {
  const isHelper = currentProfile && currentProfile.role === 'helper';
  document.querySelectorAll('.nav-item').forEach((item) => {
    if (HELPER_ALLOWED_TABS.indexOf(item.dataset.tab) === -1) {
      item.classList.toggle('hidden', isHelper);
    }
  });
}

async function showTab(name) {
  if (currentProfile && currentProfile.role === 'helper' && HELPER_ALLOWED_TABS.indexOf(name) === -1) {
    name = 'dashboard';
  }
  document.querySelectorAll('.tab-panel').forEach((p) => p.classList.add('hidden'));
  document.getElementById('tab-' + name).classList.remove('hidden');
  document.querySelectorAll('.nav-item').forEach((n) => n.classList.toggle('active', n.dataset.tab === name));
  document.getElementById('pageTitle').textContent = TAB_TITLES[name];
  await renderTab(name);
}

async function renderTab(name) {
  if (name === 'dashboard') await renderDashboard();
  if (name === 'pedidos') await renderPedidos();
  if (name === 'fila') await renderFila();
  if (name === 'filamentos') await renderFilamentos();
  if (name === 'impressoras') await renderImpressoras();
  if (name === 'produtos') await renderProdutos();
  if (name === 'clientes') await renderClientes();
  if (name === 'financeiro') await renderFinanceiro();
}

document.querySelectorAll('.nav-item').forEach((item) => {
  item.addEventListener('click', () => showTab(item.dataset.tab));
});

/* ============================================================
   DADOS COMPARTILHADOS (helpers)
   ============================================================ */
async function q(promise) {
  const { data, error } = await promise;
  if (error) { console.error(error); toast('Erro: ' + error.message); throw error; }
  return data;
}

function fmtMoney(n) {
  n = Number(n) || 0;
  return 'R$ ' + n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function todayISO() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function fmtDate(iso) {
  if (!iso) return '—';
  if (/^\d{4}-\d{2}-\d{2}$/.test(iso)) {
    const p = iso.split('-');
    return p[2] + '/' + p[1] + '/' + p[0];
  }
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('pt-BR');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3200);
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function emptyState(el, msg) {
  el.innerHTML = '<div class="card"><div class="empty">' + escapeHtml(msg) + '</div></div>';
}

function openModal(html) {
  const root = document.getElementById('modalRoot');
  root.innerHTML = '<div class="modal-box">' + html + '</div>';
  root.classList.add('show');
  root.onclick = (e) => { if (e.target === root) closeModal(); };
}
function closeModal() {
  const root = document.getElementById('modalRoot');
  root.classList.remove('show');
  root.innerHTML = '';
}

/* ============================================================
   DASHBOARD
   ============================================================ */
async function renderDashboard() {
  const el = document.getElementById('tab-dashboard');
  emptyState(el, 'Painel geral (pedidos em aberto, fila de impressão, estoque baixo) — chega na Fase 3/4.');
}

/* ============================================================
   PEDIDOS
   ============================================================ */
const LINE_STATUS_LABELS = {
  recebido: 'Recebido',
  orcamento_pendente: 'Orçamento pendente',
  orcamento_aprovado: 'Orçamento aprovado',
  fila_impressao: 'Fila de impressão',
  imprimindo: 'Imprimindo',
  pos_processamento: 'Pós-processamento',
  embalado: 'Embalado',
  enviado: 'Enviado',
  entregue: 'Entregue',
  falhou_reimprimir: 'Falhou (reimprimir)',
  cancelado: 'Cancelado',
};
const PAYMENT_STATUS_LABELS = {
  aguardando_sinal: 'Aguardando sinal',
  sinal_pago: 'Sinal pago',
  quitado: 'Quitado',
};

let pedidoDetalheId = null;

async function renderPedidos() {
  if (pedidoDetalheId) return renderPedidoDetalhe(pedidoDetalheId);

  const el = document.getElementById('tab-pedidos');
  el.innerHTML = '<div class="empty">Carregando...</div>';
  const orders = await q(SUPA.from('orders').select('*, customers(name)').order('created_at', { ascending: false }));
  const statuses = await q(SUPA.from('orders_payment_status').select('*'));
  const statusById = {};
  statuses.forEach((s) => { statusById[s.order_id] = s; });

  let html = '<div class="card">';
  html += '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">';
  html += '<strong>' + orders.length + ' pedidos</strong>';
  html += '<button class="btn" onclick="openPedidoForm()">+ Novo pedido</button>';
  html += '</div>';
  if (orders.length === 0) {
    html += '<div class="empty">Nenhum pedido ainda.</div>';
  } else {
    html += '<table><tr><th>Pedido</th><th>Cliente</th><th>Tipo</th><th>Status</th><th>Total</th><th>Pagamento</th><th></th></tr>';
    orders.forEach((o) => {
      const ps = statusById[o.id];
      html += '<tr>';
      html += '<td>' + escapeHtml(o.order_number || o.id.slice(0, 8)) + '<br><span style="color:var(--muted);font-size:11px;">' + fmtDate(o.created_at) + '</span></td>';
      html += '<td>' + escapeHtml(o.customers ? o.customers.name : '—') + '</td>';
      html += '<td>' + escapeHtml(o.order_type) + '</td>';
      html += '<td>' + escapeHtml(o.status) + '</td>';
      html += '<td>' + fmtMoney(o.total_amount) + '</td>';
      html += '<td><span class="badge ' + (ps && ps.payment_status === 'quitado' ? 'on' : 'off') + '">' + (ps ? PAYMENT_STATUS_LABELS[ps.payment_status] : '—') + '</span></td>';
      html += '<td class="row-actions"><button class="btn ghost" onclick="abrirPedido(\'' + o.id + '\')">Abrir</button></td>';
      html += '</tr>';
    });
    html += '</table>';
  }
  html += '</div>';
  el.innerHTML = html;
}

async function openPedidoForm() {
  const clientes = await getClientes();
  let options = '<option value="">— selecione —</option>';
  clientes.forEach((c) => { options += '<option value="' + c.id + '">' + escapeHtml(c.name) + '</option>'; });
  openModal(
    '<h3>Novo pedido</h3>' +
    '<label>Cliente</label>' +
    '<select id="pdCliente">' + options + '</select>' +
    '<div style="margin-top:6px;"><button class="btn ghost" onclick="openClienteFormInline()">+ cadastrar cliente novo</button></div>' +
    '<label>Canal</label>' +
    '<select id="pdCanal"><option value="whatsapp">WhatsApp</option><option value="google_form">Google Form</option><option value="presencial">Presencial</option><option value="app">App</option></select>' +
    '<div class="modal-actions">' +
      '<button class="btn ghost" onclick="closeModal()">Cancelar</button>' +
      '<button class="btn" onclick="criarPedido()">Criar e adicionar itens</button>' +
    '</div>'
  );
}

function openClienteFormInline() {
  openClienteForm();
}

async function criarPedido() {
  const customer_id = document.getElementById('pdCliente').value || null;
  const channel = document.getElementById('pdCanal').value;
  if (!customer_id) { toast('Seleciona um cliente (ou cadastra um novo primeiro).'); return; }
  const order_number = 'PED-' + Date.now().toString(36).toUpperCase();
  const { data, error } = await SUPA.from('orders').insert([{
    order_number, customer_id, channel, order_type: 'catalogo', status: 'orcamento', created_by: currentUser.id,
  }]).select().maybeSingle();
  if (error) { toast('Erro: ' + error.message); return; }
  closeModal();
  toast('Pedido criado. Agora adiciona os itens.');
  pedidoDetalheId = data.id;
  await renderPedidos();
}

function abrirPedido(id) {
  pedidoDetalheId = id;
  renderPedidos();
}
function voltarPedidos() {
  pedidoDetalheId = null;
  renderPedidos();
}

async function renderPedidoDetalhe(id) {
  const el = document.getElementById('tab-pedidos');
  el.innerHTML = '<div class="empty">Carregando...</div>';
  const order = await q(SUPA.from('orders').select('*, customers(name, phone)').eq('id', id).maybeSingle());
  const items = await q(SUPA.from('order_line_items').select('*, products(name)').eq('order_id', id).order('created_at'));
  const payments = await q(SUPA.from('payments').select('*').eq('order_id', id).order('created_at'));
  const ps = await q(SUPA.from('orders_payment_status').select('*').eq('order_id', id).maybeSingle());

  let html = '<button class="btn ghost" onclick="voltarPedidos()">&larr; Voltar</button>';
  html += '<div class="card" style="margin-top:12px;">';
  html += '<div style="display:flex; justify-content:space-between;">';
  html += '<div><strong>' + escapeHtml(order.order_number || order.id.slice(0, 8)) + '</strong><br>';
  html += '<span style="color:var(--muted);">' + escapeHtml(order.customers ? order.customers.name : '—') + (order.customers && order.customers.phone ? ' · ' + escapeHtml(order.customers.phone) : '') + '</span></div>';
  html += '<div style="text-align:right;"><div>' + fmtMoney(order.total_amount) + '</div>';
  html += '<span class="badge ' + (ps && ps.payment_status === 'quitado' ? 'on' : 'off') + '">' + (ps ? PAYMENT_STATUS_LABELS[ps.payment_status] : '—') + '</span></div>';
  html += '</div></div>';

  html += '<div class="card">';
  html += '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">';
  html += '<strong>Itens</strong><button class="btn" onclick="openItemForm(\'' + id + '\')">+ Adicionar item</button>';
  html += '</div>';
  if (items.length === 0) {
    html += '<div class="empty">Nenhum item ainda.</div>';
  } else {
    html += '<table><tr><th>Item</th><th>Qtd</th><th>Preço</th><th>Status</th><th></th></tr>';
    items.forEach((it) => {
      const nome = it.line_type === 'catalog' ? (it.products ? it.products.name : '—') : it.custom_description;
      html += '<tr>';
      html += '<td>' + escapeHtml(nome) + (it.line_type === 'custom' ? ' <span style="color:var(--muted);font-size:11px;">(personalizado)</span>' : '') + '</td>';
      html += '<td>' + it.quantity + '</td>';
      html += '<td>' + fmtMoney(it.unit_price * it.quantity) + '</td>';
      html += '<td><select onchange="mudarStatusItem(\'' + it.id + '\', this.value, \'' + id + '\')">';
      Object.keys(LINE_STATUS_LABELS).forEach((k) => {
        html += '<option value="' + k + '"' + (k === it.line_status ? ' selected' : '') + '>' + LINE_STATUS_LABELS[k] + '</option>';
      });
      html += '</select></td>';
      html += '<td class="row-actions"><button class="btn ghost" onclick="removerItem(\'' + it.id + '\', \'' + id + '\')">Remover</button></td>';
      html += '</tr>';
    });
    html += '</table>';
  }
  html += '</div>';

  html += '<div class="card">';
  html += '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">';
  html += '<strong>Pagamentos</strong><button class="btn" onclick="openPagamentoForm(\'' + id + '\')">+ Registrar pagamento</button>';
  html += '</div>';
  if (payments.length === 0) {
    html += '<div class="empty">Nenhum pagamento registrado.</div>';
  } else {
    html += '<table><tr><th>Tipo</th><th>Valor</th><th>Método</th><th>Status</th><th>Data</th></tr>';
    payments.forEach((p) => {
      html += '<tr><td>' + escapeHtml(p.payment_type) + '</td><td>' + fmtMoney(p.amount) + '</td><td>' + escapeHtml(p.method || '—') + '</td>';
      html += '<td>' + escapeHtml(p.status) + '</td><td>' + fmtDate(p.created_at) + '</td></tr>';
    });
    html += '</table>';
  }
  html += '<div style="margin-top:8px; color:var(--muted); font-size:12px;">Sinal esperado (' + order.expected_deposit_pct + '%): ' + fmtMoney(order.total_amount * order.expected_deposit_pct / 100) + '</div>';
  html += '</div>';

  el.innerHTML = html;
}

async function recalcularTotalPedido(orderId) {
  const items = await q(SUPA.from('order_line_items').select('unit_price, quantity, line_type').eq('order_id', orderId));
  const total = items.reduce((s, it) => s + it.unit_price * it.quantity, 0);
  const types = new Set(items.map((it) => it.line_type));
  const order_type = types.size > 1 ? 'misto' : (types.has('custom') ? 'sob_encomenda' : 'catalogo');
  await SUPA.from('orders').update({ total_amount: total, order_type, updated_at: new Date().toISOString() }).eq('id', orderId);
}

async function openItemForm(orderId) {
  const produtos = await getProdutos();
  let options = '<option value="">— selecione —</option>';
  produtos.forEach((p) => { options += '<option value="' + p.id + '" data-price="' + p.sale_price + '">' + escapeHtml(p.catalog_code) + ' — ' + escapeHtml(p.name) + '</option>'; });
  openModal(
    '<h3>Adicionar item</h3>' +
    '<label><input type="radio" name="itTipo" value="catalog" checked onchange="toggleItemTipo()"> Do catálogo</label> ' +
    '<label><input type="radio" name="itTipo" value="custom" onchange="toggleItemTipo()"> Personalizado</label>' +
    '<div id="itCatalogFields">' +
      '<label>Produto</label>' +
      '<select id="itProduto" onchange="preencherPrecoItem()">' + options + '</select>' +
    '</div>' +
    '<div id="itCustomFields" class="hidden">' +
      '<label>Descrição</label><input id="itDescricao" placeholder="Ex: Suporte personalizado com logo">' +
      '<label>Referência (link, se houver)</label><input id="itLink" placeholder="Link do Pinterest, foto etc.">' +
    '</div>' +
    '<label>Quantidade</label><input id="itQtd" type="number" value="1" min="1">' +
    '<label>Preço unitário (R$)</label><input id="itPreco" type="number" step="0.01" value="0">' +
    '<div class="modal-actions">' +
      '<button class="btn ghost" onclick="closeModal()">Cancelar</button>' +
      '<button class="btn" onclick="salvarItem(\'' + orderId + '\')">Adicionar</button>' +
    '</div>'
  );
}

function toggleItemTipo() {
  const tipo = document.querySelector('input[name="itTipo"]:checked').value;
  document.getElementById('itCatalogFields').classList.toggle('hidden', tipo !== 'catalog');
  document.getElementById('itCustomFields').classList.toggle('hidden', tipo !== 'custom');
}

function preencherPrecoItem() {
  const sel = document.getElementById('itProduto');
  const opt = sel.options[sel.selectedIndex];
  document.getElementById('itPreco').value = opt.dataset.price || 0;
}

async function salvarItem(orderId) {
  const tipo = document.querySelector('input[name="itTipo"]:checked').value;
  const quantity = parseInt(document.getElementById('itQtd').value, 10) || 1;
  const unit_price = parseFloat(document.getElementById('itPreco').value);
  if (isNaN(unit_price)) { toast('Preenche o preço.'); return; }

  const payload = {
    order_id: orderId, line_type: tipo, quantity, unit_price,
  };
  if (tipo === 'catalog') {
    const productId = document.getElementById('itProduto').value;
    if (!productId) { toast('Seleciona um produto.'); return; }
    payload.product_id = productId;
    payload.line_status = 'recebido';
  } else {
    const desc = document.getElementById('itDescricao').value.trim();
    if (!desc) { toast('Descreve o item personalizado.'); return; }
    payload.custom_description = desc;
    payload.custom_reference_link = document.getElementById('itLink').value.trim() || null;
    payload.line_status = 'orcamento_pendente';
  }
  const { error } = await SUPA.from('order_line_items').insert([payload]);
  if (error) { toast('Erro: ' + error.message); return; }
  closeModal();
  await recalcularTotalPedido(orderId);
  toast('Item adicionado.');
  await renderPedidoDetalhe(orderId);
}

async function mudarStatusItem(itemId, novoStatus, orderId) {
  const { error } = await SUPA.from('order_line_items').update({ line_status: novoStatus, updated_at: new Date().toISOString() }).eq('id', itemId);
  if (error) { toast('Erro: ' + error.message); return; }
  toast('Status atualizado.');
}

async function removerItem(itemId, orderId) {
  if (!confirm('Remover este item do pedido?')) return;
  const { error } = await SUPA.from('order_line_items').delete().eq('id', itemId);
  if (error) { toast('Erro: ' + error.message); return; }
  await recalcularTotalPedido(orderId);
  await renderPedidoDetalhe(orderId);
}

function openPagamentoForm(orderId) {
  openModal(
    '<h3>Registrar pagamento</h3>' +
    '<label>Tipo</label>' +
    '<select id="pgTipo"><option value="sinal">Sinal</option><option value="saldo">Saldo</option><option value="pagamento_integral">Pagamento integral</option><option value="reembolso">Reembolso</option></select>' +
    '<label>Valor (R$)</label><input id="pgValor" type="number" step="0.01">' +
    '<label>Método</label>' +
    '<select id="pgMetodo"><option value="pix">PIX</option><option value="dinheiro">Dinheiro</option><option value="cartao">Cartão</option><option value="outro">Outro</option></select>' +
    '<div class="modal-actions">' +
      '<button class="btn ghost" onclick="closeModal()">Cancelar</button>' +
      '<button class="btn" onclick="salvarPagamento(\'' + orderId + '\')">Salvar</button>' +
    '</div>'
  );
}

async function salvarPagamento(orderId) {
  const payment_type = document.getElementById('pgTipo').value;
  const amount = parseFloat(document.getElementById('pgValor').value);
  const method = document.getElementById('pgMetodo').value;
  if (isNaN(amount) || amount <= 0) { toast('Preenche o valor do pagamento.'); return; }
  const { error } = await SUPA.from('payments').insert([{
    order_id: orderId, payment_type, amount, method, status: 'confirmado', paid_at: new Date().toISOString(), recorded_by: currentUser.id,
  }]);
  if (error) { toast('Erro: ' + error.message); return; }
  closeModal();
  toast('Pagamento registrado.');
  await renderPedidoDetalhe(orderId);
}

/* ============================================================
   PRODUTOS
   ============================================================ */
const CATEGORY_LABELS = {
  products: 'Vasos & Decoração',
  cars: 'Brinquedos & Expositores',
  holders: 'Porta Cards',
  utils: 'Suportes & Utilidades',
  wines: 'Bar & Vinhos',
  keychains: 'Chaveiros',
  phoneStands: 'Suportes para Celular',
  deskOrganizers: 'Organizadores de Mesa',
  books: 'Livros & Leitura',
  minis: 'Miniaturas & Personagens',
};

let produtosCache = [];
async function getProdutos(force) {
  if (produtosCache.length && !force) return produtosCache;
  produtosCache = await q(SUPA.from('products').select('*').order('catalog_code'));
  return produtosCache;
}

async function renderProdutos() {
  const el = document.getElementById('tab-produtos');
  el.innerHTML = '<div class="empty">Carregando...</div>';
  const produtos = await getProdutos(true);
  const isOwner = currentProfile && currentProfile.role === 'owner';

  let html = '<div class="card">';
  html += '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">';
  html += '<strong>' + produtos.length + ' produtos</strong>';
  html += '</div>';
  if (produtos.length === 0) {
    html += '<div class="empty">Nenhum produto importado ainda.</div>';
  } else {
    html += '<table><tr><th></th><th>Código</th><th>Categoria</th><th>Nome</th><th>Preço</th><th>Status</th>' + (isOwner ? '<th></th>' : '') + '</tr>';
    produtos.forEach((p) => {
      html += '<tr>';
      html += '<td><img class="thumb" src="catalogo/' + escapeHtml(p.image_path || '') + '" onerror="this.style.visibility=\'hidden\'"></td>';
      html += '<td>' + escapeHtml(p.catalog_code) + '</td>';
      html += '<td>' + escapeHtml(CATEGORY_LABELS[p.category] || p.category) + '</td>';
      html += '<td>' + escapeHtml(p.name) + '</td>';
      html += '<td>' + fmtMoney(p.sale_price) + (p.price_unit_note ? ' <span style="color:var(--muted);font-size:11px;">' + escapeHtml(p.price_unit_note) + '</span>' : '') + '</td>';
      html += '<td><span class="badge ' + (p.active ? 'on' : 'off') + '">' + (p.active ? 'Ativo' : 'Inativo') + '</span></td>';
      if (isOwner) {
        html += '<td class="row-actions"><button class="btn ghost" onclick="openProdutoForm(\'' + p.id + '\')">Editar</button></td>';
      }
      html += '</tr>';
    });
    html += '</table>';
  }
  html += '</div>';
  el.innerHTML = html;
}

function openProdutoForm(id) {
  const p = produtosCache.find((x) => x.id === id);
  if (!p) return;
  openModal(
    '<h3>Editar produto — ' + escapeHtml(p.catalog_code) + '</h3>' +
    '<label>Nome</label><input id="pdNome" value="' + escapeHtml(p.name) + '">' +
    '<label>Preço (R$)</label><input id="pdPreco" type="number" step="0.01" value="' + p.sale_price + '">' +
    '<label>Status</label>' +
    '<select id="pdAtivo"><option value="true"' + (p.active ? ' selected' : '') + '>Ativo</option><option value="false"' + (!p.active ? ' selected' : '') + '>Inativo</option></select>' +
    '<div class="modal-actions">' +
      '<button class="btn ghost" onclick="closeModal()">Cancelar</button>' +
      '<button class="btn" onclick="saveProduto(\'' + id + '\')">Salvar</button>' +
    '</div>'
  );
}

async function saveProduto(id) {
  const name = document.getElementById('pdNome').value.trim();
  const sale_price = parseFloat(document.getElementById('pdPreco').value);
  const active = document.getElementById('pdAtivo').value === 'true';
  if (!name || isNaN(sale_price)) { toast('Preencha nome e preço corretamente.'); return; }
  const { error } = await SUPA.from('products').update({ name, sale_price, active, updated_at: new Date().toISOString() }).eq('id', id);
  if (error) { toast('Erro: ' + error.message); return; }
  closeModal();
  toast('Produto salvo.');
  await renderProdutos();
}

let clientesCache = [];
async function getClientes(force) {
  if (clientesCache.length && !force) return clientesCache;
  clientesCache = await q(SUPA.from('customers').select('*').order('name'));
  return clientesCache;
}

async function renderClientes() {
  const el = document.getElementById('tab-clientes');
  el.innerHTML = '<div class="empty">Carregando...</div>';
  const clientes = await getClientes(true);
  let html = '<div class="card">';
  html += '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">';
  html += '<strong>' + clientes.length + ' clientes</strong>';
  html += '<button class="btn" onclick="openClienteForm()">+ Novo cliente</button>';
  html += '</div>';
  if (clientes.length === 0) {
    html += '<div class="empty">Nenhum cliente cadastrado ainda.</div>';
  } else {
    html += '<table><tr><th>Nome</th><th>WhatsApp</th><th>E-mail</th><th></th></tr>';
    clientes.forEach((c) => {
      html += '<tr><td>' + escapeHtml(c.name) + '</td><td>' + escapeHtml(c.phone) + '</td><td>' + escapeHtml(c.email) + '</td>';
      html += '<td class="row-actions"><button class="btn ghost" onclick="openClienteForm(\'' + c.id + '\')">Editar</button></td></tr>';
    });
    html += '</table>';
  }
  html += '</div>';
  el.innerHTML = html;
}

function openClienteForm(id) {
  const c = id ? clientesCache.find((x) => x.id === id) : null;
  openModal(
    '<h3>' + (c ? 'Editar cliente' : 'Novo cliente') + '</h3>' +
    '<label>Nome</label><input id="clNome" value="' + (c ? escapeHtml(c.name) : '') + '">' +
    '<label>WhatsApp</label><input id="clFone" value="' + (c ? escapeHtml(c.phone || '') : '') + '">' +
    '<label>E-mail</label><input id="clEmail" value="' + (c ? escapeHtml(c.email || '') : '') + '">' +
    '<div class="modal-actions">' +
      '<button class="btn ghost" onclick="closeModal()">Cancelar</button>' +
      '<button class="btn" onclick="saveCliente(' + (c ? "'" + id + "'" : 'null') + ')">Salvar</button>' +
    '</div>'
  );
}

async function saveCliente(id) {
  const name = document.getElementById('clNome').value.trim();
  const phone = document.getElementById('clFone').value.trim();
  const email = document.getElementById('clEmail').value.trim();
  if (!name) { toast('Preenche o nome do cliente.'); return; }
  const payload = { name, phone: phone || null, email: email || null };
  const { error } = id
    ? await SUPA.from('customers').update(payload).eq('id', id)
    : await SUPA.from('customers').insert([payload]);
  if (error) { toast('Erro: ' + error.message); return; }
  closeModal();
  toast('Cliente salvo.');
  await renderClientes();
}

/* ============================================================
   FINANCEIRO
   ============================================================ */
async function renderFinanceiro() {
  const el = document.getElementById('tab-financeiro');
  el.innerHTML = '<div class="empty">Carregando...</div>';
  const orders = await q(SUPA.from('orders').select('id, order_number, total_amount, created_at, customers(name)').neq('status', 'cancelado'));
  const statuses = await q(SUPA.from('orders_payment_status').select('*'));
  const statusById = {};
  statuses.forEach((s) => { statusById[s.order_id] = s; });

  const pendentes = orders.filter((o) => statusById[o.id] && statusById[o.id].payment_status !== 'quitado');
  const totalReceber = pendentes.reduce((sum, o) => sum + (o.total_amount - (statusById[o.id].total_paid || 0)), 0);

  let html = '<div class="card"><strong>A receber (pedidos não quitados): ' + fmtMoney(totalReceber) + '</strong></div>';
  html += '<div class="card">';
  if (pendentes.length === 0) {
    html += '<div class="empty">Nenhum pedido com pagamento pendente.</div>';
  } else {
    html += '<table><tr><th>Pedido</th><th>Cliente</th><th>Total</th><th>Pago</th><th>Falta</th><th>Status</th><th></th></tr>';
    pendentes.forEach((o) => {
      const ps = statusById[o.id];
      const falta = o.total_amount - ps.total_paid;
      html += '<tr>';
      html += '<td>' + escapeHtml(o.order_number || o.id.slice(0, 8)) + '</td>';
      html += '<td>' + escapeHtml(o.customers ? o.customers.name : '—') + '</td>';
      html += '<td>' + fmtMoney(o.total_amount) + '</td>';
      html += '<td>' + fmtMoney(ps.total_paid) + '</td>';
      html += '<td>' + fmtMoney(falta) + '</td>';
      html += '<td><span class="badge off">' + PAYMENT_STATUS_LABELS[ps.payment_status] + '</span></td>';
      html += '<td class="row-actions"><button class="btn ghost" onclick="abrirPedido(\'' + o.id + '\'); showTab(\'pedidos\');">Abrir</button></td>';
      html += '</tr>';
    });
    html += '</table>';
  }
  html += '</div>';
  el.innerHTML = html;
}
