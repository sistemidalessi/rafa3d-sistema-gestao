async function uploadModelo3D(productId) {
  const p = produtosCache.find((x) => x.id === productId);
  const fileInput = document.getElementById('md3dArquivo');
  const file = fileInput.files[0];
  if (!file) { toast('Escolhe um arquivo .stl ou .3mf.'); return; }
  const path = p.catalog_code + '/' + file.name;
  const { error: upErr } = await SUPA.storage.from('modelos-3d').upload(path, file, { upsert: true });
  if (upErr) { toast('Erro no envio: ' + upErr.message); return; }
  const { error: dbErr } = await SUPA.from('products').update({ model_file_path: path, model_source: 'manual_upload', updated_at: new Date().toISOString() }).eq('id', productId);
  if (dbErr) { toast('Erro: ' + dbErr.message); return; }
  closeModal();
  toast('Arquivo 3D enviado.');
  await renderProdutos();
}

async function baixarModelo3D(productId) {
  const p = produtosCache.find((x) => x.id === productId);
  const { data, error } = await SUPA.storage.from('modelos-3d').createSignedUrl(p.model_file_path, 60);
  if (error) { toast('Erro: ' + error.message); return; }
  window.open(data.signedUrl, '_blank');
}

async function removerModelo3D(productId) {
  const p = produtosCache.find((x) => x.id === productId);
  if (!confirm('Remover o arquivo 3D deste produto?')) return;
  await SUPA.storage.from('modelos-3d').remove([p.model_file_path]);
  const { error } = await SUPA.from('products').update({ model_file_path: null, model_source: null, updated_at: new Date().toISOString() }).eq('id', productId);
  if (error) { toast('Erro: ' + error.message); return; }
  closeModal();
  toast('Arquivo removido.');
  await renderProdutos();
}

  const p = produtosCache.find((x) => x.id === productId);

    '<label>Pós-processamento (minutos)</label><input id="rcMinutos" type="number" step="1" value="' + (r.post_processing_minutes || 0) + '" oninput="atualizarCustoPreview()">' +
    '<label>Valor hora de mão de obra (R$)</label><input id="rcMaoObra" type="number" step="0.01" value="' + (r.post_processing_labor_rate || 0) + '" oninput="atualizarCustoPreview()">' +
    '<div class="card" id="rcPreview" style="margin-top:14px; background:#f7f9fc;"></div>' +
    '<div class="modal-actions">' +
      '<button class="btn ghost" onclick="closeModal()">Cancelar</button>' +
      '<button class="btn" onclick="saveReceita(\'' + productId + '\', ' + (r.id ? "'" + r.id + "'" : 'null') + ')">Salvar</button>' +
    '</div>'
  );
  atualizarCustoPreview();

function atualizarCustoPreview() {
  const colorId = document.getElementById('rcCor').value;
  const printerId = document.getElementById('rcImpressora').value;
  const grams = parseFloat(document.getElementById('rcGramas').value) || 0;
  const hours = parseFloat(document.getElementById('rcHoras').value) || 0;
  const minutes = parseFloat(document.getElementById('rcMinutos').value) || 0;
  const laborRate = parseFloat(document.getElementById('rcMaoObra').value) || 0;

  const custo = calcularCustoReceita({
    filament_color_id: colorId, printer_id: printerId, estimated_grams: grams,
    estimated_print_hours: hours, post_processing_minutes: minutes, post_processing_labor_rate: laborRate,
  });
  const el = document.getElementById('rcPreview');
  el.innerHTML =
    '<div>Material: ' + fmtMoney(custo.custoMaterial) + '</div>' +
    '<div>Máquina: ' + fmtMoney(custo.custoMaquina) + '</div>' +
    '<div>Mão de obra: ' + fmtMoney(custo.custoMaoObra) + '</div>' +
    '<div style="margin-top:6px; font-weight:700;">Custo total: ' + fmtMoney(custo.total) + '</div>';
}

async function saveReceita(productId, recipeId) {
  const filament_color_id = document.getElementById('rcCor').value || null;
  const printer_id = document.getElementById('rcImpressora').value || null;
  const estimated_grams = parseFloat(document.getElementById('rcGramas').value);
  const estimated_print_hours = parseFloat(document.getElementById('rcHoras').value);
  const post_processing_minutes = parseFloat(document.getElementById('rcMinutos').value) || 0;
  const post_processing_labor_rate = parseFloat(document.getElementById('rcMaoObra').value) || 0;
  if (isNaN(estimated_grams) || isNaN(estimated_print_hours)) { toast('Preenche peso e tempo de impressão.'); return; }
  const payload = { product_id: productId, filament_color_id, printer_id, estimated_grams, estimated_print_hours, post_processing_minutes, post_processing_labor_rate };
  const { error } = recipeId
    ? await SUPA.from('product_recipes').update(payload).eq('id', recipeId)
    : await SUPA.from('product_recipes').insert([payload]);
  if (error) { toast('Erro: ' + error.message); return; }
  closeModal();
  toast('Receita de custo salva.');
  await renderProdutos();
}

function openProdutoForm(id) {
  const p = produtosCache.find((x) => x.id === id);

async function saveProduto(id) {
  const name = document.getElementById('pdNome').value.trim();
  const sale_price = parseFloat(document.getElementById('pdPreco').value);
  const active = document.getElementById('pdAtivo').value === 'true';
  if (!name || isNaN(sale_price)) { toast('Preencha nome e preço corretamente.'); return; }
  const { error } = await SUPA.from('products').update({ name, sale_price, active, updated_at: new Date().toISOString() }).eq('id', id);
  if (error) { toast('Erro: ' + error.message); return; }
  closeModal();
  toast('Produto salvo.');
  await renderProdutos();

let clientesCache = [];
async function getClientes(force) {
  if (clientesCache.length && !force) return clientesCache;
  clientesCache = await q(SUPA.from('customers').select('*').order('name'));
  return clientesCache;
}

async function renderClientes() {
  const el = document.getElementById('tab-clientes');
  el.innerHTML = '<div class="empty">Carregando...</div>';
  const clientes = await getClientes(true);
  let html = '<div class="card">';
  html += '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">';
  html += '<strong>' + clientes.length + ' clientes</strong>';
  html += '<button class="btn" onclick="openClienteForm()">+ Novo cliente</button>';
  html += '</div>';
  if (clientes.length === 0) {
    html += '<div class="empty">Nenhum cliente cadastrado ainda.</div>';
  } else {
    html += '<table><tr><th>Nome</th><th>WhatsApp</th><th>E-mail</th><th></th></tr>';
    clientes.forEach((c) => {
      html += '<tr><td>' + escapeHtml(c.name) + '</td><td>' + escapeHtml(c.phone) + '</td><td>' + escapeHtml(c.email) + '</td>';
      html += '<td class="row-actions"><button class="btn ghost" onclick="openClienteForm(\'' + c.id + '\')">Editar</button></td></tr>';
    });
    html += '</table>';
  }
  html += '</div>';
  el.innerHTML = html;
}

function openClienteForm(id) {
  const c = id ? clientesCache.find((x) => x.id === id) : null;
  openModal(
    '<h3>' + (c ? 'Editar cliente' : 'Novo cliente') + '</h3>' +
    '<label>Nome</label><input id="clNome" value="' + (c ? escapeHtml(c.name) : '') + '">' +
    '<label>WhatsApp</label><input id="clFone" value="' + (c ? escapeHtml(c.phone || '') : '') + '">' +
    '<label>E-mail</label><input id="clEmail" value="' + (c ? escapeHtml(c.email || '') : '') + '">' +
    '<div class="modal-actions">' +
      '<button class="btn ghost" onclick="closeModal()">Cancelar</button>' +
      '<button class="btn" onclick="saveCliente(' + (c ? "'" + id + "'" : 'null') + ')">Salvar</button>' +
    '</div>'
  );
}

async function saveCliente(id) {
  const name = document.getElementById('clNome').value.trim();
  const phone = document.getElementById('clFone').value.trim();
  const email = document.getElementById('clEmail').value.trim();
  if (!name) { toast('Preenche o nome do cliente.'); return; }
  const payload = { name, phone: phone || null, email: email || null };
  const { error } = id
    ? await SUPA.from('customers').update(payload).eq('id', id)
    : await SUPA.from('customers').insert([payload]);
  if (error) { toast('Erro: ' + error.message); return; }
  closeModal();
  toast('Cliente salvo.');
  await renderClientes();
}

/* ============================================================
   FINANCEIRO
   ============================================================ */
async function renderFinanceiro() {
  const el = document.getElementById('tab-financeiro');
  el.innerHTML = '<div class="empty">Carregando...</div>';
  const orders = await q(SUPA.from('orders').select('id, order_number, total_amount, created_at, customers(name)').neq('status', 'cancelado'));
  const statuses = await q(SUPA.from('orders_payment_status').select('*'));
  const statusById = {};
  statuses.forEach((s) => { statusById[s.order_id] = s; });

  const pendentes = orders.filter((o) => statusById[o.id] && statusById[o.id].payment_status !== 'quitado');
  const totalReceber = pendentes.reduce((sum, o) => sum + (o.total_amount - (statusById[o.id].total_paid || 0)), 0);

  let html = '<div class="card"><strong>A receber (pedidos não quitados): ' + fmtMoney(totalReceber) + '</strong></div>';
  html += '<div class="card">';
  if (pendentes.length === 0) {
    html += '<div class="empty">Nenhum pedido com pagamento pendente.</div>';
  } else {
    html += '<table><tr><th>Pedido</th><th>Cliente</th><th>Total</th><th>Pago</th><th>Falta</th><th>Status</th><th></th></tr>';
    pendentes.forEach((o) => {
      const ps = statusById[o.id];
      const falta = o.total_amount - ps.total_paid;
      html += '<tr>';
      html += '<td>' + escapeHtml(o.order_number || o.id.slice(0, 8)) + '</td>';
      html += '<td>' + escapeHtml(o.customers ? o.customers.name : '—') + '</td>';
      html += '<td>' + fmtMoney(o.total_amount) + '</td>';
      html += '<td>' + fmtMoney(ps.total_paid) + '</td>';
      html += '<td>' + fmtMoney(falta) + '</td>';
      html += '<td><span class="badge off">' + PAYMENT_STATUS_LABELS[ps.payment_status] + '</span></td>';
      html += '<td class="row-actions"><button class="btn ghost" onclick="abrirPedido(\'' + o.id + '\'); showTab(\'pedidos\');">Abrir</button></td>';
      html += '</tr>';
    });
    html += '</table>';
  }
  html += '</div>';
  el.innerHTML = html;
}
