/* ============================================================
   MARGEM — o que cada venda deixou de verdade (só o dono)

   O custo de um item pode vir de quatro lugares, nesta ordem de
   confiança — e a tela sempre mostra de qual deles veio, porque
   misturar custo real com estimativa sem avisar é o mesmo que não ter
   relatório nenhum:

   1. real           — filamento realmente baixado do estoque (já inclui
                       o desperdício das tentativas que falharam), mais
                       máquina e pintura da receita de custo
   2. real (parcial) — tem baixa de estoque, mas o produto não tem
                       receita cadastrada: máquina e pintura ficam
                       de fora, então o custo sai por baixo
   3. estimado       — o número que o dono digitou ao aprovar o orçamento
   4. receita        — a estimativa da receita de custo do produto

   Sem nenhum dos quatro o item fica FORA da conta e é contado à parte:
   entrar com custo zero viraria lucro inventado.

   O schema-inicial previa isto como uma RPC no banco, restrita a is_owner().
   Ficou no navegador, como todas as outras telas — assim não depende de rodar
   patch novo pra funcionar. A aba já é escondida do ajudante pelo
   HELPER_ALLOWED_TABS, e as tabelas de custo (product_recipes, filament_colors,
   printers) são owner-only por RLS de qualquer jeito.
   ============================================================ */

// Item só entra na conta depois que virou trabalho de verdade. Antes de
// 'imprimindo' nada foi gasto ainda, e cancelado não é venda.
const MARGEM_STATUS_PRODUZIDO = ['imprimindo', 'pos_processamento', 'embalado', 'enviado', 'entregue'];

const MARGEM_FONTE_LABELS = {
  real: 'Contei de verdade',
  real_parcial: 'Contei só o filamento',
  estimado: 'A conta que você digitou',
  receita: 'A conta do produto',
};

let margemPeriodoDias = 90;
let margemDataDe = '';
let margemDataAte = '';

function setMargemPeriodo(dias) {
  margemPeriodoDias = dias;
  margemDataDe = '';
  margemDataAte = '';
  renderMargem();
}

function setMargemData(campo, valor) {
  if (campo === 'de') margemDataDe = valor; else margemDataAte = valor;
  renderMargem();
}

// Quanto custou 1 grama deste rolo. Prefere o que foi pago de verdade
// por ele; se o rolo entrou sem preço, cai pro valor de tabela da cor.
function custoPorGramaSpool(spool, cores) {
  if (spool && spool.cost_paid > 0 && spool.initial_weight_g > 0) {
    return spool.cost_paid / spool.initial_weight_g;
  }
  const cor = spool ? cores.find((c) => c.id === spool.color_id) : null;
  return cor && cor.cost_per_kg ? cor.cost_per_kg / 1000 : 0;
}

// Reimpressão é uma linha separada com unit_price = 0 (não se cobra de
// novo do cliente), então ela nunca é uma venda própria — o filamento e
// o tempo dela são custo da venda original. Por isso a conta é feita por
// "família": a linha original mais todas as reimpressões dela.
function calcularMargemFamilia(principal, reimpressoes, ctx) {
  const membros = [principal].concat(reimpressoes);
  const quantidade = Number(principal.quantity || 1);
  const receita = Number(principal.unit_price || 0) * quantidade;
  const base = { receita: receita, quantidade: quantidade, reimpressoes: reimpressoes.length };

  let materialReal = 0;
  let temBaixaDeEstoque = false;
  membros.forEach((m) => {
    (ctx.movimentosPorLinha[m.id] || []).forEach((mov) => {
      const gramas = Math.abs(Number(mov.grams_delta || 0));
      if (gramas <= 0) return;
      temBaixaDeEstoque = true;
      materialReal += gramas * custoPorGramaSpool(ctx.spools.find((s) => s.id === mov.spool_id), ctx.cores);
    });
  });

  const receitaProduto = principal.product_id ? ctx.receitasPorProduto[principal.product_id] : null;
  const custoReceita = receitaProduto ? calcularCustoReceita(receitaProduto) : null;

  if (temBaixaDeEstoque) {
    // Máquina e pintura são por peça produzida — uma reimpressão
    // ocupa a impressora de novo, então conta de novo.
    const pecas = membros.reduce((soma, m) => soma + Number(m.quantity || 1), 0);
    const maquinaPintura = custoReceita ? (custoReceita.custoMaquina + custoReceita.custoPintura) * pecas : 0;
    return Object.assign(base, {
      custo: materialReal + maquinaPintura,
      fonte: custoReceita ? 'real' : 'real_parcial',
    });
  }
  if (principal.unit_cost_estimate != null) {
    return Object.assign(base, { custo: Number(principal.unit_cost_estimate) * quantidade, fonte: 'estimado' });
  }
  if (custoReceita) {
    return Object.assign(base, { custo: custoReceita.total * quantidade, fonte: 'receita' });
  }
  return Object.assign(base, { custo: null, fonte: 'sem_custo' });
}

function margemPct(receita, custo) {
  if (!receita || receita <= 0) return null;
  return ((receita - custo) / receita) * 100;
}

// O selo mostra quanto sobra de cada R$ 100 que o cliente paga — em
// reais, não em porcentagem, que é como as telas de preço perguntam.
// Quando o custo passou do preço não existe "R$ -30 de cada R$ 100":
// aí a frase certa é que faltou dinheiro pra pagar a peça.
function margemBadge(pct) {
  if (pct === null) return '<span class="badge off">—</span>';
  if (pct < 0) return '<span class="badge off">faltou R$ ' + Math.abs(pct).toFixed(0) + '</span>';
  return '<span class="badge ' + (pct >= 40 ? 'on' : 'off') + '">R$ ' + pct.toFixed(0) + '</span>';
}
function margemBotoesPeriodo() {
  const usandoData = !!(margemDataDe || margemDataAte);
  const opcoes = [[30, '30 dias'], [90, '90 dias'], [365, '1 ano'], [0, 'Tudo']];
  let html = '<div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">';
  html += '<div style="display:flex; gap:6px; flex-wrap:wrap;">';
  opcoes.forEach((o) => {
    html += '<button class="btn ' + (!usandoData && margemPeriodoDias === o[0] ? '' : 'ghost') + '" onclick="setMargemPeriodo(' + o[0] + ')">' + o[1] + '</button>';
  });
  html += '</div>';
  html += '<div style="display:flex; gap:6px; align-items:center; font-size:12px; color:var(--muted);">';
  html += 'ou de <input type="date" value="' + escapeHtml(margemDataDe) + '" onchange="setMargemData(\'de\', this.value)" style="width:auto;">';
  html += 'até <input type="date" value="' + escapeHtml(margemDataAte) + '" onchange="setMargemData(\'ate\', this.value)" style="width:auto;">';
  html += '</div>';
  return html + '</div>';
}

function margemNomeDoItem(linha, produtos) {
  const p = produtos.find((x) => x.id === linha.product_id);
  if (p) return p.name;
  const desc = linha.custom_description || 'Item personalizado';
  return desc.length > 60 ? desc.slice(0, 60) + '…' : desc;
}

async function renderMargem() {
  const el = document.getElementById('tab-margem');
  el.innerHTML = '<div class="empty">Carregando...</div>';

  await getFilamentos();
  await getImpressoras();
  await getReceitas(true);
  const produtos = await getProdutos();
  const spools = await getSpools(true);
  const linhas = await q(SUPA.from('order_line_items').select('*, orders(status, order_number, customers(name))'));
  const movimentos = await q(SUPA.from('filament_stock_movements')
    .select('order_line_item_id, grams_delta, spool_id').not('order_line_item_id', 'is', null));

  const movimentosPorLinha = {};
  movimentos.forEach((m) => {
    if (!movimentosPorLinha[m.order_line_item_id]) movimentosPorLinha[m.order_line_item_id] = [];
    movimentosPorLinha[m.order_line_item_id].push(m);
  });
  const receitasPorProduto = {};
  receitasCache.forEach((r) => { receitasPorProduto[r.product_id] = r; });
  const reimpressoesPor = {};
  linhas.forEach((l) => {
    if (!l.reprint_of_line_item_id) return;
    if (!reimpressoesPor[l.reprint_of_line_item_id]) reimpressoesPor[l.reprint_of_line_item_id] = [];
    reimpressoesPor[l.reprint_of_line_item_id].push(l);
  });

  const ctx = { movimentosPorLinha: movimentosPorLinha, spools: spools, cores: filamentosCache, receitasPorProduto: receitasPorProduto };
  const limiteInicio = margemDataDe ? new Date(margemDataDe + 'T00:00:00').getTime()
    : (margemPeriodoDias ? Date.now() - margemPeriodoDias * 86400000 : null);
  const limiteFim = margemDataAte ? new Date(margemDataAte + 'T23:59:59').getTime() : null;
  const consideradas = linhas.filter((l) =>
    !l.reprint_of_line_item_id &&
    MARGEM_STATUS_PRODUZIDO.indexOf(l.line_status) !== -1 &&
    !(l.orders && l.orders.status === 'cancelado') &&
    (!limiteInicio || new Date(l.created_at).getTime() >= limiteInicio) &&
    (!limiteFim || new Date(l.created_at).getTime() <= limiteFim));

  const avaliadas = consideradas.map((l) =>
    Object.assign({ linha: l }, calcularMargemFamilia(l, reimpressoesPor[l.id] || [], ctx)));
  const comCusto = avaliadas.filter((a) => a.custo !== null);
  const semCusto = avaliadas.filter((a) => a.custo === null);

  // Gramas usadas por cor de filamento no período — soma a peça original
  // e todas as reimpressões dela, igual à conta de custo.
  const gramasPorCor = {};
  consideradas.forEach((l) => {
    [l].concat(reimpressoesPor[l.id] || []).forEach((m) => {
      (movimentosPorLinha[m.id] || []).forEach((mov) => {
        const gramas = Math.abs(Number(mov.grams_delta || 0));
        if (gramas <= 0) return;
        const spool = spools.find((s) => s.id === mov.spool_id);
        const corId = spool ? spool.color_id : null;
        if (!corId) return;
        gramasPorCor[corId] = (gramasPorCor[corId] || 0) + gramas;
      });
    });
  });
  const coresMaisUsadas = Object.keys(gramasPorCor).map((corId) => {
    const cor = filamentosCache.find((c) => c.id === corId);
    return { nome: cor ? cor.name : 'Cor removida', gramas: gramasPorCor[corId] };
  }).sort((a, b) => b.gramas - a.gramas).slice(0, 8);

  const porProduto = {};
  comCusto.filter((a) => a.linha.product_id).forEach((a) => {
    const k = a.linha.product_id;
    if (!porProduto[k]) porProduto[k] = { qtd: 0, receita: 0, custo: 0, reimpressoes: 0, fontes: {} };
    porProduto[k].qtd += a.quantidade;
    porProduto[k].receita += a.receita;
    porProduto[k].custo += a.custo;
    porProduto[k].reimpressoes += a.reimpressoes;
    porProduto[k].fontes[a.fonte] = true;
  });
  const linhasProduto = Object.keys(porProduto).map((k) => {
    const v = porProduto[k];
    const p = produtos.find((x) => x.id === k);
    return { nome: p ? p.name : 'Produto removido', codigo: p ? p.catalog_code : '', d: v, lucro: v.receita - v.custo };
  }).sort((a, b) => b.lucro - a.lucro);
  const maisVendidos = linhasProduto.slice().sort((a, b) => b.d.qtd - a.d.qtd).slice(0, 8);

  const faturamento = comCusto.reduce((s, a) => s + a.receita, 0);
  const custoTotal = comCusto.reduce((s, a) => s + a.custo, 0);
  const lucro = faturamento - custoTotal;
  const pctGeral = margemPct(faturamento, custoTotal);

  let html = '<div class="card" style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">';
  html += '<div><strong>Estou olhando</strong><div style="color:var(--muted); font-size:12px;">Só conto peça que já foi pra impressora. O que ainda está na fila não gastou nada.</div></div>';
  html += margemBotoesPeriodo() + '</div>';

  html += '<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:14px; margin-bottom:4px;">';
  html += statCard('🧾', fmtMoney(faturamento), 'Os clientes pagaram');
  html += statCard('🧵', fmtMoney(custoTotal), 'Custou pra fazer');
  html += statCard(lucro >= 0 ? '📈' : '📉', fmtMoney(lucro), 'Sobrou pra você');
  html += statCard('💰', pctGeral === null ? '—' : 'R$ ' + pctGeral.toFixed(0), 'Sobrou de cada R$ 100');
  html += '</div>';

  if (comCusto.length === 0 && semCusto.length === 0) {
    html += '<div class="card"><div class="empty">Nenhuma peça foi feita nesse tempo. Não tem nada pra contar ainda.</div></div>';
    el.innerHTML = html;
    return;
  }

  html += '<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:14px;">';

  html += '<div class="card">';
  if (maisVendidos.length > 0) {
    html += '<strong>🏆 Mais vendidos</strong>';
    html += '<div style="color:var(--muted); font-size:12px; margin-top:2px;">Quem saiu mais vezes da impressora.</div>';
    html += '<table style="margin-top:8px;"><tr><th>Produto</th><th>Vendidos</th></tr>';
    maisVendidos.forEach((r) => {
      html += '<tr><td><strong>' + escapeHtml(r.nome) + '</strong>' +
        (r.codigo ? ' <span style="color:var(--muted); font-size:11px;">' + escapeHtml(r.codigo) + '</span>' : '') + '</td>' +
        '<td>' + r.d.qtd + '</td></tr>';
    });
    html += '</table>';
  } else {
    html += '<strong>🏆 Mais vendidos</strong><div class="empty">Nenhum produto de catálogo vendido nesse tempo.</div>';
  }
  html += '</div>';

  html += '<div class="card">';
  if (coresMaisUsadas.length > 0) {
    html += '<strong>🎨 Cores de filamento mais usadas</strong>';
    html += '<div style="color:var(--muted); font-size:12px; margin-top:2px;">Quanto saiu do estoque, por cor.</div>';
    html += '<table style="margin-top:8px;"><tr><th>Cor</th><th>Gramas usados</th></tr>';
    coresMaisUsadas.forEach((c) => {
      html += '<tr><td>' + escapeHtml(c.nome) + '</td><td>' +
        (c.gramas >= 1000 ? (c.gramas / 1000).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' kg' : Math.round(c.gramas) + ' g') +
        '</td></tr>';
    });
    html += '</table>';
  } else {
    html += '<strong>🎨 Cores de filamento mais usadas</strong><div class="empty">Nenhuma baixa de estoque registrada nesse tempo.</div>';
  }
  html += '</div>';

  html += '</div>';

  if (semCusto.length > 0) {
    const receitaDeFora = semCusto.reduce((s, a) => s + a.receita, 0);
    html += '<div class="card">';
    html += '<strong>⚠️ ' + semCusto.length + (semCusto.length === 1 ? ' peça que eu não' : ' peças que eu não') + ' consegui contar</strong>';
    html += '<div style="color:var(--muted); font-size:13px; margin-top:4px;">';
    html += 'Isso dá ' + fmtMoney(receitaDeFora) + ' de venda que eu não sei quanto custou pra fazer: ninguém baixou o filamento no estoque e não tem a conta de custo montada. ';
    html += 'Se eu fizesse de conta que foram de graça, os números lá em cima ficariam maiores do que a verdade. Pra elas entrarem, abra a peça na aba Produtos e responda o "Quanto custa fazer".';
    html += '</div>';
    html += '<table style="margin-top:8px;"><tr><th>Pedido</th><th>Peça</th><th>O cliente pagou</th></tr>';
    semCusto.forEach((a) => {
      html += '<tr><td>' + escapeHtml(a.linha.orders && a.linha.orders.order_number ? a.linha.orders.order_number : '—') + '</td>';
      html += '<td>' + escapeHtml(margemNomeDoItem(a.linha, produtos)) + '</td>';
      html += '<td>' + fmtMoney(a.receita) + '</td></tr>';
    });
    html += '</table></div>';
  }

  if (linhasProduto.length > 0) {
    html += '<div class="card"><strong>🎁 Quanto cada produto deixou</strong>';
    html += '<div style="color:var(--muted); font-size:12px; margin-top:2px;">Começa pelo que mais sobrou.</div>';
    html += '<table style="margin-top:8px;"><tr><th>Produto</th><th>Vendidos</th><th>O cliente pagou</th><th>Custou</th><th>Sobrou</th><th>De cada R$ 100</th><th>Como eu contei</th></tr>';
    linhasProduto.forEach((r) => {
      html += '<tr>';
      html += '<td><strong>' + escapeHtml(r.nome) + '</strong>' +
        (r.codigo ? ' <span style="color:var(--muted); font-size:11px;">' + escapeHtml(r.codigo) + '</span>' : '') +
        (r.d.reimpressoes > 0 ? '<div style="font-size:11px; color:var(--muted);">teve que imprimir de novo ' + vezes(r.d.reimpressoes) + '</div>' : '') + '</td>';
      html += '<td>' + r.d.qtd + '</td>';
      html += '<td>' + fmtMoney(r.d.receita) + '</td>';
      html += '<td>' + fmtMoney(r.d.custo) + '</td>';
      html += '<td>' + fmtMoney(r.lucro) + '</td>';
      html += '<td>' + margemBadge(margemPct(r.d.receita, r.d.custo)) + '</td>';
      html += '<td style="font-size:11px; color:var(--muted);">' + escapeHtml(Object.keys(r.d.fontes).map((f) => MARGEM_FONTE_LABELS[f]).join(', ')) + '</td>';
      html += '</tr>';
    });
    html += '</table></div>';
  }

  const projetos = comCusto.filter((a) => a.linha.line_type === 'custom')
    .sort((a, b) => (b.receita - b.custo) - (a.receita - a.custo));
  if (projetos.length > 0) {
    html += '<div class="card"><strong>🪄 Projetos personalizados</strong>';
    html += '<div style="color:var(--muted); font-size:12px; margin-top:2px;">Cada projeto é diferente do outro, por isso eles aparecem um por um.</div>';
    html += '<table style="margin-top:8px;"><tr><th>Projeto</th><th>Cliente</th><th>O cliente pagou</th><th>Custou</th><th>Sobrou</th><th>De cada R$ 100</th><th>Como eu contei</th></tr>';
    projetos.forEach((a) => {
      const cliente = a.linha.requester_name ||
        (a.linha.orders && a.linha.orders.customers ? a.linha.orders.customers.name : '—');
      html += '<tr>';
      html += '<td>' + escapeHtml(margemNomeDoItem(a.linha, produtos)) + '</td>';
      html += '<td>' + escapeHtml(cliente) + '</td>';
      html += '<td>' + fmtMoney(a.receita) + '</td>';
      html += '<td>' + fmtMoney(a.custo) + '</td>';
      html += '<td>' + fmtMoney(a.receita - a.custo) + '</td>';
      html += '<td>' + margemBadge(margemPct(a.receita, a.custo)) + '</td>';
      html += '<td style="font-size:11px; color:var(--muted);">' + escapeHtml(MARGEM_FONTE_LABELS[a.fonte]) + '</td>';
      html += '</tr>';
    });
    html += '</table></div>';
  }

  const problemas = comCusto
    .map((a) => ({ a: a, pct: margemPct(a.receita, a.custo) }))
    .filter((x) => x.pct !== null && x.pct < 20)
    .sort((x, y) => x.pct - y.pct);
  if (problemas.length > 0) {
    html += '<div class="card"><strong>🔻 Vendas em que quase não sobrou nada</strong>';
    html += '<div style="color:var(--muted); font-size:12px; margin-top:2px;">Sobrou menos de R$ 20 de cada R$ 100. Vale ver se o preço está baixo demais, se gastou filamento demais ou se demorou muito pra imprimir.</div>';
    html += '<table style="margin-top:8px;"><tr><th>Pedido</th><th>Peça</th><th>O cliente pagou</th><th>Custou</th><th>De cada R$ 100</th><th>O que pode ter acontecido</th></tr>';
    problemas.forEach((x) => {
      const motivo = x.a.reimpressoes > 0
        ? 'teve que imprimir de novo ' + vezes(x.a.reimpressoes)
        : (x.pct < 0 ? 'gastou mais do que cobrou do cliente' : 'o preço está baixo pro que ela custa');
      html += '<tr>';
      html += '<td>' + escapeHtml(x.a.linha.orders && x.a.linha.orders.order_number ? x.a.linha.orders.order_number : '—') + '</td>';
      html += '<td>' + escapeHtml(margemNomeDoItem(x.a.linha, produtos)) + '</td>';
      html += '<td>' + fmtMoney(x.a.receita) + '</td>';
      html += '<td>' + fmtMoney(x.a.custo) + '</td>';
      html += '<td>' + margemBadge(x.pct) + '</td>';
      html += '<td style="font-size:11px; color:var(--muted);">' + escapeHtml(motivo) + '</td>';
      html += '</tr>';
    });
    html += '</table></div>';
  }

  el.innerHTML = html;
}

/* ============================================================
   FINANCEIRO
   ============================================================ */
async function renderFinanceiro() {
  const el = document.getElementById('tab-financeiro');
  el.innerHTML = '<div class="empty">Carregando...</div>';
  const orders = await q(SUPA.from('orders').select('id, order_number, total_amount, created_at, customer_name, customers(name)').neq('status', 'cancelado'));
  const statuses = await q(SUPA.from('orders_payment_status').select('*'));
  const statusById = {};
  statuses.forEach((s) => { statusById[s.order_id] = s; });

  const pendentes = orders.filter((o) => statusById[o.id] && statusById[o.id].payment_status !== 'quitado');
  const totalReceber = pendentes.reduce((sum, o) => sum + (o.total_amount - (statusById[o.id].total_paid || 0)), 0);

  let html = '<div class="card"><strong>A receber (pedidos não quitados): ' + fmtMoney(totalReceber) + '</strong></div>';
  html += '<div class="card">';
  if (pendentes.length === 0) {
    html += '<div class="empty">Nenhum pedido com pagamento pendente.</div>';
  } else {
    html += '<table><tr><th>Pedido</th><th>Cliente</th><th>Total</th><th>Pago</th><th>Falta</th><th>Status</th><th></th></tr>';
    pendentes.forEach((o) => {
      const ps = statusById[o.id];
      const falta = o.total_amount - ps.total_paid;
      html += '<tr>';
      html += '<td>' + escapeHtml(o.order_number || o.id.slice(0, 8)) + '</td>';
      html += '<td>' + escapeHtml(o.customers ? o.customers.name : (o.customer_name || '—')) + '</td>';
      html += '<td>' + fmtMoney(o.total_amount) + '</td>';
      html += '<td>' + fmtMoney(ps.total_paid) + '</td>';
      html += '<td>' + fmtMoney(falta) + '</td>';
      html += '<td>' + selo(ps.payment_status, PAYMENT_STATUS_LABELS[ps.payment_status]) + '</td>';
      html += '<td class="row-actions"><button class="btn ghost" onclick="abrirPedido(\'' + o.id + '\'); showTab(\'pedidos\');">Abrir</button></td>';
      html += '</tr>';
    });
    html += '</table>';
  }
  html += '</div>';
  el.innerHTML = html;
}
