<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rafa 3D — Sistema de Gestão</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%96%A8%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #0061f7;
    --blue-dark: #0846d4;
    --navy: #0b1733;
    --navy-deep: #000817;
    --bg: #eceef2;
    --border: #e1e5ec;
    --text: #0e1626;
    --muted: #6b7789;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Manrope', 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    background-image: radial-gradient(rgba(11,23,51,0.045) 1.2px, transparent 1.2px);
    background-size: 24px 24px;
    color: var(--text);
  }
  h1, h2, h3, .brand-font { font-family: 'Space Grotesk', sans-serif; }
  .hidden { display: none !important; }

  /* ---- login / conexão ---- */
  #authScreen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--navy-deep);
    background-image: radial-gradient(circle at 20% 20%, rgba(0,97,247,0.35), transparent 55%), radial-gradient(circle at 85% 80%, rgba(0,97,247,0.25), transparent 50%);
  }
  .auth-card {
    background: #fff; border-radius: 20px; padding: 36px 32px; width: 340px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.45);
  }
  .auth-card .auth-logo { width: 120px; display: block; margin: 0 auto 14px; }
  .auth-card h1 { font-size: 19px; margin: 0 0 2px; text-align: center; }
  .auth-card p.tagline {
    font-family: 'Caveat', cursive; font-weight: 700; font-size: 20px; color: var(--blue);
    text-align: center; margin: 0 0 16px;
  }
  .auth-card p.sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; text-align: center; }
  .auth-card label { display: block; font-size: 11px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; margin: 14px 0 5px; color: var(--muted); }
  .auth-card input {
    width: 100%; padding: 11px 13px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 14px;
    transition: border-color .15s;
  }
  .auth-card input:focus { outline: none; border-color: var(--blue); }
  .auth-card .error { color: #c0392b; font-size: 12px; margin-top: 12px; background: #fdeaea; padding: 8px 10px; border-radius: 8px; }
  .btn {
    background: linear-gradient(135deg, #0a6bff, var(--blue-dark)); color: #fff; border: none; border-radius: 999px;
    padding: 10px 18px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 13px; cursor: pointer;
    box-shadow: 0 4px 12px rgba(0,97,247,0.35); transition: transform .12s, box-shadow .12s;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(0,97,247,0.45); }
  .btn:active { transform: translateY(0); }
  .btn.full { width: 100%; margin-top: 20px; }
  .btn.secondary { background: linear-gradient(135deg, var(--navy), var(--navy-deep)); box-shadow: 0 4px 12px rgba(11,23,51,0.35); }
  .btn.ghost { background: transparent; color: var(--muted); border: 1.5px solid var(--border); box-shadow: none; }
  .btn.ghost:hover { background: #f5f6f9; box-shadow: none; }

  /* ---- app shell ---- */
  #appRoot { display: flex; min-height: 100vh; }
  .sidebar {
    width: 232px; flex: none; background: linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%); color: #cdd9ee;
    display: flex; flex-direction: column; padding: 20px 0;
  }
  .sidebar .brand { padding: 0 20px 20px; display: flex; align-items: center; gap: 10px; }
  .sidebar .brand img { width: 34px; height: auto; }
  .sidebar .brand .brand-txt { font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: #fff; font-size: 15px; line-height: 1.1; }
  .sidebar .brand .brand-txt small { display: block; font-weight: 500; color: #8ea0c0; font-size: 10.5px; margin-top: 2px; letter-spacing: .3px; }
  .nav-item {
    padding: 11px 20px; cursor: pointer; font-size: 13.5px; font-weight: 600; border-left: 3px solid transparent;
    display: flex; align-items: center; gap: 10px; transition: background .12s;
  }
  .nav-item .ic { font-size: 15px; }
  .nav-item:hover { background: rgba(255,255,255,0.06); }
  .nav-item.active {
    background: linear-gradient(90deg, rgba(0,97,247,0.28), rgba(0,97,247,0.05));
    border-left-color: var(--blue); color: #fff;
  }
  .sidebar .who { margin-top: auto; padding: 16px 20px; font-size: 11.5px; color: #8ea0c0; border-top: 1px solid rgba(255,255,255,0.08); }
  .sidebar .who .who-name { color: #fff; font-weight: 700; font-family: 'Space Grotesk', sans-serif; font-size: 13px; margin-bottom: 2px; }
  .sidebar .who button { margin-top: 8px; }

  .main { flex: 1; padding: 26px 34px; min-width: 0; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .topbar h2 { margin: 0; font-size: 22px; letter-spacing: -.3px; }

  .card {
    background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 18px;
    margin-bottom: 16px; box-shadow: 0 6px 18px rgba(11,23,51,0.06);
  }
  .empty { color: var(--muted); font-size: 13px; padding: 20px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 8px 10px; font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: .4px; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid var(--border); vertical-align: middle; }
  td { text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:hover td { background: #f7f9fc; }
  .row-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .prod-name { font-weight: 700; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .badge.on { background: #e5f6ea; color: #1f8a3b; }
  .badge.off { background: #fdeaea; color: #c0392b; }
  .thumb { width: 88px; height: 88px; object-fit: cover; object-position: center; background: #f3f4f7; border-radius: 50%; border: 1px solid var(--border); }

  /* ---- modal ---- */
  #modalRoot {
    position: fixed; inset: 0; background: rgba(11,23,51,0.5); display: none;
    align-items: center; justify-content: center; z-index: 500;
  }
  #modalRoot.show { display: flex; }
  .modal-box { background: #fff; border-radius: 18px; padding: 26px; width: 380px; max-width: 92vw; max-height: 82vh; overflow-y: auto; box-shadow: 0 30px 70px rgba(0,0,0,0.35); }
  .modal-box.wide { width: 560px; }
  .modal-box h3 { margin: 0 0 16px; font-size: 17px; }
  .modal-box label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; margin: 12px 0 5px; color: var(--muted); }
  .modal-box input, .modal-box select {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 9px; font-size: 13.5px;
  }
  .modal-box input:focus, .modal-box select:focus { outline: none; border-color: var(--blue); }
  .modal-box .modal-actions { display: flex; gap: 8px; margin-top: 22px; justify-content: flex-end; }

  /* ---- toast ---- */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: linear-gradient(135deg, var(--navy), var(--navy-deep)); color: #fff; padding: 11px 20px; border-radius: 999px;
    font-size: 13px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 999;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="authScreen"></div>
<div id="toast"></div>
<div id="modalRoot"></div>

<div id="appRoot" class="hidden">
  <div class="sidebar">
    <div class="brand">
      <img src="catalogo/assets/logo_clean.png" alt="Rafa 3D">
      <div class="brand-txt">Rafa 3D<small>Sistema de Gestão</small></div>
    </div>
    <div class="nav-item" data-tab="dashboard"><span class="ic">📊</span> Dashboard</div>
    <div class="nav-item" data-tab="projetos"><span class="ic">🪄</span> Projetos</div>
    <div class="nav-item" data-tab="pedidos"><span class="ic">🧾</span> Pedidos</div>
    <div class="nav-item" data-tab="fila"><span class="ic">🖨️</span> Fila de Impressão</div>
    <div class="nav-item" data-tab="filamentos"><span class="ic">🧵</span> Filamentos</div>
    <div class="nav-item" data-tab="impressoras"><span class="ic">⚙️</span> Impressoras</div>
    <div class="nav-item" data-tab="produtos"><span class="ic">🎁</span> Produtos</div>
    <div class="nav-item" data-tab="clientes"><span class="ic">👥</span> Clientes</div>
    <div class="nav-item" data-tab="financeiro"><span class="ic">💰</span> Financeiro</div>
    <div class="who">
      <div id="whoLabel"></div>
      <button class="btn ghost" onclick="doLogout()">Sair</button>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <h2 id="pageTitle">Dashboard</h2>
    </div>
    <div id="tab-dashboard" class="tab-panel"></div>
    <div id="tab-projetos" class="tab-panel hidden"></div>
    <div id="tab-pedidos" class="tab-panel hidden"></div>
    <div id="tab-fila" class="tab-panel hidden"></div>
    <div id="tab-filamentos" class="tab-panel hidden"></div>
    <div id="tab-impressoras" class="tab-panel hidden"></div>
    <div id="tab-produtos" class="tab-panel hidden"></div>
    <div id="tab-clientes" class="tab-panel hidden"></div>
    <div id="tab-financeiro" class="tab-panel hidden"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   RAFA 3D — SISTEMA DE GESTÃO
   Rascunho da Fase 1: login + navegação + esqueleto das seções.
   Sem build, sem framework — mesmo padrão do jjsolene-sistema-gestao.
   ============================================================ */

/* ============================================================
   CONEXÃO E LOGIN
   ============================================================ */
// TODO: preencher com o Project URL e a anon key do projeto Supabase
// (Project Settings → API) assim que ele existir. A anon key é segura
// de expor — a proteção real é a Row Level Security do banco.
const DEFAULT_SB_URL = 'https://zaoyqjzvwuhsqcgigppu.supabase.co';
const DEFAULT_SB_ANON = 'sb_publishable_UPFqlHbmOH84eYiF6ZRfsw_L_31GOqy';

let SUPA = null;
let currentUser = null;
let currentProfile = null;

function initClient(url, key) {
  try {
    SUPA = window.supabase.createClient(url, key);
  } catch (e) {
    renderLoginScreen('Não foi possível conectar: ' + e.message);
    return;
  }
  SUPA.auth.onAuthStateChange((event) => {
    if (event === 'SIGNED_OUT') {
      currentUser = null;
      currentProfile = null;
      renderLoginScreen();
    }
  });
  checkSession();
}

async function checkSession() {
  const { data } = await SUPA.auth.getSession();
  if (data && data.session) {
    currentUser = data.session.user;
    enterApp();
  } else {
    renderLoginScreen();
  }
}

function renderLoginScreen(errorMsg) {
  document.getElementById('appRoot').classList.add('hidden');
  const el = document.getElementById('authScreen');
  el.classList.remove('hidden');
  el.innerHTML =
    '<div class="auth-card">' +
      '<img class="auth-logo" src="catalogo/assets/logo_clean.png" alt="Rafa 3D">' +
      '<h1>Sistema de Gestão</h1>' +
      '<p class="tagline">Camada por camada!</p>' +
      '<p class="sub">Entre com seu e-mail e senha.</p>' +
      '<label>E-mail</label>' +
      '<input id="loginEmail" type="email" autocomplete="username">' +
      '<label>Senha</label>' +
      '<input id="loginPassword" type="password" autocomplete="current-password">' +
      (errorMsg ? '<div class="error">' + escapeHtml(errorMsg) + '</div>' : '') +
      '<button class="btn full" onclick="submitLogin()">Entrar</button>' +
    '</div>';
}

async function submitLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const { data, error } = await SUPA.auth.signInWithPassword({ email, password });
  if (error) { renderLoginScreen(error.message); return; }
  currentUser = data.user;
  enterApp();
}

async function doLogout() {
  await SUPA.auth.signOut();
}

async function enterApp() {
  const profileR = await SUPA.from('profiles').select('*').eq('id', currentUser.id).maybeSingle();
  if (profileR.error || !profileR.data) {
    console.log('[debug] currentUser.id =', currentUser.id);
    console.log('[debug] profileR =', profileR);
    document.getElementById('authScreen').innerHTML =
      '<div class="auth-card"><img class="auth-logo" src="catalogo/assets/logo_clean.png" alt="Rafa 3D"><h1>Acesso não liberado</h1>' +
      '<p class="sub">Seu login existe, mas ainda não tem perfil cadastrado no sistema. Peça pro Rafael liberar seu acesso.</p>' +
      (profileR.error ? '<p class="error">Detalhe técnico: ' + escapeHtml(profileR.error.message) + ' (código ' + escapeHtml(profileR.error.code || '') + ')</p>' : '<p class="error">Detalhe técnico: consulta não retornou erro, mas também nenhuma linha (data = null). Provável bloqueio de RLS.</p>') +
      '<button class="btn full secondary" onclick="doLogout()">Sair</button></div>';
    return;
  }
  currentProfile = profileR.data;
  const authEl = document.getElementById('authScreen');
  authEl.classList.add('hidden');
  authEl.innerHTML = '';
  document.getElementById('appRoot').classList.remove('hidden');
  const roleLabel = currentProfile.role === 'owner' ? 'dono(a)' : 'ajudante';
  document.getElementById('whoLabel').innerHTML =
    '<div class="who-name">Olá, ' + escapeHtml(currentProfile.full_name || currentUser.email) + '! 👋</div>' + roleLabel;
  applyRolePermissions();
  showTab('dashboard');
}

/* ============================================================
   NAVEGAÇÃO
   ============================================================ */
// Ajudante não vê custo/margem — essas telas (Filamentos, Impressoras com
// custo, relatório de margem) ficam reservadas ao owner. As demais abas
// operacionais (pedidos, fila, clientes) são liberadas pros dois.
const HELPER_ALLOWED_TABS = ['dashboard', 'projetos', 'pedidos', 'fila', 'clientes'];

const TAB_TITLES = {
  dashboard: '📊 Dashboard',
  projetos: '🪄 Projetos',
  pedidos: '🧾 Pedidos',
  fila: '🖨️ Fila de Impressão',
  filamentos: '🧵 Filamentos',
  impressoras: '⚙️ Impressoras',
  produtos: '🎁 Produtos',
  clientes: '👥 Clientes',
  financeiro: '💰 Financeiro',
};

function applyRolePermissions() {
  const isHelper = currentProfile && currentProfile.role === 'helper';
  document.querySelectorAll('.nav-item').forEach((item) => {
    if (HELPER_ALLOWED_TABS.indexOf(item.dataset.tab) === -1) {
      item.classList.toggle('hidden', isHelper);
    }
  });
}

async function showTab(name) {
  if (currentProfile && currentProfile.role === 'helper' && HELPER_ALLOWED_TABS.indexOf(name) === -1) {
    name = 'dashboard';
  }
  document.querySelectorAll('.tab-panel').forEach((p) => p.classList.add('hidden'));
  document.getElementById('tab-' + name).classList.remove('hidden');
  document.querySelectorAll('.nav-item').forEach((n) => n.classList.toggle('active', n.dataset.tab === name));
  document.getElementById('pageTitle').textContent = TAB_TITLES[name];
  await renderTab(name);
}

async function renderTab(name) {
  if (name === 'dashboard') await renderDashboard();
  if (name === 'projetos') await renderProjetos();
  if (name === 'pedidos') await renderPedidos();
  if (name === 'fila') await renderFila();
  if (name === 'filamentos') await renderFilamentos();
  if (name === 'impressoras') await renderImpressoras();
  if (name === 'produtos') await renderProdutos();
  if (name === 'clientes') await renderClientes();
  if (name === 'financeiro') await renderFinanceiro();
}

document.querySelectorAll('.nav-item').forEach((item) => {
  item.addEventListener('click', () => showTab(item.dataset.tab));
});

/* ============================================================
   DADOS COMPARTILHADOS (helpers)
   ============================================================ */
async function q(promise) {
  const { data, error } = await promise;
  if (error) { console.error(error); toast('Erro: ' + error.message); throw error; }
  return data;
}

function fmtMoney(n) {
  n = Number(n) || 0;
  return 'R$ ' + n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function todayISO() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function fmtDate(iso) {
  if (!iso) return '—';
  if (/^\d{4}-\d{2}-\d{2}$/.test(iso)) {
    const p = iso.split('-');
    return p[2] + '/' + p[1] + '/' + p[0];
  }
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('pt-BR');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3200);
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function emptyState(el, msg) {
  el.innerHTML = '<div class="card"><div class="empty">' + escapeHtml(msg) + '</div></div>';
}

function openModal(html, opts) {
  const root = document.getElementById('modalRoot');
  const wide = opts && opts.wide ? ' wide' : '';
  root.innerHTML = '<div class="modal-box' + wide + '">' + html + '</div>';
  root.classList.add('show');
  root.onclick = (e) => { if (e.target === root) closeModal(); };
}
function closeModal() {
  const root = document.getElementById('modalRoot');
  root.classList.remove('show');
  root.innerHTML = '';
  _produtoGerenciarAberto = null;
  _projetoGerenciarAberto = null;
}

/* ============================================================
   DASHBOARD
   ============================================================ */
async function renderDashboard() {
  const el = document.getElementById('tab-dashboard');
  el.innerHTML = '<div class="empty">Carregando...</div>';
  const isOwner = currentProfile && currentProfile.role === 'owner';

  const orcamentosPendentes = await q(SUPA.from('order_line_items')
    .select('*, orders(order_number, customers(name))')
    .eq('line_status', 'orcamento_pendente')
    .order('created_at'));
  const filaCounts = await q(SUPA.from('order_line_items').select('line_status').in('line_status', ['fila_impressao', 'imprimindo', 'pos_processamento']));
  const orders = await q(SUPA.from('orders').select('id, order_number, total_amount, customers(name)').neq('status', 'cancelado'));
  const statuses = await q(SUPA.from('orders_payment_status').select('*'));
  const statusById = {};
  statuses.forEach((s) => { statusById[s.order_id] = s; });
  const pendentesPagamento = orders.filter((o) => statusById[o.id] && statusById[o.id].payment_status !== 'quitado');
  const aReceber = pendentesPagamento.reduce((sum, o) => sum + (o.total_amount - statusById[o.id].total_paid), 0);

  const countFila = filaCounts.filter((i) => i.line_status === 'fila_impressao').length;
  const countImprimindo = filaCounts.filter((i) => i.line_status === 'imprimindo').length;
  const countPos = filaCounts.filter((i) => i.line_status === 'pos_processamento').length;

  let html = '<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:14px; margin-bottom:4px;">';
  html += statCard('🧾', orcamentosPendentes.length, 'Orçamentos pendentes');
  html += statCard('🖨️', countFila + countImprimindo, 'Na fila / imprimindo');
  html += statCard('🎨', countPos, 'Em pós-processamento');
  html += statCard('💰', fmtMoney(aReceber), 'A receber');
  html += '</div>';

  if (orcamentosPendentes.length > 0) {
    html += '<div class="card">';
    html += '<strong>🧾 Orçamentos aguardando aprovação</strong>';
    html += '<table style="margin-top:8px;"><tr><th>Pedido</th><th>Cliente</th><th>Item</th><th></th></tr>';
    orcamentosPendentes.forEach((it) => {
      html += '<tr>';
      html += '<td>' + escapeHtml(it.orders ? it.orders.order_number || '' : '') + '</td>';
      html += '<td>' + escapeHtml(it.orders && it.orders.customers ? it.orders.customers.name : '—') + '</td>';
      html += '<td>' + escapeHtml(it.custom_description || '') + (it.custom_reference_link ? ' <a href="' + escapeHtml(it.custom_reference_link) + '" target="_blank" rel="noopener">🔗</a>' : '') + '</td>';
      html += '<td class="row-actions">';
      if (isOwner) html += '<button class="btn ghost" onclick="abrirPedido(\'' + it.order_id + '\'); showTab(\'pedidos\');">Abrir pedido</button>';
      html += '</td></tr>';
    });
    html += '</table></div>';
  }

  if (isOwner) {
    const cores = await getFilamentos();
    await getSpools();
    const baixos = cores.filter((c) => estoquePorCor(c.id) <= c.low_stock_threshold_g && c.active);
    if (baixos.length > 0) {
      html += '<div class="card">';
      html += '<strong>🧵 Estoque de filamento baixo</strong>';
      html += '<table style="margin-top:8px;"><tr><th>Cor</th><th>Estoque</th><th></th></tr>';
      baixos.forEach((c) => {
        html += '<tr><td>' + escapeHtml(c.name) + '</td><td>' + estoquePorCor(c.id).toFixed(0) + ' g</td>';
        html += '<td class="row-actions"><button class="btn ghost" onclick="showTab(\'filamentos\')">Ver</button></td></tr>';
      });
      html += '</table></div>';
    }
  }

  if (orcamentosPendentes.length === 0 && countFila + countImprimindo + countPos === 0 && pendentesPagamento.length === 0) {
    html += '<div class="card"><div class="empty">Tudo em dia por aqui! 🎉</div></div>';
  }

  el.innerHTML = html;
}

const LINE_STATUS_LABELS = {
  recebido: 'Recebido',
  orcamento_pendente: 'Orçamento pendente',
  orcamento_aprovado: 'Orçamento aprovado',
  fila_impressao: 'Fila de impressão',
  imprimindo: 'Imprimindo',
  pos_processamento: 'Pós-processamento',
  embalado: 'Embalado',
  enviado: 'Enviado',
  entregue: 'Entregue',
  falhou_reimprimir: 'Falhou (reimprimir)',
  cancelado: 'Cancelado',
};
const PAYMENT_STATUS_LABELS = {
  aguardando_sinal: 'Aguardando sinal',
  sinal_pago: 'Sinal pago',
  quitado: 'Quitado',
};

/* ============================================================
   PROJETOS — pedido personalizado com foto do cliente + IA
   (reaproveita order_line_items com line_type='custom'; não é
   tabela separada, é uma tela dedicada pra esse fluxo específico)
   ============================================================ */
let _projetosPollTimer = null;
let _projetoGerenciarAberto = null;

function projetoStatusBadge(li) {
  if (li.line_status === 'orcamento_aprovado' || li.line_status === 'fila_impressao' || li.line_status === 'imprimindo' || li.line_status === 'pos_processamento') {
    return '<span class="badge on">Aprovado — virou pedido</span>';
  }
  if (li.line_status === 'cancelado') return '<span class="badge off">Cancelado</span>';
  if (li.meshy_status === 'queued' || li.meshy_status === 'processing') return '<span class="badge off">Gerando modelo 3D…</span>';
  if (li.model_file_path) return '<span class="badge on">Modelo pronto — falta aprovar preço</span>';
  return '<span style="color:var(--muted); font-size:11px;">Recebido — aguardando modelo 3D</span>';
}

async function renderProjetos() {
  const el = document.getElementById('tab-projetos');
  const scrollY = window.scrollY;
  const projetos = await q(SUPA.from('order_line_items').select('*, orders(order_number)').eq('line_type', 'custom').order('created_at', { ascending: false }));

  let html = '<div class="card">';
  html += '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">';
  html += '<strong>' + projetos.length + ' projetos</strong>';
  html += '<button class="btn" onclick="abrirNovoProjeto()">+ Novo Projeto</button>';
  html += '</div>';
  if (projetos.length === 0) {
    html += '<div class="empty">Nenhum projeto ainda. Cliente mandou foto pedindo uma peça? Clica em "+ Novo Projeto".</div>';
  } else {
    html += '<div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:14px;">';
    projetos.forEach((li) => {
      html += '<div style="border:1px solid var(--border); border-radius:12px; overflow:hidden; cursor:pointer;" onclick="abrirGerenciarProjeto(\'' + li.id + '\')">';
      if (li.custom_reference_image_path) {
        html += '<div id="projfoto-' + li.id + '" style="width:100%; aspect-ratio:1; background:#f3f4f7; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:12px;">carregando foto…</div>';
      } else {
        html += '<div style="width:100%; aspect-ratio:1; background:#f3f4f7; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:12px;">sem foto</div>';
      }
      html += '<div style="padding:10px 12px;">';
      html += '<div style="font-weight:700; font-size:13.5px; margin-bottom:2px;">' + escapeHtml(li.requester_name || 'Sem nome') + '</div>';
      html += '<div style="font-size:12px; color:var(--muted); margin-bottom:8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">' + escapeHtml(li.custom_description || '') + '</div>';
      html += projetoStatusBadge(li);
      html += '</div></div>';
    });
    html += '</div>';
  }
  html += '</div>';
  el.innerHTML = html;
  window.scrollTo(0, scrollY);
  requestAnimationFrame(() => window.scrollTo(0, scrollY));

  projetos.forEach((li) => {
    if (!li.custom_reference_image_path) return;
    SUPA.storage.from('projetos-fotos').createSignedUrl(li.custom_reference_image_path, 300).then(({ data }) => {
      const div = document.getElementById('projfoto-' + li.id);
      if (div && data) div.outerHTML = '<img src="' + data.signedUrl + '" style="width:100%; aspect-ratio:1; object-fit:cover; display:block;">';
    });
  });

  if (_projetoGerenciarAberto && document.getElementById('modalRoot').classList.contains('show')) {
    abrirGerenciarProjeto(_projetoGerenciarAberto);
  }

  clearTimeout(_projetosPollTimer);
  const emAndamento = projetos.some((li) =>
    li.meshy_status === 'queued' || li.meshy_status === 'processing' ||
    li.open_slicer_status === 'queued');
  if (emAndamento && !el.classList.contains('hidden')) {
    _projetosPollTimer = setTimeout(() => { renderProjetos(); }, 4000);
  }
}

function abrirNovoProjeto() {
  openModal(
    '<h3>Novo Projeto</h3>' +
    '<label>Nome de quem pediu</label><input id="projNome" type="text" placeholder="Nome do cliente">' +
    '<label>Contato (WhatsApp)</label><input id="projContato" type="text" placeholder="(11) 90000-0000">' +
    '<label>O que o cliente quer</label>' +
    '<textarea id="projDescricao" rows="3" placeholder="Descreva o que o cliente pediu..." style="width:100%; padding:11px 13px; border:1.5px solid var(--border); border-radius:10px; font-size:14px; font-family:inherit;"></textarea>' +
    '<label>Foto de referência (opcional)</label><input id="projFoto" type="file" accept="image/*">' +
    '<div class="modal-actions">' +
      '<button class="btn ghost" onclick="closeModal()">Cancelar</button>' +
      '<button class="btn" onclick="criarProjeto()">Criar Projeto</button>' +
    '</div>'
  );
}

async function criarProjeto() {
  const requester_name = document.getElementById('projNome').value.trim();
  const requester_contact = document.getElementById('projContato').value.trim();
  const custom_description = document.getElementById('projDescricao').value.trim();
  const fileInput = document.getElementById('projFoto');
  const file = fileInput.files[0];
  if (!requester_name || !custom_description) { toast('Preenche pelo menos o nome e a descrição.'); return; }

  const order_number = 'PRJ-' + Date.now().toString(36).toUpperCase();
  const { data: order, error: orderErr } = await SUPA.from('orders').insert([{
    order_number, order_type: 'sob_encomenda', status: 'orcamento', channel: 'whatsapp', created_by: currentUser.id,
  }]).select().maybeSingle();
  if (orderErr) { toast('Erro: ' + orderErr.message); return; }

  const { data: li, error: liErr } = await SUPA.from('order_line_items').insert([{
    order_id: order.id, line_type: 'custom', custom_description, requester_name, requester_contact,
    quantity: 1, line_status: 'recebido',
  }]).select().maybeSingle();
  if (liErr) { toast('Erro: ' + liErr.message); return; }

  if (file) {
    const ext = file.name.split('.').pop();
    const path = li.id + '/foto.' + ext;
    const { error: upErr } = await SUPA.storage.from('projetos-fotos').upload(path, file, { upsert: true });
    if (upErr) { toast('Projeto criado, mas a foto falhou: ' + upErr.message); }
    else await SUPA.from('order_line_items').update({ custom_reference_image_path: path }).eq('id', li.id);
  }

  closeModal();
  toast('Projeto criado!');
  await renderProjetos();
}

  let html = '<div style="display:flex; gap:14px; margin-bottom:16px;">';
  html += '<div style="flex:none;">';
  html += fotoUrl
    ? '<img src="' + fotoUrl + '" style="width:110px; height:110px; object-fit:cover; border-radius:12px; border:1px solid var(--border);">'
    : '<div style="width:110px; height:110px; border-radius:12px; background:#f3f4f7;"></div>';

  html += '</div>';

    '<div style="font-size:12px; color:var(--muted); margin-bottom:6px;">' + escapeHtml(li.requester_contact || '') + ' · ' + escapeHtml(li.orders ? li.orders.order_number : '') + '</div>' +
    '<div style="font-size:13px;">' + escapeHtml(li.custom_description || '') + '</div></div>';
  html += '</div>';

  html += '<div style="display:flex; flex-direction:column; gap:10px;">';

  html += '<div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-top:1px solid var(--border);">';
  html += '<span>1. Modelo 3D — ' + (li.model_file_path ? '<span class="badge on">' + (li.model_source === 'meshy_generated' ? 'gerado por IA' : 'anexado') + '</span>' : (li.meshy_status === 'queued' || li.meshy_status === 'processing') ? '<span class="badge off">gerando…</span>' : (li.meshy_status === 'error' && li.custom_reference_image_path) ? '<span class="badge off" title="' + escapeHtml(li.meshy_error || '') + '">erro</span>' : !li.custom_reference_image_path ? '<span style="color:var(--muted); font-size:11px;">sem foto — anexe uma foto ou o modelo manualmente</span>' : '<span style="color:var(--muted); font-size:11px;">nenhum</span>') + '</span>';
  html += '<span class="row-actions">';

    html += '<button class="btn ghost" onclick="solicitarGerarModelo3D(\'' + li.id + '\')">🧬 Gerar por IA</button>';
  }
  html += '<button class="btn ghost" onclick="abrirAnexarModeloProjeto(\'' + li.id + '\')">+ Anexar</button>';
  html += '</span></div>';

  if (li.model_file_path) {
    html += '<div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-top:1px solid var(--border);">';
    html += '<span>2. Fatiador — ' + (li.open_slicer_status === 'queued' ? '<span class="badge off">abrindo…</span>' : li.open_slicer_status === 'error' ? '<span class="badge off" title="' + escapeHtml(li.open_slicer_error || '') + '">erro</span>' : '<span style="color:var(--muted); font-size:11px;">pronto pra abrir</span>') + '</span>';
    html += '<button class="btn ghost" onclick="solicitarAbrirFatiadorProjeto(\'' + li.id + '\')" ' + (li.open_slicer_status === 'queued' ? 'disabled' : '') + '>🖥️ Abrir no Fatiador</button>';
    html += '</div>';
  }

  html += '<div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-top:1px solid var(--border);">';
  html += '<span>3. Aprovação — ' + (li.line_status === 'orcamento_aprovado' ? '<span class="badge on">aprovado, ' + fmtMoney(li.unit_price) + '</span>' : '<span style="color:var(--muted); font-size:11px;">aguardando preço</span>') + '</span>';
  if (li.line_status !== 'orcamento_aprovado' && li.line_status !== 'cancelado') {
    html += '<button class="btn" onclick="abrirAprovarProjeto(\'' + li.id + '\')">💰 Aprovar e Definir Preço</button>';
  }
  html += '</div>';

  html += '</div><div class="modal-actions">' +
    '<button class="btn ghost" style="color:var(--text-danger, #c0392b); border-color:#f0c9c9;" onclick="excluirProjeto(\'' + li.id + '\', \'' + (li.order_id || '') + '\')">🗑️ Excluir Projeto</button>' +
    '<button class="btn ghost" onclick="closeModal()">Fechar</button></div>';

  openModal(html, { wide: true });
}

async function solicitarGerarModelo3D(lineItemId) {
  const { error } = await SUPA.from('order_line_items').update({
    meshy_status: 'queued', meshy_requested_at: new Date().toISOString(), meshy_error: null,
  }).eq('id', lineItemId);

  toast('Geração de modelo 3D pedida — pode levar alguns minutos.');
  await renderProjetos();
  if (_projetoGerenciarAberto === lineItemId) abrirGerenciarProjeto(lineItemId);

async function solicitarAbrirFatiadorProjeto(lineItemId) {
  const { error } = await SUPA.from('order_line_items').update({
    open_slicer_status: 'queued', open_slicer_requested_at: new Date().toISOString(), open_slicer_error: null,
  }).eq('id', lineItemId);
  if (error) { toast('Erro: ' + error.message); return; }
  toast('Abrindo no fatiador — o agente local faz isso em instantes.');
  await renderProjetos();
  if (_projetoGerenciarAberto === lineItemId) abrirGerenciarProjeto(lineItemId);
}

function abrirAprovarProjeto(lineItemId) {
  openModal(
    '<h3>Aprovar e definir preço</h3>' +
    '<label>Preço (R$)</label><input id="projPreco" type="number" step="0.01" placeholder="0,00">' +
    '<div class="modal-actions">' +
      '<button class="btn ghost" onclick="abrirGerenciarProjeto(\'' + lineItemId + '\')">Cancelar</button>' +
      '<button class="btn" onclick="aprovarProjeto(\'' + lineItemId + '\')">Aprovar</button>' +
    '</div>'
  );
}

async function aprovarProjeto(lineItemId) {
  const preco = parseFloat(document.getElementById('projPreco').value);
  if (!preco || preco <= 0) { toast('Informa um preço válido.'); return; }
  const { error } = await SUPA.from('order_line_items').update({
    unit_price: preco, line_status: 'orcamento_aprovado', updated_at: new Date().toISOString(),
  }).eq('id', lineItemId);
  if (error) { toast('Erro: ' + error.message); return; }
  closeModal();
  toast('Projeto aprovado! Já entrou no fluxo de pedidos e fila de impressão.');
  await renderProjetos();
}

async function excluirProjeto(lineItemId, orderId) {
  if (!confirm('Excluir esse projeto de vez? Não tem como desfazer.')) return;
  const { data: liData } = await SUPA.from('order_line_items').select('custom_reference_image_path, model_file_path').eq('id', lineItemId).maybeSingle();
  if (liData) {
    if (liData.custom_reference_image_path) await SUPA.storage.from('projetos-fotos').remove([liData.custom_reference_image_path]);
    if (liData.model_file_path) await SUPA.storage.from('modelos-3d').remove([liData.model_file_path]);
  }
  const { error } = orderId
    ? await SUPA.from('orders').delete().eq('id', orderId)
    : await SUPA.from('order_line_items').delete().eq('id', lineItemId);
  if (error) { toast('Erro: ' + error.message); return; }
  closeModal();
  toast('Projeto excluído.');
  await renderProjetos();
}

async function criarPedido() {
  const customer_id = document.getElementById('pdCliente').value || null;
  const channel = document.getElementById('pdCanal').value;
  if (!customer_id) { toast('Seleciona um cliente (ou cadastra um novo primeiro).'); return; }
  const order_number = 'PED-' + Date.now().toString(36).toUpperCase();
  const { data, error } = await SUPA.from('orders').insert([{
    order_number, customer_id, channel, order_type: 'catalogo', status: 'orcamento', created_by: currentUser.id,
  }]).select().maybeSingle();
  if (error) { toast('Erro: ' + error.message); return; }
  closeModal();
  toast('Pedido criado. Agora adiciona os itens.');
  pedidoDetalheId = data.id;
  await renderPedidos();
}

  pedidoDetalheId = id;
  renderPedidos();
}
function voltarPedidos() {
  pedidoDetalheId = null;
  renderPedidos();
}

async function renderPedidoDetalhe(id) {
  const el = document.getElementById('tab-pedidos');
  el.innerHTML = '<div class="empty">Carregando...</div>';
  const order = await q(SUPA.from('orders').select('*, customers(name, phone)').eq('id', id).maybeSingle());
  const items = await q(SUPA.from('order_line_items').select('*, products(name)').eq('order_id', id).order('created_at'));
  const payments = await q(SUPA.from('payments').select('*').eq('order_id', id).order('created_at'));
  const ps = await q(SUPA.from('orders_payment_status').select('*').eq('order_id', id).maybeSingle());

  let html = '<button class="btn ghost" onclick="voltarPedidos()">&larr; Voltar</button>';
  html += '<div class="card" style="margin-top:12px;">';
  html += '<div style="display:flex; justify-content:space-between;">';
  html += '<div><strong>' + escapeHtml(order.order_number || order.id.slice(0, 8)) + '</strong><br>';
  html += '<span style="color:var(--muted);">' + escapeHtml(order.customers ? order.customers.name : '—') + (order.customers && order.customers.phone ? ' · ' + escapeHtml(order.customers.phone) : '') + '</span></div>';
  html += '<div style="text-align:right;"><div>' + fmtMoney(order.total_amount) + '</div>';
  html += '<span class="badge ' + (ps && ps.payment_status === 'quitado' ? 'on' : 'off') + '">' + (ps ? PAYMENT_STATUS_LABELS[ps.payment_status] : '—') + '</span></div>';
  html += '</div></div>';

  html += '<div class="card">';
  html += '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">';
  html += '<strong>Itens</strong><button class="btn" onclick="openItemForm(\'' + id + '\')">+ Adicionar item</button>';
  html += '</div>';
  if (items.length === 0) {
    html += '<div class="empty">Nenhum item ainda.</div>';
  } else {
    const isOwner = currentProfile && currentProfile.role === 'owner';
    html += '<table><tr><th>Item</th><th>Qtd</th><th>Preço</th><th>Status</th><th></th></tr>';
    items.forEach((it) => {
      const nome = it.line_type === 'catalog' ? (it.products ? it.products.name : '—') : it.custom_description;
      html += '<tr>';
      html += '<td>' + escapeHtml(nome) + (it.line_type === 'custom' ? ' <span style="color:var(--muted);font-size:11px;">(personalizado)</span>' : '');
      if (it.custom_reference_link) html += '<br><a href="' + escapeHtml(it.custom_reference_link) + '" target="_blank" rel="noopener" style="font-size:11px;">🔗 referência do cliente</a>';
      html += '</td>';
      html += '<td>' + it.quantity + '</td>';
      html += '<td>' + fmtMoney(it.unit_price * it.quantity) + '</td>';
      html += '<td><select onchange="mudarStatusItem(\'' + it.id + '\', this.value, \'' + id + '\')">';
      Object.keys(LINE_STATUS_LABELS).forEach((k) => {
        html += '<option value="' + k + '"' + (k === it.line_status ? ' selected' : '') + '>' + LINE_STATUS_LABELS[k] + '</option>';
      });
      html += '</select></td>';
      html += '<td class="row-actions">';
      if (isOwner && it.line_status === 'orcamento_pendente') {
        html += '<button class="btn" onclick="openAprovarOrcamento(\'' + it.id + '\', \'' + id + '\')">Definir preço e aprovar</button>';
      }
      html += '<button class="btn ghost" onclick="removerItem(\'' + it.id + '\', \'' + id + '\')">Remover</button>';
      html += '</td>';
      html += '</tr>';
    });
    html += '</table>';
  }
  html += '</div>';

  html += '<div class="card">';
  html += '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">';
  html += '<strong>Pagamentos</strong><button class="btn" onclick="openPagamentoForm(\'' + id + '\')">+ Registrar pagamento</button>';
  html += '</div>';
  if (payments.length === 0) {
    html += '<div class="empty">Nenhum pagamento registrado.</div>';
  } else {
    html += '<table><tr><th>Tipo</th><th>Valor</th><th>Método</th><th>Status</th><th>Data</th></tr>';
    payments.forEach((p) => {
      html += '<tr><td>' + escapeHtml(p.payment_type) + '</td><td>' + fmtMoney(p.amount) + '</td><td>' + escapeHtml(p.method || '—') + '</td>';
      html += '<td>' + escapeHtml(p.status) + '</td><td>' + fmtDate(p.created_at) + '</td></tr>';
    });
    html += '</table>';
  }
  html += '<div style="margin-top:8px; color:var(--muted); font-size:12px;">Sinal esperado (' + order.expected_deposit_pct + '%): ' + fmtMoney(order.total_amount * order.expected_deposit_pct / 100) + '</div>';
  html += '</div>';

  el.innerHTML = html;
}

async function recalcularTotalPedido(orderId) {
  const items = await q(SUPA.from('order_line_items').select('unit_price, quantity, line_type').eq('order_id', orderId));
  const total = items.reduce((s, it) => s + it.unit_price * it.quantity, 0);
  const types = new Set(items.map((it) => it.line_type));
  const order_type = types.size > 1 ? 'misto' : (types.has('custom') ? 'sob_encomenda' : 'catalogo');
  await SUPA.from('orders').update({ total_amount: total, order_type, updated_at: new Date().toISOString() }).eq('id', orderId);
}

async function openItemForm(orderId) {
  const produtos = await getProdutos();
  let options = '<option value="">— selecione —</option>';
  produtos.forEach((p) => { options += '<option value="' + p.id + '" data-price="' + p.sale_price + '">' + escapeHtml(p.catalog_code) + ' — ' + escapeHtml(p.name) + '</option>'; });
  openModal(
    '<h3>Adicionar item</h3>' +
    '<label><input type="radio" name="itTipo" value="catalog" checked onchange="toggleItemTipo()"> Do catálogo</label> ' +
    '<label><input type="radio" name="itTipo" value="custom" onchange="toggleItemTipo()"> Personalizado</label>' +
    '<div id="itCatalogFields">' +
      '<label>Produto</label>' +
      '<select id="itProduto" onchange="preencherPrecoItem()">' + options + '</select>' +
    '</div>' +
    '<div id="itCustomFields" class="hidden">' +
      '<label>Descrição</label><input id="itDescricao" placeholder="Ex: Suporte personalizado com logo">' +
      '<label>Referência (link, se houver)</label><input id="itLink" placeholder="Link do Pinterest, foto etc.">' +
    '</div>' +
    '<label>Quantidade</label><input id="itQtd" type="number" value="1" min="1">' +
    '<label>Preço unitário (R$)</label><input id="itPreco" type="number" step="0.01" value="0">' +
    '<div class="modal-actions">' +
      '<button class="btn ghost" onclick="closeModal()">Cancelar</button>' +
      '<button class="btn" onclick="salvarItem(\'' + orderId + '\')">Adicionar</button>' +
    '</div>'
  );
}

function toggleItemTipo() {
  const tipo = document.querySelector('input[name="itTipo"]:checked').value;
  document.getElementById('itCatalogFields').classList.toggle('hidden', tipo !== 'catalog');
  document.getElementById('itCustomFields').classList.toggle('hidden', tipo !== 'custom');
}

function preencherPrecoItem() {
  const sel = document.getElementById('itProduto');
  const opt = sel.options[sel.selectedIndex];
  document.getElementById('itPreco').value = opt.dataset.price || 0;
}

async function salvarItem(orderId) {
  const tipo = document.querySelector('input[name="itTipo"]:checked').value;
  const quantity = parseInt(document.getElementById('itQtd').value, 10) || 1;
  const unit_price = parseFloat(document.getElementById('itPreco').value);
  if (isNaN(unit_price)) { toast('Preenche o preço.'); return; }

  const payload = {
    order_id: orderId, line_type: tipo, quantity, unit_price,
  };
  if (tipo === 'catalog') {
    const productId = document.getElementById('itProduto').value;
    if (!productId) { toast('Seleciona um produto.'); return; }
    payload.product_id = productId;
    payload.line_status = 'recebido';
  } else {
    const desc = document.getElementById('itDescricao').value.trim();
    if (!desc) { toast('Descreve o item personalizado.'); return; }
    payload.custom_description = desc;
    payload.custom_reference_link = document.getElementById('itLink').value.trim() || null;
    payload.line_status = 'orcamento_pendente';
  }
  const { error } = await SUPA.from('order_line_items').insert([payload]);
  if (error) { toast('Erro: ' + error.message); return; }
  closeModal();
  await recalcularTotalPedido(orderId);
  toast('Item adicionado.');
  await renderPedidoDetalhe(orderId);
}

async function mudarStatusItem(itemId, novoStatus, orderId) {
  const { error } = await SUPA.from('order_line_items').update({ line_status: novoStatus, updated_at: new Date().toISOString() }).eq('id', itemId);
  if (error) { toast('Erro: ' + error.message); return; }
  toast('Status atualizado.');
}

async function removerItem(itemId, orderId) {
  if (!confirm('Remover este item do pedido?')) return;
  const { error } = await SUPA.from('order_line_items').delete().eq('id', itemId);
  if (error) { toast('Erro: ' + error.message); return; }
  await recalcularTotalPedido(orderId);
  await renderPedidoDetalhe(orderId);
}

async function openAprovarOrcamento(itemId, orderId) {
  const item = await q(SUPA.from('order_line_items').select('*').eq('id', itemId).maybeSingle());
  openModal(
    '<h3>Definir preço e aprovar orçamento</h3>' +
    '<p style="color:var(--muted); font-size:13px;">' + escapeHtml(item.custom_description || '') + '</p>' +
    (item.custom_reference_link ? '<p><a href="' + escapeHtml(item.custom_reference_link) + '" target="_blank" rel="noopener">🔗 ver referência do cliente</a></p>' : '') +
    '<label>Preço a cobrar (R$)</label><input id="apPreco" type="number" step="0.01" value="' + (item.unit_price || 0) + '">' +
    '<label>Custo estimado (R$, opcional)</label><input id="apCusto" type="number" step="0.01" value="' + (item.unit_cost_estimate || '') + '">' +
    '<div class="modal-actions">' +
      '<button class="btn ghost" onclick="closeModal()">Cancelar</button>' +
      '<button class="btn" onclick="salvarAprovacaoOrcamento(\'' + itemId + '\', \'' + orderId + '\')">Aprovar e liberar pra fila</button>' +
    '</div>'
  );
}

async function salvarAprovacaoOrcamento(itemId, orderId) {
  const unit_price = parseFloat(document.getElementById('apPreco').value);
  const unit_cost_estimate = parseFloat(document.getElementById('apCusto').value) || null;
  if (isNaN(unit_price) || unit_price <= 0) { toast('Preenche o preço.'); return; }
  const { error } = await SUPA.from('order_line_items').update({
    unit_price, unit_cost_estimate, line_status: 'orcamento_aprovado', updated_at: new Date().toISOString(),
  }).eq('id', itemId);
  if (error) { toast('Erro: ' + error.message); return; }
  await recalcularTotalPedido(orderId);
  closeModal();
  toast('Orçamento aprovado — já pode entrar na fila de impressão.');
  await renderPedidoDetalhe(orderId);
}

function openPagamentoForm(orderId) {
  openModal(
    '<h3>Registrar pagamento</h3>' +
    '<label>Tipo</label>' +
    '<select id="pgTipo"><option value="sinal">Sinal</option><option value="saldo">Saldo</option><option value="pagamento_integral">Pagamento integral</option><option value="reembolso">Reembolso</option></select>' +
    '<label>Valor (R$)</label><input id="pgValor" type="number" step="0.01">' +
    '<label>Método</label>' +
    '<select id="pgMetodo"><option value="pix">PIX</option><option value="dinheiro">Dinheiro</option><option value="cartao">Cartão</option><option value="outro">Outro</option></select>' +
    '<div class="modal-actions">' +
      '<button class="btn ghost" onclick="closeModal()">Cancelar</button>' +
      '<button class="btn" onclick="salvarPagamento(\'' + orderId + '\')">Salvar</button>' +
    '</div>'
  );
}

async function salvarPagamento(orderId) {
  const payment_type = document.getElementById('pgTipo').value;
  const amount = parseFloat(document.getElementById('pgValor').value);
  const method = document.getElementById('pgMetodo').value;
  if (isNaN(amount) || amount <= 0) { toast('Preenche o valor do pagamento.'); return; }
  const { error } = await SUPA.from('payments').insert([{
    order_id: orderId, payment_type, amount, method, status: 'confirmado', paid_at: new Date().toISOString(), recorded_by: currentUser.id,
  }]);
  if (error) { toast('Erro: ' + error.message); return; }
  closeModal();
  toast('Pagamento registrado.');
  await renderPedidoDetalhe(orderId);
}

/* ============================================================
   FILA DE IMPRESSÃO
   ============================================================ */
const FILA_STATUSES = ['recebido', 'orcamento_aprovado', 'fila_impressao', 'imprimindo', 'pos_processamento', 'falhou_reimprimir'];

async function renderFila() {
  const el = document.getElementById('tab-fila');
  el.innerHTML = '<div class="empty">Carregando...</div>';

  const items = await q(SUPA.from('order_line_items')
    .select('*, orders(order_number, customers(name)), products(name)')
    .in('line_status', FILA_STATUSES)
    .order('created_at'));
  const impressoras = await getImpressorasSafe();

  const grupos = {};
  const semImpressora = [];
  impressoras.forEach((p) => { grupos[p.id] = { nome: p.name, itens: [] }; });
  items.forEach((it) => {
    if (it.printer_id && grupos[it.printer_id]) grupos[it.printer_id].itens.push(it);
    else semImpressora.push(it);
  });

  let html = '';
  html += renderGrupoFila('📥 Sem impressora atribuída', null, semImpressora, impressoras);
  impressoras.forEach((p) => {
    html += renderGrupoFila('🖨️ ' + p.name, p.id, grupos[p.id].itens, impressoras);
  });
  el.innerHTML = html || '<div class="card"><div class="empty">Fila vazia — nenhum item em produção agora.</div></div>';
}

function renderGrupoFila(titulo, printerId, itens, impressoras) {
  let html = '<div class="card">';
  html += '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">';
  html += '<strong>' + titulo + '</strong><span style="color:var(--muted); font-size:12px;">' + itens.length + ' item(ns)</span>';
  html += '</div>';
  if (itens.length === 0) {
    html += '<div class="empty">Nada por aqui.</div>';
  } else {
    html += '<table><tr><th>Pedido</th><th>Item</th><th>Qtd</th><th>Cor</th><th>Impressora</th><th>Status</th><th></th></tr>';
    itens.forEach((it) => {
      const nome = it.line_type === 'catalog' ? (it.products ? it.products.name : '—') : it.custom_description;
      html += '<tr>';
      html += '<td>' + escapeHtml(it.orders ? (it.orders.order_number || '') : '') + '<br><span style="color:var(--muted);font-size:11px;">' + escapeHtml(it.orders && it.orders.customers ? it.orders.customers.name : '') + '</span></td>';
      html += '<td>' + escapeHtml(nome) + '</td>';
      html += '<td>' + it.quantity + '</td>';
      html += '<td id="cor-' + it.id + '" style="color:var(--muted); font-size:12px;">carregando...</td>';
      html += '<td><select onchange="atribuirImpressora(\'' + it.id + '\', this.value)">';
      html += '<option value="">— nenhuma —</option>';
      impressoras.forEach((p) => { html += '<option value="' + p.id + '"' + (p.id === printerId ? ' selected' : '') + '>' + escapeHtml(p.name) + '</option>'; });
      html += '</select></td>';
      html += '<td><select onchange="mudarStatusFilaItem(\'' + it.id + '\', this.value)">';
      Object.keys(LINE_STATUS_LABELS).forEach((k) => {
        html += '<option value="' + k + '"' + (k === it.line_status ? ' selected' : '') + '>' + LINE_STATUS_LABELS[k] + '</option>';
      });
      html += '</select></td>';
      html += '<td class="row-actions">';
      html += '<button class="btn ghost" onclick="openConcluirImpressao(\'' + it.id + '\')">Concluir</button>';
      if (it.line_status === 'falhou_reimprimir') {
        html += '<button class="btn ghost" onclick="reimprimirItem(\'' + it.id + '\')">Reimprimir</button>';
      } else {
        html += '<button class="btn ghost" onclick="openMarcarFalha(\'' + it.id + '\')">Falhou</button>';
      }
      html += '</td>';
      html += '</tr>';
    });
    html += '</table>';
  }
  html += '</div>';
  // preenche a cor solicitada de forma assíncrona (usa a lista segura de cores)
  setTimeout(() => preencherCoresFila(itens), 0);
  return html;
}

async function preencherCoresFila(itens) {
  if (!itens.length) return;
  const cores = await getFilamentosSafe();
  itens.forEach((it) => {
    const el = document.getElementById('cor-' + it.id);
    if (!el) return;
    const cor = cores.find((c) => c.id === it.requested_filament_color_id);
    el.textContent = cor ? cor.name : '—';
  });
}

async function atribuirImpressora(itemId, printerId) {
  const { error } = await SUPA.from('order_line_items').update({ printer_id: printerId || null, updated_at: new Date().toISOString() }).eq('id', itemId);
  if (error) { toast('Erro: ' + error.message); return; }
  toast('Impressora atualizada.');
  await renderFila();
}

async function mudarStatusFilaItem(itemId, novoStatus) {
  const { error } = await SUPA.from('order_line_items').update({ line_status: novoStatus, updated_at: new Date().toISOString() }).eq('id', itemId);
  if (error) { toast('Erro: ' + error.message); return; }
  toast('Status atualizado.');
  await renderFila();
}

async function openConcluirImpressao(itemId) {
  const item = await q(SUPA.from('order_line_items').select('*').eq('id', itemId).maybeSingle());
  let gramasEstimado = '';
  if (item.product_id) {
    const receita = await q(SUPA.from('product_recipes').select('estimated_grams').eq('product_id', item.product_id).maybeSingle());
    if (receita) gramasEstimado = receita.estimated_grams;
  }
  const cores = await getFilamentosSafe();
  const spools = await getSpools(true);
  const corAlvo = item.requested_filament_color_id;
  const spoolsDaCor = spools.filter((s) => (!corAlvo || s.color_id === corAlvo) && s.status !== 'empty');
  let options = '<option value="">— selecione o rolo —</option>';
  spoolsDaCor.forEach((s) => {
    const cor = cores.find((c) => c.id === s.color_id);
    options += '<option value="' + s.id + '">' + (cor ? escapeHtml(cor.name) : 'Rolo') + ' — ' + Number(s.remaining_weight_g).toFixed(0) + 'g restantes</option>';
  });
  openModal(
    '<h3>Concluir impressão</h3>' +
    '<label>Rolo usado</label><select id="ccSpool">' + options + '</select>' +
    '<label>Gramas usadas</label><input id="ccGramas" type="number" step="0.1" value="' + gramasEstimado + '">' +
    '<div class="modal-actions">' +
      '<button class="btn ghost" onclick="closeModal()">Cancelar</button>' +
      '<button class="btn" onclick="salvarConclusaoImpressao(\'' + itemId + '\')">Confirmar</button>' +
    '</div>'
  );
}

async function salvarConclusaoImpressao(itemId) {
  const spoolId = document.getElementById('ccSpool').value;
  const gramas = parseFloat(document.getElementById('ccGramas').value);
  if (!spoolId) { toast('Seleciona o rolo usado.'); return; }
  if (isNaN(gramas) || gramas <= 0) { toast('Preenche as gramas usadas.'); return; }
  const { error: e1 } = await SUPA.rpc('consume_filament', {
    p_spool_id: spoolId, p_order_line_item_id: itemId, p_grams: gramas, p_reason: 'print_job_consumption',
  });
  if (e1) { toast('Erro: ' + e1.message); return; }
  const { error: e2 } = await SUPA.from('order_line_items').update({
    filament_spool_id: spoolId, grams_used_actual: gramas, line_status: 'pos_processamento', updated_at: new Date().toISOString(),
  }).eq('id', itemId);
  if (e2) { toast('Erro: ' + e2.message); return; }
  closeModal();
  toast('Impressão concluída, estoque atualizado.');
  await renderFila();
}

async function openMarcarFalha(itemId) {
  const cores = await getFilamentosSafe();
  const spools = await getSpools(true);
  let options = '<option value="">— sem perda de material —</option>';
  spools.filter((s) => s.status !== 'empty').forEach((s) => {
    const cor = cores.find((c) => c.id === s.color_id);
    options += '<option value="' + s.id + '">' + (cor ? escapeHtml(cor.name) : 'Rolo') + ' — ' + Number(s.remaining_weight_g).toFixed(0) + 'g restantes</option>';
  });
  openModal(
    '<h3>Marcar impressão como falhou</h3>' +
    '<label>Rolo usado (se perdeu material)</label><select id="mfSpool">' + options + '</select>' +
    '<label>Gramas perdidas</label><input id="mfGramas" type="number" step="0.1" value="0">' +
    '<div class="modal-actions">' +
      '<button class="btn ghost" onclick="closeModal()">Cancelar</button>' +
      '<button class="btn secondary" onclick="salvarFalha(\'' + itemId + '\')">Confirmar falha</button>' +
    '</div>'
  );
}

async function salvarFalha(itemId) {
  const spoolId = document.getElementById('mfSpool').value;
  const gramas = parseFloat(document.getElementById('mfGramas').value) || 0;
  if (spoolId && gramas > 0) {
    const { error: e1 } = await SUPA.rpc('consume_filament', {
      p_spool_id: spoolId, p_order_line_item_id: itemId, p_grams: gramas, p_reason: 'waste_failed_print',
    });
    if (e1) { toast('Erro: ' + e1.message); return; }
  }
  const { error: e2 } = await SUPA.from('order_line_items').update({ line_status: 'falhou_reimprimir', updated_at: new Date().toISOString() }).eq('id', itemId);
  if (e2) { toast('Erro: ' + e2.message); return; }
  closeModal();
  toast('Marcado como falha. Use "Reimprimir" quando quiser gerar uma nova tentativa.');
  await renderFila();
}

async function reimprimirItem(itemId) {
  const original = await q(SUPA.from('order_line_items').select('*').eq('id', itemId).maybeSingle());
  const novo = {
    order_id: original.order_id, line_type: original.line_type, product_id: original.product_id,
    custom_description: original.custom_description, custom_reference_image_path: original.custom_reference_image_path,
    custom_reference_link: original.custom_reference_link, requested_filament_color_id: original.requested_filament_color_id,
    quantity: original.quantity, unit_price: 0, unit_cost_estimate: original.unit_cost_estimate,
    line_status: 'fila_impressao', printer_id: original.printer_id, reprint_of_line_item_id: original.id,
  };
  const { error } = await SUPA.from('order_line_items').insert([novo]);
  if (error) { toast('Erro: ' + error.message); return; }
  toast('Reimpressão criada e adicionada à fila (sem cobrar de novo do cliente).');
  await renderFila();
}

/* ============================================================
   FILAMENTOS
   ============================================================ */
let filamentosCache = [];
let spoolsCache = [];
async function getFilamentos(force) {
  if (filamentosCache.length && !force) return filamentosCache;
  filamentosCache = await q(SUPA.from('filament_colors').select('*').order('name'));
  return filamentosCache;
}
async function getSpools(force) {
  if (spoolsCache.length && !force) return spoolsCache;
  spoolsCache = await q(SUPA.from('filament_spools').select('*').order('purchased_at', { ascending: false }));
  return spoolsCache;
}
// versão sem custo/kg, pra popular seletor de cor em telas que ajudante também acessa (Fila, itens de pedido)
async function getFilamentosSafe() {
  return await q(SUPA.rpc('filament_colors_safe'));
}

function estoquePorCor(colorId) {
  return spoolsCache.filter((s) => s.color_id === colorId && s.status !== 'empty')
    .reduce((sum, s) => sum + Number(s.remaining_weight_g), 0);
}

async function renderFilamentos() {
  const el = document.getElementById('tab-filamentos');
  el.innerHTML = '<div class="empty">Carregando...</div>';
  const cores = await getFilamentos(true);
  await getSpools(true);

  let html = '<div class="card">';
  html += '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">';
  html += '<strong>' + cores.length + ' cores de filamento</strong>';
  html += '<button class="btn" onclick="openFilamentoForm()">+ Nova cor</button>';
  html += '</div>';
  if (cores.length === 0) {
    html += '<div class="empty">Nenhuma cor cadastrada ainda.</div>';
  } else {
    html += '<table><tr><th></th><th>Cor</th><th>Material</th><th>Estoque</th><th>Custo/kg</th><th></th></tr>';
    cores.forEach((c) => {
      const estoqueG = estoquePorCor(c.id);
      const baixo = estoqueG <= c.low_stock_threshold_g;
      html += '<tr>';
      html += '<td><span style="display:inline-block; width:22px; height:22px; border-radius:50%; background:' + (c.hex_or_gradient || '#ccc').replace(/"/g, '') + '; border:1px solid rgba(0,0,0,0.1);"></span></td>';
      html += '<td>' + escapeHtml(c.name) + (c.active ? '' : ' <span style="color:var(--muted);font-size:11px;">(inativa)</span>') + '</td>';
      html += '<td>' + escapeHtml(c.material) + '</td>';
      html += '<td><span class="badge ' + (baixo ? 'off' : 'on') + '">' + estoqueG.toFixed(0) + ' g' + (baixo ? ' · baixo!' : '') + '</span></td>';
      html += '<td>' + fmtMoney(c.cost_per_kg) + '</td>';
      html += '<td class="row-actions">';
      html += '<button class="btn ghost" onclick="openFilamentoForm(\'' + c.id + '\')">Editar</button>';
      html += '<button class="btn ghost" onclick="openSpoolForm(\'' + c.id + '\')">+ Rolo</button>';
      html += '<button class="btn ghost" onclick="toggleSpoolsList(\'' + c.id + '\')">Rolos</button>';
      html += '</td>';
      html += '</tr>';
      html += '<tr id="spools-' + c.id + '" class="hidden"><td colspan="6">' + renderSpoolsMini(c.id) + '</td></tr>';
    });
    html += '</table>';
  }
  html += '</div>';
  el.innerHTML = html;
}

function renderSpoolsMini(colorId) {
  const spools = spoolsCache.filter((s) => s.color_id === colorId);
  if (spools.length === 0) return '<div class="empty">Nenhum rolo cadastrado pra essa cor.</div>';
  let html = '<table style="font-size:12px;"><tr><th>Comprado em</th><th>Inicial</th><th>Restante</th><th>Status</th></tr>';
  spools.forEach((s) => {
    html += '<tr><td>' + fmtDate(s.purchased_at) + '</td><td>' + Number(s.initial_weight_g).toFixed(0) + ' g</td>';
    html += '<td>' + Number(s.remaining_weight_g).toFixed(0) + ' g</td><td>' + escapeHtml(s.status) + '</td></tr>';
  });
  html += '</table>';
  return html;
}

function toggleSpoolsList(colorId) {
  document.getElementById('spools-' + colorId).classList.toggle('hidden');
}

function openFilamentoForm(id) {
  const c = id ? filamentosCache.find((x) => x.id === id) : null;
  openModal(
    '<h3>' + (c ? 'Editar cor' : 'Nova cor de filamento') + '</h3>' +
    '<label>Nome</label><input id="flNome" value="' + (c ? escapeHtml(c.name) : '') + '" placeholder="Ex: Azul Céu">' +
    '<label>Material</label><input id="flMaterial" value="' + (c ? escapeHtml(c.material) : 'PLA') + '">' +
    '<label>Cor (CSS, ex: #4db8d4)</label><input id="flCor" value="' + (c ? escapeHtml(c.hex_or_gradient || '') : '') + '">' +
    '<label>Custo por kg (R$)</label><input id="flCusto" type="number" step="0.01" value="' + (c ? c.cost_per_kg : 0) + '">' +
    '<label>Alerta de estoque baixo (gramas)</label><input id="flLimite" type="number" value="' + (c ? c.low_stock_threshold_g : 200) + '">' +
    '<div class="modal-actions">' +
      '<button class="btn ghost" onclick="closeModal()">Cancelar</button>' +
      '<button class="btn" onclick="saveFilamento(' + (c ? "'" + id + "'" : 'null') + ')">Salvar</button>' +
    '</div>'
  );
}

async function saveFilamento(id) {
  const name = document.getElementById('flNome').value.trim();
  const material = document.getElementById('flMaterial').value.trim() || 'PLA';
  const hex_or_gradient = document.getElementById('flCor').value.trim() || null;
  const cost_per_kg = parseFloat(document.getElementById('flCusto').value) || 0;
  const low_stock_threshold_g = parseFloat(document.getElementById('flLimite').value) || 200;
  if (!name) { toast('Preenche o nome da cor.'); return; }
  const payload = { name, material, hex_or_gradient, cost_per_kg, low_stock_threshold_g };
  const { error } = id
    ? await SUPA.from('filament_colors').update(payload).eq('id', id)
    : await SUPA.from('filament_colors').insert([payload]);
  if (error) { toast('Erro: ' + error.message); return; }
  closeModal();
  toast('Cor salva.');
  await renderFilamentos();
}

function openSpoolForm(colorId) {
  const c = filamentosCache.find((x) => x.id === colorId);
  openModal(
    '<h3>Novo rolo — ' + escapeHtml(c.name) + '</h3>' +
    '<label>Peso inicial (gramas)</label><input id="spPeso" type="number" value="1000">' +
    '<label>Valor pago (R$)</label><input id="spCusto" type="number" step="0.01" value="' + (c.cost_per_kg || 0) + '">' +
    '<label>Fornecedor</label><input id="spFornecedor">' +
    '<label>Data da compra</label><input id="spData" type="date" value="' + todayISO() + '">' +
    '<div class="modal-actions">' +
      '<button class="btn ghost" onclick="closeModal()">Cancelar</button>' +
      '<button class="btn" onclick="saveSpool(\'' + colorId + '\')">Adicionar rolo</button>' +
    '</div>'
  );
}

async function saveSpool(colorId) {
  const initial_weight_g = parseFloat(document.getElementById('spPeso').value);
  const cost_paid = parseFloat(document.getElementById('spCusto').value) || null;
  const supplier = document.getElementById('spFornecedor').value.trim() || null;
  const purchased_at = document.getElementById('spData').value || null;
  if (isNaN(initial_weight_g) || initial_weight_g <= 0) { toast('Preenche o peso do rolo.'); return; }
  const { error } = await SUPA.rpc('add_filament_spool', {
    p_color_id: colorId, p_initial_weight_g: initial_weight_g, p_cost_paid: cost_paid, p_supplier: supplier, p_purchased_at: purchased_at,
  });
  if (error) { toast('Erro: ' + error.message); return; }
  closeModal();
  toast('Rolo adicionado.');
  await renderFilamentos();
}

let impressorasCache = [];

async function getImpressorasSafe() {

}

async function renderImpressoras() {

function openImpressoraForm(id) {
  const p = id ? impressorasCache.find((x) => x.id === id) : null;
  const watts = p ? (p.power_watts || 0) : 150;
  const preco = p ? (p.energy_price_per_kwh || 1.20) : 1.20;
  openModal(
    '<h3>' + (p ? 'Editar impressora' : 'Nova impressora') + '</h3>' +
    '<label>Nome</label><input id="ipNome" value="' + (p ? escapeHtml(p.name) : '') + '" placeholder="Ex: Bambu Lab A1">' +
    '<label>Modelo</label><input id="ipModelo" value="' + (p ? escapeHtml(p.model || '') : '') + '">' +
    '<label>Potência média durante impressão (W)</label><input id="ipPotencia" type="number" step="1" value="' + watts + '" oninput="atualizarCustoHoraImpressora()">' +
    '<div style="color:var(--muted); font-size:11px; margin-top:-2px;">Use a média real de consumo, não o pico do fabricante (aquecedores ciclam ligado/desligado).</div>' +
    '<label>Preço da energia (R$/kWh)</label><input id="ipPrecoEnergia" type="number" step="0.01" value="' + preco + '" oninput="atualizarCustoHoraImpressora()">' +
    '<label>Custo por hora (calculado)</label><input id="ipCustoCalculado" type="text" value="" disabled style="background:#f3f4f7;">' +
    '<label>Status</label>' +
    '<select id="ipAtiva"><option value="true"' + (!p || p.active ? ' selected' : '') + '>Ativa</option><option value="false"' + (p && !p.active ? ' selected' : '') + '>Inativa</option></select>' +
    '<div class="modal-actions">' +
      '<button class="btn ghost" onclick="closeModal()">Cancelar</button>' +
      '<button class="btn" onclick="saveImpressora(' + (p ? "'" + id + "'" : 'null') + ')">Salvar</button>' +
    '</div>'
  );
  atualizarCustoHoraImpressora();
}

function calcularCustoHoraImpressora() {
  const watts = parseFloat(document.getElementById('ipPotencia').value) || 0;
  const preco = parseFloat(document.getElementById('ipPrecoEnergia').value) || 0;
  return (watts / 1000) * preco;
}

function atualizarCustoHoraImpressora() {
  document.getElementById('ipCustoCalculado').value = fmtMoney(calcularCustoHoraImpressora()) + ' / hora';
}

async function saveImpressora(id) {
  const name = document.getElementById('ipNome').value.trim();
  const model = document.getElementById('ipModelo').value.trim();
  const power_watts = parseFloat(document.getElementById('ipPotencia').value) || null;
  const energy_price_per_kwh = parseFloat(document.getElementById('ipPrecoEnergia').value) || null;
  const hourly_cost = calcularCustoHoraImpressora();
  const active = document.getElementById('ipAtiva').value === 'true';
  if (!name) { toast('Preenche o nome da impressora.'); return; }
  const payload = { name, model: model || null, power_watts, energy_price_per_kwh, hourly_cost, active };
  const { error } = id
    ? await SUPA.from('printers').update(payload).eq('id', id)
    : await SUPA.from('printers').insert([payload]);
  if (error) { toast('Erro: ' + error.message); return; }
  closeModal();
  toast('Impressora salva.');
  await renderImpressoras();
}

const CATEGORY_LABELS = {
  products: 'Vasos & Decoração',
  cars: 'Brinquedos & Expositores',
  holders: 'Porta Cards',
  utils: 'Suportes & Utilidades',
  wines: 'Bar & Vinhos',
  keychains: 'Chaveiros',
  phoneStands: 'Suportes para Celular',
  deskOrganizers: 'Organizadores de Mesa',
  books: 'Livros & Leitura',
  minis: 'Miniaturas & Personagens',
};

let produtosCache = [];
async function getProdutos(force) {
  if (produtosCache.length && !force) return produtosCache;
  produtosCache = await q(SUPA.from('products').select('*').order('catalog_code'));
  return produtosCache;
}

let produtosFiltroTexto = '';
let produtosFiltroCategoria = '';
function produtosFiltrados() {
  const termo = produtosFiltroTexto.trim().toLowerCase();
  return produtosCache.filter((p) => {
    if (produtosFiltroCategoria && p.category !== produtosFiltroCategoria) return false;
    if (!termo) return true;
    return (p.name || '').toLowerCase().includes(termo) || (p.catalog_code || '').toLowerCase().includes(termo);
  });
}

let receitasCache = [];
async function getReceitas(force) {
  if (receitasCache.length && !force) return receitasCache;
  receitasCache = await q(SUPA.from('product_recipes').select('*'));
  return receitasCache;
}

function calcularCustoReceita(receita) {
  if (!receita) return null;
  const cor = filamentosCache.find((c) => c.id === receita.filament_color_id);
  const impressora = impressorasCache.find((p) => p.id === receita.printer_id);
  const custoMaterial = cor ? (receita.estimated_grams / 1000) * cor.cost_per_kg : 0;
  const custoMaquina = impressora && impressora.hourly_cost ? receita.estimated_print_hours * impressora.hourly_cost : 0;
  const custoMaoObra = receita.post_processing_labor_rate ? (receita.post_processing_minutes / 60) * receita.post_processing_labor_rate : 0;
  return {
    custoMaterial, custoMaquina, custoMaoObra,
    total: custoMaterial + custoMaquina + custoMaoObra,
    corFaltando: !cor, impressoraFaltando: !impressora,
  };
}

let _fatiamentoPollTimer = null;

function renderFatiamentoCell(p) {
  if (!p.model_file_path) return '<span style="color:var(--muted); font-size:11px;">sem arquivo 3D</span>';
  if (p.open_slicer_status === 'queued') return '<span class="badge off">Abrindo…</span>';
  if (p.open_slicer_status === 'error') {
    return '<span class="badge off" title="' + escapeHtml(p.open_slicer_error || '') + '" style="cursor:help;">Erro</span>' +
      '<div style="font-size:11px; color:var(--muted); margin-top:3px; max-width:220px;">' + escapeHtml(p.open_slicer_error || '') + '</div>';
  }
  return '<span style="color:var(--muted); font-size:11px;">pronto pra abrir</span>';
}

function renderFatiamentoBtns(p) {
  if (!p.model_file_path) return '';
  let out = '';
  const emAndamento = p.open_slicer_status === 'queued';
  if (!emAndamento) {
    out += '<button class="btn ghost" onclick="solicitarAbrirFatiador(\'' + p.id + '\')">' +
      (p.open_slicer_status === 'error' ? '🔁 Tentar de novo' : '🖥️ Abrir no Fatiador') + '</button>';
  }
  const emAndamentoIA = p.ai_analysis_status === 'queued' || p.ai_analysis_status === 'processing';
  if (p.ai_analysis_status === 'done') {
    out += '<button class="btn ghost" onclick="verAnaliseIA(\'' + p.id + '\')">🤖 Ver colinha</button>';
  } else if (!emAndamentoIA) {
    out += '<button class="btn ghost" onclick="solicitarAnaliseIA(\'' + p.id + '\')">' +
      (p.ai_analysis_status === 'error' ? '🔁 Tentar IA de novo' : '🤖 Analisar com IA') + '</button>';
  } else {
    out += '<span class="badge off">' + (p.ai_analysis_status === 'queued' ? 'IA na fila' : 'IA analisando…') + '</span>';
  }
  return out;
}

async function renderProdutos() {
  await getProdutos(true);
  const isOwner = currentProfile && currentProfile.role === 'owner';
  if (isOwner) { await getReceitas(true); await getFilamentos(); await getImpressoras(); }
  desenharProdutos();
}

function onFiltroProdutosTexto(v) { produtosFiltroTexto = v; desenharProdutos(); }
function onFiltroProdutosCategoria(v) { produtosFiltroCategoria = v; desenharProdutos(); }

function desenharProdutos() {
  const el = document.getElementById('tab-produtos');
  if (!el) return;
  const scrollY = window.scrollY;
  const isOwner = currentProfile && currentProfile.role === 'owner';
  const produtos = produtosFiltrados();

  let opcoesCategoria = '<option value="">Todas as categorias</option>';
  Object.keys(CATEGORY_LABELS).forEach((k) => {
    opcoesCategoria += '<option value="' + k + '"' + (produtosFiltroCategoria === k ? ' selected' : '') + '>' + escapeHtml(CATEGORY_LABELS[k]) + '</option>';
  });

  let html = '<div class="card">';
  html += '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:12px; flex-wrap:wrap;">';
  html += '<strong>' + produtos.length + ' de ' + produtosCache.length + ' produtos</strong>';
  html += '<div style="display:flex; gap:8px; flex:1; max-width:520px; min-width:240px;">';
  html += '<input type="text" placeholder="🔍 Buscar por nome ou código..." value="' + escapeHtml(produtosFiltroTexto) + '" oninput="onFiltroProdutosTexto(this.value)" style="flex:1;">';
  html += '<select onchange="onFiltroProdutosCategoria(this.value)" style="width:auto;">' + opcoesCategoria + '</select>';
  html += '</div>';
  html += '</div>';
  if (produtos.length === 0) {
    html += '<div class="empty">Nenhum produto encontrado' + (produtosFiltroTexto || produtosFiltroCategoria ? ' com esse filtro.' : ' ainda.') + '</div>';
  } else {
    html += '<table><tr><th></th><th>Código</th><th>Categoria</th><th>Nome</th><th>Preço</th>' + (isOwner ? '<th>Margem</th>' : '') + '<th>Status</th>' + (isOwner ? '<th>Arquivo 3D</th><th></th>' : '') + '</tr>';
    produtos.forEach((p) => {
      html += '<tr>';
      html += '<td><img class="thumb" src="catalogo/' + escapeHtml(p.image_path || '') + '" onerror="this.style.visibility=\'hidden\'"></td>';
      html += '<td>' + escapeHtml(p.catalog_code) + '</td>';
      html += '<td>' + escapeHtml(CATEGORY_LABELS[p.category] || p.category) + '</td>';
      html += '<td class="prod-name">' + escapeHtml(p.name) + '</td>';
      html += '<td>' + fmtMoney(p.sale_price) + (p.price_unit_note ? ' <span style="color:var(--muted);font-size:11px;">' + escapeHtml(p.price_unit_note) + '</span>' : '') + '</td>';
      if (isOwner) {
        const receita = receitasCache.find((r) => r.product_id === p.id);
        const custo = calcularCustoReceita(receita);
        if (custo) {
          const margemPct = p.sale_price > 0 ? ((p.sale_price - custo.total) / p.sale_price * 100) : 0;
          html += '<td><span class="badge ' + (margemPct >= 40 ? 'on' : 'off') + '">' + margemPct.toFixed(0) + '%</span></td>';
        } else {
          html += '<td style="color:var(--muted); font-size:12px;">sem receita</td>';
        }
      }
      html += '<td><span class="badge ' + (p.active ? 'on' : 'off') + '">' + (p.active ? 'Ativo' : 'Inativo') + '</span></td>';
      if (isOwner) {
        html += '<td>' + (p.model_file_path
          ? '<span class="badge on" title="Tem arquivo 3D anexado">📦 Tem 3D</span>'
          : '<span class="badge off" title="Ainda sem arquivo 3D">✖️ Sem 3D</span>') + '</td>';
        html += '<td><button class="btn" onclick="abrirGerenciarProduto(\'' + p.id + '\')">⚙️ Gerenciar</button></td>';
      }
      html += '</tr>';
    });
    html += '</table>';
  }
  html += '</div>';
  el.innerHTML = html;
  window.scrollTo(0, scrollY);
  requestAnimationFrame(() => window.scrollTo(0, scrollY));

  clearTimeout(_fatiamentoPollTimer);
  const emAndamento = produtosCache.some((p) =>
    p.open_slicer_status === 'queued' ||
    p.ai_analysis_status === 'queued' || p.ai_analysis_status === 'processing');
  if (emAndamento && !el.classList.contains('hidden')) {
    _fatiamentoPollTimer = setTimeout(() => { renderProdutos(); }, 4000);
  }
}

      '<div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-top:1px solid var(--border);">' +
        '<span>Arquivo 3D' + (p.model_file_path ? ' <span class="badge on">anexado</span>' : ' <span style="color:var(--muted); font-size:11px;">nenhum</span>') + '</span>' +

      '</div>' +
    '</div>' +
    '<div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Fechar</button></div>',
    { wide: true }
  );

async function solicitarAbrirFatiador(productId) {
  const { error } = await SUPA.from('products').update({
    open_slicer_status: 'queued', open_slicer_requested_at: new Date().toISOString(), open_slicer_error: null,
  }).eq('id', productId);
  if (error) { toast('Erro: ' + error.message); return; }

  await renderProdutos();
  if (_produtoGerenciarAberto === productId) abrirGerenciarProduto(productId);

  toast('Análise pedida — o agente local processa em instantes.');

  if (_produtoGerenciarAberto === productId) abrirGerenciarProduto(productId);
}

function formatarColinha(texto) {
  const linhas = (texto || '(sem conteúdo)').split('\n');
  let html = '';
  for (const linha of linhas) {
    if (/^##\s+/.test(linha)) {
      html += '<div style="font-family:\'Space Grotesk\',sans-serif; font-weight:700; font-size:13.5px; color:var(--blue); margin:14px 0 4px;">' + escapeHtml(linha.replace(/^##\s+/, '')) + '</div>';
    } else if (/^-\s+/.test(linha)) {
      html += '<div style="padding-left:14px; margin:2px 0;">• ' + escapeHtml(linha.replace(/^-\s+/, '')) + '</div>';
    } else if (linha.trim() === '') {
      html += '';
    } else {
      html += '<div style="margin:2px 0;">' + escapeHtml(linha) + '</div>';
    }
  }
  return html;
}

function openModelo3DForm(productId) {
  const p = produtosCache.find((x) => x.id === productId);
  openModal(
    '<h3>Arquivo 3D — ' + escapeHtml(p.name) + '</h3>' +
    (p.model_file_path
      ? '<p style="font-size:13px;">Arquivo atual: <strong>' + escapeHtml(p.model_file_path.split('/').pop()) + '</strong>' +
        (p.model_source === 'meshy_generated' ? ' <span style="color:var(--muted);font-size:11px;">(gerado por IA)</span>' : '') + '</p>' +
        '<button class="btn ghost" onclick="baixarModelo3D(\'' + productId + '\')">Baixar</button> ' +
        '<button class="btn ghost" onclick="removerModelo3D(\'' + productId + '\')">Remover</button>'
      : '<p style="color:var(--muted); font-size:13px;">Nenhum arquivo 3D cadastrado ainda.</p>') +
    '<label style="margin-top:16px;">Enviar arquivo (.stl ou .3mf)</label>' +

      '<button class="btn" onclick="uploadModelo3D(\'' + productId + '\')">Enviar</button>' +
